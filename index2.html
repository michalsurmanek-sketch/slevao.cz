// --- Generování demo slev (doplnění na 200 položek) ---
// Pozn.: Je to jen demo dataset pro MVP náhled. Později to vyměníš za reálná data (scrape/API/ruční admin).
(function inflateDealsTo(targetTotal){
  const TODAY = "2026-02-06";
  const validTos = ["2026-02-08","2026-02-09","2026-02-10","2026-02-12","2026-02-14","2026-02-15","2026-02-16","2026-02-18","2026-02-20"];

  const byCat = {
    carb: [
      ["Těstoviny",["penne","fusilli","špagety","kolínka","vrtule"],["500 g","1 kg"]],
      ["Rýže",["jasmínová","basmati","parboiled","kulatozrnná"],["1 kg"]],
      ["Cereálie",["ovesné","kukuřičné","čokoládové"],["375 g","500 g"]],
      ["Pečivo",["rohlík","houska","bageta","toustový chléb"],["1 ks","500 g"]],
      ["Brambory",["prané","salátové","na kaši"],["2 kg","5 kg"]]
    ],
    protein: [
      ["Kuřecí",["prsa","stehna","křídla"],["1 kg","500 g"]],
      ["Vepřové",["plec","kotleta","mleté"],["1 kg","500 g"]],
      ["Hovězí",["mleté","na guláš"],["500 g"]],
      ["Ryba",["tuňák","losos","treska"],["1 ks","200 g","500 g"]],
      ["Luštěniny",["čočka","cizrna","fazole"],["500 g","1 kg"]],
      ["Vejce",["M","L"],["10 ks"]]
    ],
    veg: [
      ["Zelenina",["rajčata","okurka","paprika","mrkev","cibule","salát"],["1 ks","500 g","1 kg"]],
      ["Mražená zelenina",["mix","hrášek","kukuřice"],["450 g","750 g"]]
    ],
    dairy: [
      ["Mléko",["polotučné","plnotučné"],["1 l"]],
      ["Jogurt",["bílý","ovocný","řecký"],["150 g","1 ks"]],
      ["Sýr",["plátky","strouhaný","eidam"],["150 g","200 g"]],
      ["Tvaroh",["měkký","odtučněný"],["250 g"]]
    ],
    fruit: [
      ["Ovoce",["jablka","banány","pomeranče","hrozny"],["1 kg","500 g"]]
    ],
    pantry: [
      ["Olej",["slunečnicový","řepkový"],["1 l"]],
      ["Kečup",["jemný","pikantní"],["500 g"]],
      ["Omáčka",["rajčatová","smetanová"],["400 g"]],
      ["Konzerva",["kukuřice","hrášek","rajčata"],["1 ks"]],
      ["Koření",["gril","italské bylinky","paprika"],["1 ks"]]
    ],
    drink: [
      ["Voda",["neperlivá","perlivá"],["1.5 l"]],
      ["Džus",["pomeranč","jablko"],["1 l"]]
    ],
    other: [
      ["Sladkost",["sušenky","čokoláda","tyčinka"],["1 ks","100 g"]],
      ["Káva",["mletá","zrnková"],["250 g"]]
    ]
  };

  const storeIds = DB.stores.map(s=>s.id);
  const tagPools = {
    carb: ["rodina","rychle"],
    protein: ["rodina","rychle"],
    veg: ["rychle","bez-plyt"],
    dairy: ["rodina","rychle"],
    fruit: ["bez-plyt"],
    pantry: ["rodina"],
    drink: ["rychle"],
    other: ["rychle"]
  };

  function rand(seed){
    // jednoduchý deterministický pseudo-random (aby to bylo stabilní)
    const x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }

  function pick(arr, r){
    return arr[Math.floor(r * arr.length)];
  }

  function makeNextId(){
    let maxN = 0;
    for (const d of DB.deals){
      if (typeof d.id === "string" && d.id.startsWith("d")){
        const n = parseInt(d.id.slice(1), 10);
        if (!Number.isNaN(n)) maxN = Math.max(maxN, n);
      }
    }
    return () => {
      maxN += 1;
      return "d" + maxN;
    };
  }

  const nextId = makeNextId();
  const categories = Object.keys(byCat);

  while (DB.deals.length < targetTotal){
    const seed = DB.deals.length + 17;
    const cat = pick(categories, rand(seed));
    const pack = pick(byCat[cat], rand(seed*3));

    const base = pack[0];
    const variant = pick(pack[1], rand(seed*7));
    const unit = pick(pack[2], rand(seed*11));
    const store_id = pick(storeIds, rand(seed*13));

    const basePriceMap = {
      carb:[12,55], protein:[29,139], veg:[12,59], dairy:[12,69], fruit:[19,69], pantry:[19,89], drink:[12,49], other:[15,99]
    };
    const range = basePriceMap[cat] || [19,79];
    const price = Math.round(range[0] + rand(seed*19) * (range[1]-range[0]));
    const old_price = Math.round(price + (5 + rand(seed*23)*35));

    const valid_to = pick(validTos, rand(seed*29));
    const tagsBase = tagPools[cat] || [];
    const tags = [...new Set([
      pick(tagsBase, rand(seed*31)) || "rychle",
      rand(seed*37) > 0.7 ? "bez-plyt" : (rand(seed*41) > 0.7 ? "rodina" : null)
    ].filter(Boolean))];

    let product = `${base} ${variant}`
      .replace("Pečivo rohlík","Rohlík")
      .replace("Pečivo houska","Houska")
      .replace("Pečivo bageta","Bageta")
      .replace("Pečivo toustový chléb","Toustový chléb");

    // malý trik pro větší rozmanitost a hledání (číslo varianty)
    const suffix = Math.floor(rand(seed*47) * 9) + 1;
    if (rand(seed*53) > 0.65) product = product + " " + suffix;

    DB.deals.push({
      id: nextId(),
      store_id,
      product,
      category: cat,
      price,
      old_price,
      unit,
      valid_from: TODAY,
      valid_to,
      tags
    });
  }
})(200);

const app = document.getElementById("app");
const state = { scenario: null, days: null, budget: null };

const SCENARIOS = [
  {id:"cook", icon:"🧠", title:"Uvařit levně", subtitle:"Plán nákupu podle rozpočtu"},
  {id:"family", icon:"👨‍👩‍👧", title:"Rodinný nákup", subtitle:"Mix pro 3–4 lidi"},
  {id:"fast", icon:"⚡", title:"Rychle & blízko", subtitle:"Rychlý výběr z top slev"},
  {id:"noplyt", icon:"💚", title:"Bez plýtvání", subtitle:"Krátká platnost / záchrana"},
  {id:"top", icon:"🔥", title:"Top úlovky", subtitle:"Největší úspory"}
];

/** ===== Helpers ===== */
function storeName(id){ return DB.stores.find(s=>s.id===id)?.name || id; }
function saving(deal){ return Math.max(0, (deal.old_price ?? deal.price) - deal.price); }

function scoreDeal(deal, scenario){
  const s = saving(deal);
  const rel = deal.old_price ? (s / deal.old_price) : 0;
  let bonus = 0;
  const tags = deal.tags || [];
  if ((scenario==="cook" || scenario==="family") && tags.includes("rodina")) bonus += 3;
  if ((scenario==="fast") && tags.includes("rychle")) bonus += 3;
  if ((scenario==="noplyt") && tags.includes("bez-plyt")) bonus += 3;
  if (scenario==="top") bonus += 1;
  return s*2 + rel*10 + bonus;
}

/** ===== LocalStorage: Plans ===== */
function savePlan(plan){
  const key = "slevao_plans";
  const list = JSON.parse(localStorage.getItem(key) || "[]");
  const entry = { ts: Date.now(), ...plan };
  list.unshift(entry);
  localStorage.setItem(key, JSON.stringify(list.slice(0,3)));
}
function readSavedPlans(){ return JSON.parse(localStorage.getItem("slevao_plans") || "[]"); }

/** ===== LocalStorage: List (Leták) ===== */
function getList(){ return JSON.parse(localStorage.getItem("slevao_list") || "[]"); }
function setList(items){ localStorage.setItem("slevao_list", JSON.stringify(items)); }
function addToList(dealId){
  const deal = DB.deals.find(d=>d.id===dealId);
  if (!deal) return;
  const list = getList();
  const exists = list.some(x => x.deal_id === dealId);
  if (!exists){
    list.unshift({ deal_id: dealId, added_ts: Date.now() });
    setList(list.slice(0,50));
  }
  toast("Přidáno do seznamu");
}
function removeFromList(dealId){
  const list = getList().filter(x=>x.deal_id!==dealId);
  setList(list);
  toast("Odebráno");
}

/** ===== Toast ===== */
let toastTimer = null;
function toast(msg){
  clearTimeout(toastTimer);
  let el = document.getElementById("toast");
  if (!el){
    el = document.createElement("div");
    el.id = "toast";
    el.className = "fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-2xl bg-slate-900 border border-slate-700 text-sm text-slate-100 shadow-lg";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = "1";
  toastTimer = setTimeout(()=>{ el.style.opacity="0"; }, 1200);
}

/** ===== Planner ===== */
function buildPlan({scenario, days, budget}){
  const wanted = {
    carb: (days>=7?3:2),
    protein: 2,
    veg: 2,
    dairy: 1
  };

  const byCat = {};
  for (const d of DB.deals){
    byCat[d.category] ??= [];
    byCat[d.category].push({...d, _score: scoreDeal(d, scenario), _saving: saving(d)});
  }
  for (const cat in byCat){
    byCat[cat].sort((a,b)=> b._score - a._score);
  }

  let basket = [];
  for (const cat of Object.keys(wanted)){
    const picks = (byCat[cat] || []).slice(0, wanted[cat]);
    basket.push(...picks);
  }

  if (scenario==="top"){
    const extra = DB.deals
      .map(d=>({...d,_score:scoreDeal(d,scenario),_saving:saving(d)}))
      .sort((a,b)=> (b._saving - a._saving) || (b._score - a._score))
      .slice(0, 3);
    basket.push(...extra);
  }

  // dedupe by store+product
  const seen = new Set();
  basket = basket.filter(d=>{
    const key = d.store_id+"|"+d.product;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });

  const total = () => basket.reduce((sum,d)=> sum + d.price, 0);
  while (total() > budget && basket.length > 4){
    basket.sort((a,b)=> (a._score/a.price) - (b._score/b.price)); // worst first
    basket.shift();
  }

  const totalPrice = total();
  const totalSaving = basket.reduce((sum,d)=> sum + d._saving, 0);

  const stores = {};
  for (const d of basket){
    stores[d.store_id] ??= [];
    stores[d.store_id].push(d);
  }

  return { basket, stores, totalPrice, totalSaving };
}

                  <div class="text-sm font-semibold">${d.product} <span class="text-xs text-slate-400">(${d.unit})</span></div>
                  <div class="text-xs text-slate-500">${d.category.toUpperCase()} • platí do ${d.valid_to}</div>
                </div>
                <div class="text-right">
                  <div class="text-sm font-black">${d.price} Kč</div>
                  <div class="text-xs text-slate-400 line-through">${d.old_price} Kč</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>

    <div class="flex gap-2">
      <button class="flex-1 p-3 rounded-2xl bg-sky-500 text-slate-950 font-bold" onclick="saveCurrentPlan()">Uložit plán</button>
      <button class="flex-1 p-3 rounded-2xl bg-slate-900 border border-slate-800" onclick="goHome()">Nový výběr</button>
    </div>
  `;
}

/** ===== Leták 2.0 (ENTER = hledat) + filtry + řazení + stránkování ===== */
function renderFlyer(){
  setActiveNav("navFlyer");

  const storeOptions = [{id:"all", name:"Vše"}].concat(DB.stores);
  const selectedStore = window._flyerStore || "all";

  const query = (window._flyerQuery || "").trim();
  const applied = (window._flyerAppliedQuery || "").trim();
  const q = applied.toLowerCase();

  const cat = window._flyerCategory || "all";
  const maxPrice = (typeof window._flyerMaxPrice === "number") ? window._flyerMaxPrice : 0; // 0 = bez limitu
  const sort = window._flyerSort || "saving"; // saving | cheapest | expSoon

  const pageSize = 20;
  const page = Math.max(1, window._flyerPage || 1);

  // filtr + výpočty
  let deals = DB.deals
    .filter(d => selectedStore==="all" ? true : d.store_id===selectedStore)
    .filter(d => q ? (d.product.toLowerCase().includes(q) || d.category.toLowerCase().includes(q)) : true)
    .filter(d => cat==="all" ? true : d.category===cat)
    .filter(d => maxPrice>0 ? d.price<=maxPrice : true)
    .map(d => ({...d, _saving: saving(d)}));

  // řazení
  if (sort === "cheapest"){
    deals.sort((a,b)=> (a.price - b.price) || (b._saving - a._saving));
  } else if (sort === "expSoon"){
    deals.sort((a,b)=> (String(a.valid_to).localeCompare(String(b.valid_to))) || (b._saving - a._saving));
  } else {
    // default: největší úspora
    deals.sort((a,b)=> (b._saving - a._saving) || (b.old_price - a.old_price));
  }

  const total = deals.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const safePage = Math.min(page, totalPages);
  window._flyerPage = safePage;

  const start = (safePage - 1) * pageSize;
  const end = start + pageSize;
  const pageDeals = deals.slice(start, end);

  const categories = [
    {id:"all", name:"Vše"},
    {id:"carb", name:"Sacharidy"},
    {id:"protein", name:"Bílkoviny"},
    {id:"veg", name:"Zelenina"},
    {id:"dairy", name:"Mléčné"},
    {id:"fruit", name:"Ovoce"},
    {id:"pantry", name:"Trvanlivé"},
    {id:"drink", name:"Pití"},
    {id:"other", name:"Ostatní"}
  ];

  const priceOptions = [
    {v:0, t:"Bez limitu"},
    {v:20, t:"Do 20 Kč"},
    {v:30, t:"Do 30 Kč"},
    {v:50, t:"Do 50 Kč"},
    {v:80, t:"Do 80 Kč"},
    {v:120, t:"Do 120 Kč"}
  ];

  const sortOptions = [
    {v:"saving", t:"Největší sleva"},
    {v:"cheapest", t:"Nejlevnější"},
    {v:"expSoon", t:"Končí nejdřív"}
  ];

  app.innerHTML = `
    <div class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800">
      <div class="text-xl font-black">Leták 2.0</div>
      <div class="text-sm text-slate-400 mt-1">Piš → Enter = hledat. Filtry + řazení + stránkování.</div>

      <div class="mt-3 grid grid-cols-2 gap-2">
        <select class="p-3 rounded-2xl bg-slate-900 border border-slate-800 text-sm" onchange="setFlyerStore(this.value)">
          ${storeOptions.map(s=>`<option value="${s.id}" ${s.id===selectedStore?'selected':''}>${s.name}</option>`).join('')}
        </select>

        <input id="flyerSearch" class="p-3 rounded-2xl bg-slate-900 border border-slate-800 text-sm"
               placeholder="Hledat (např. mléko)" value="${escapeHtml(query)}"
               oninput="setFlyerQuery(this.value)" onkeydown="flyerSearchKey(event)" />
      </div>

      <div class="mt-2 flex flex-wrap gap-2 justify-center">
        <button class="px-3 py-2 rounded-xl text-sm border bg-slate-900 border-slate-800" onclick="setFlyerPage(1)">⏮</button>
        ${(() => {
          const pages = [];
          const maxBtns = 7; // kolik čísel zobrazit
          let startP = Math.max(1, safePage - Math.floor(maxBtns/2));
          let endP = Math.min(totalPages, startP + maxBtns - 1);
          if (endP - startP + 1 < maxBtns) startP = Math.max(1, endP - maxBtns + 1);

          for (let p = startP; p <= endP; p++){
            pages.push(`
              <button class="px-3 py-2 rounded-xl text-sm border ${p===safePage ? 'bg-sky-500 text-slate-950 border-sky-500 font-bold' : 'bg-slate-900 border-slate-800'}"
                      onclick="setFlyerPage(${p})">${p}</button>
            `);
          }
          return pages.join('');
        })()}
        <button class="px-3 py-2 rounded-xl text-sm border bg-slate-900 border-slate-800" onclick="setFlyerPage(${totalPages})">⏭</button>
      </div>
    </div>

    <div class="space-y-3">
      ${pageDeals.length ? pageDeals.map(DealCard).join('') : `<div class="text-sm text-slate-400">Nic nenalezeno.</div>`}
    </div>

    <div class="mt-3 p-3 rounded-2xl bg-slate-900/30 border border-slate-800 text-xs text-slate-500">
      Tip: napiš do vyhledávání a zmáčkni <span class="text-slate-200 font-semibold">Enter</span>. Filtry se aplikují hned.
    </div>
  `;

  setTimeout(()=>document.getElementById("flyerSearch")?.focus(), 50);
}

function setFlyerStore(id){ window._flyerStore = id; window._flyerPage = 1; renderFlyer(); }
function setFlyerQuery(v){ window._flyerQuery = v; }
function flyerSearchKey(e){
  if (e.key === "Enter"){
    e.preventDefault();
    applyFlyerSearch();
  }
}
function applyFlyerSearch(){ window._flyerAppliedQuery = (window._flyerQuery || "").trim(); window._flyerPage = 1; renderFlyer(); }
function clearFlyerSearch(){ window._flyerQuery = ""; window._flyerAppliedQuery = ""; window._flyerPage = 1; renderFlyer(); toast("Vymazáno"); }

function setFlyerCategory(v){ window._flyerCategory = v; window._flyerPage = 1; renderFlyer(); }
function setFlyerMaxPrice(v){ window._flyerMaxPrice = parseInt(v,10) || 0; window._flyerPage = 1; renderFlyer(); }
function setFlyerSort(v){ window._flyerSort = v; window._flyerPage = 1; renderFlyer(); }
function setFlyerPage(p){
  const next = parseInt(p,10);
  if (Number.isNaN(next)) return;
  window._flyerPage = Math.max(1, next);
  renderFlyer();
}

/** ===== Seznam ===== */
function renderList(){
  setActiveNav("navList");
  const list = getList();
  const items = list
    .map(x => {
      const d = DB.deals.find(dd => dd.id === x.deal_id);
      return d ? {...d, _saving: saving(d), _added: x.added_ts} : null;
    })
    .filter(Boolean);

  const totalPrice = items.reduce((sum,d)=>sum+d.price,0);
  const totalSaving = items.reduce((sum,d)=>sum+d._saving,0);

  app.innerHTML = `
    <div class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800">
      <div class="text-xl font-black">Můj seznam</div>
      <div class="text-sm text-slate-400 mt-1">Položky přidané z Letáku 2.0.</div>

      <div class="mt-3 flex items-end justify-between">
        <div>
          <div class="text-xs text-slate-500">Součet cen</div>
          <div class="text-2xl font-black">${totalPrice} Kč</div>
        </div>
        <div class="text-right">
          <div class="text-xs text-slate-500">Odhad úspory</div>
          <div class="text-xl font-black text-sky-400">${totalSaving} Kč</div>
        </div>
      </div>

      <div class="mt-3 grid grid-cols-2 gap-2">
        <button class="p-3 rounded-2xl bg-sky-500 text-slate-950 font-bold" onclick="quickPlanFromList()">Plán ze seznamu</button>
        <button class="p-3 rounded-2xl bg-slate-900 border border-slate-800" onclick="clearList()">Vyčistit</button>
      </div>
    </div>

    <div class="space-y-3">
      ${items.length ? items.map(d=>`
        <div class="p-4 rounded-2xl bg-slate-900/40 border border-slate-800">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="text-sm font-semibold">${d.product} <span class="text-xs text-slate-400">(${d.unit})</span></div>
              <div class="text-xs text-slate-500 mt-1">${storeName(d.store_id)} • do ${d.valid_to}</div>
            </div>
            <div class="text-right">
              <div class="text-sm font-black">${d.price} Kč</div>
              <div class="text-xs text-slate-400 line-through">${d.old_price} Kč</div>
              <button class="mt-2 text-xs px-3 py-2 rounded-2xl bg-slate-900 border border-slate-800" onclick="removeFromList('${d.id}'); renderList();">Odebrat</button>
            </div>
          </div>
        </div>
      `).join('') : `<div class="text-sm text-slate-400">Seznam je prázdný. Přidej něco v Letáku 2.0.</div>`}
    </div>
  `;
}

function clearList(){ setList([]); toast("Seznam vyčištěn"); renderList(); }

function quickPlanFromList(){
  const list = getList();
  const items = list.map(x => DB.deals.find(d=>d.id===x.deal_id)).filter(Boolean);
  if (!items.length){ toast("Seznam je prázdný"); return; }

  const stores = {};
  let totalPrice = 0;
  let totalSaving = 0;
  for (const d of items){
    stores[d.store_id] ??= [];
    stores[d.store_id].push(d);
    totalPrice += d.price;
    totalSaving += saving(d);
  }

  const plan = { basket: items, stores, totalPrice, totalSaving };
  window._lastPlan = plan;

  setActiveNav("navList");
  app.innerHTML = `
    <div class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800">
      <div class="text-xs text-slate-400">Plán ze seznamu • UH</div>
      <div class="mt-2 flex items-end justify-between">
        <div>
          <div class="text-sm text-slate-400">Celkem</div>
          <div class="text-3xl font-black">${totalPrice} Kč</div>
        </div>
        <div class="text-right">
          <div class="text-sm text-slate-400">Ušetříš</div>
          <div class="text-2xl font-black text-sky-400">${totalSaving} Kč</div>
        </div>
      </div>
    </div>

    <div class="space-y-3">
      ${Object.keys(stores).map(storeId => `
        <div class="p-4 rounded-2xl bg-slate-900/40 border border-slate-800">
          <div class="font-semibold">${storeName(storeId)}</div>
          <div class="mt-2 space-y-2">
            ${stores[storeId].map(d=>`
              <div class="flex items-start justify-between gap-3">
                <div>
                  <div class="text-sm font-semibold">${d.product} <span class="text-xs text-slate-400">(${d.unit})</span></div>
                  <div class="text-xs text-slate-500">${d.category.toUpperCase()} • platí do ${d.valid_to}</div>
                </div>
                <div class="text-right">
                  <div class="text-sm font-black">${d.price} Kč</div>
                  <div class="text-xs text-slate-400 line-through">${d.old_price} Kč</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>

    <div class="flex gap-2">
      <button class="flex-1 p-3 rounded-2xl bg-sky-500 text-slate-950 font-bold" onclick="saveCurrentPlan()">Uložit plán</button>
      <button class="flex-1 p-3 rounded-2xl bg-slate-900 border border-slate-800" onclick="renderList()">Zpět na seznam</button>
    </div>
  `;
}

/** ===== Flow control ===== */
function pickScenario(id){ state.scenario = id; renderDays(); }
function setDays(n){ state.days = n; renderBudget(); }
function setBudget(n){ state.budget = n; renderResult(); }

function goHome(){
  state.scenario=null; state.days=null; state.budget=null;
  renderHome();
}

function saveCurrentPlan(){
  if (!window._lastPlan) return;
  savePlan(window._lastPlan);
  toast("Plán uložen");
  goHome();
}

/** ===== Small safety for input rendering ===== */
function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

// Start
renderHome();
</script>
