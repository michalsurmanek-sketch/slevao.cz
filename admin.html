<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#34d6c7"><title>Slevao.cz – administrace</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#34d6c7;--bd:#159e94;--sale:#ff5a5f;--ink:#172222;--muted:#667373;--line:#dde8e7;--bg:#f5f8f8;--shadow:0 16px 45px rgba(23,34,34,.1)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#fffffff0;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.topin{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:23px;font-weight:950}.logo b{color:var(--bd)}.btn{border:0;border-radius:14px;height:44px;padding:0 17px;font-weight:900;cursor:pointer}.primary{background:var(--bd);color:#fff}.light{background:#fff;border:1px solid var(--line)}main{padding:26px 0 70px}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}h1,h2{margin:0 0 14px}p{color:var(--muted);line-height:1.55}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:900}.field input,.field select{height:46px;border:1px solid var(--line);border-radius:13px;padding:0 13px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{margin-top:12px;padding:12px;border-radius:13px;background:#eef9f7;color:#0d6e67;display:none}.msg.err{display:block;background:#fff0f0;color:#9c3035}.msg.ok{display:block}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.table{display:grid;gap:10px}.offer{display:grid;grid-template-columns:1fr auto;gap:14px;border:1px solid var(--line);border-radius:18px;padding:15px}.offer small{color:var(--muted)}.price{font-size:21px;font-weight:950}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef5f4;font-size:12px;font-weight:900}.status.published{background:#e4f8ef;color:#116a48}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.actions button{height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 10px;font-weight:800;cursor:pointer}.danger{color:#a62f35}.login{max-width:460px;margin:45px auto}.hint{font-size:12px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.offer{grid-template-columns:1fr}.actions{justify-content:flex-start}}</style></head><body><header class="top"><div class="wrap topin"><div class="logo">SLEVAO<b>.cz</b> · administrace</div><div><a class="btn light" href="index.html" style="display:inline-grid;place-items:center;text-decoration:none;color:inherit">Zpět na web</a> <button id="logout" class="btn light hidden">Odhlásit</button></div></div></header><main class="wrap"><section id="loginBox" class="card login"><h1>Přihlášení správce</h1><p>Přihlas se účtem s rolí <strong>admin</strong> nebo <strong>editor</strong>.</p><form id="loginForm"><div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Heslo</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn primary" type="submit">Přihlásit</button><div id="loginMsg" class="msg"></div></form></section><section id="app" class="hidden"><div class="grid"><div class="card"><h2>Nová nabídka</h2><p>Vytvoří produkt a současně akční nabídku.</p><form id="offerForm"><div class="field"><label>Název produktu</label><input id="title" required placeholder="Např. Máslo 250 g"></div><div class="field"><label>Obchod</label><select id="store" required></select></div><div class="field"><label>Kategorie</label><select id="category"><option value="">Bez kategorie</option></select></div><div class="row"><div class="field"><label>Akční cena</label><input id="price" type="number" step="0.01" min="0" required></div><div class="field"><label>Původní cena</label><input id="oldPrice" type="number" step="0.01" min="0"></div></div><div class="row"><div class="field"><label>Množství</label><input id="amount" type="number" step="0.001" min="0"></div><div class="field"><label>Jednotka</label><select id="unit"><option value="">—</option><option>g</option><option>kg</option><option>ml</option><option>l</option><option>ks</option></select></div></div><div class="field"><label>URL obrázku</label><input id="image" type="url" placeholder="https://..."></div><div class="row"><div class="field"><label>Platí od</label><input id="from" type="date" required></div><div class="field"><label>Platí do</label><input id="to" type="date" required></div></div><div class="row"><div class="field"><label>Skóre 0–100</label><input id="score" type="number" min="0" max="100" value="80"></div><div class="field"><label>Stav</label><select id="status"><option value="published">Publikovat</option><option value="draft">Koncept</option><option value="review">Ke kontrole</option></select></div></div><button class="btn primary" type="submit">Uložit nabídku</button><div id="formMsg" class="msg"></div></form></div><div class="card"><div class="toolbar"><div><h2>Nabídky</h2><span class="hint" id="who"></span></div><button id="reload" class="btn light">Obnovit</button></div><div id="offers" class="table"><p>Načítám…</p></div></div></div></section></main><script>const URL='https://uhampjdqjxmbhaptgitn.supabase.co',KEY='sb_publishable_2I9ronLpYyn2kdnLRcdIUA_geOMF4XU',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK'}).format(Number(n||0));function msg(id,text,type='ok'){const e=$(id);e.textContent=text;e.className='msg '+type}function roleOf(s){return s?.user?.app_metadata?.role||''}async function boot(){const{data:{session}}=await db.auth.getSession();if(!session)return showLogin();const r=roleOf(session);if(!['admin','editor'].includes(r)){await db.auth.signOut();showLogin();return msg('loginMsg','Účet nemá roli admin nebo editor.','err')}showApp(session)}function showLogin(){$('loginBox').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}async function showApp(s){$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent=s.user.email+' · '+roleOf(s);const t=new Date().toISOString().slice(0,10);$('from').value=t;$('to').value=new Date(Date.now()+7*86400000).toISOString().slice(0,10);await Promise.all([loadRefs(),loadOffers()])}$('loginForm').onsubmit=async e=>{e.preventDefault();const{data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return msg('loginMsg',error.message,'err');const r=roleOf(data.session);if(!['admin','editor'].includes(r)){await db.auth.signOut();return msg('loginMsg','Přihlášení proběhlo, ale účet nemá administrátorskou roli.','err')}showApp(data.session)};$('logout').onclick=async()=>{await db.auth.signOut();showLogin()};$('reload').onclick=loadOffers;async function loadRefs(){const[s,c]=await Promise.all([db.from('stores').select('id,name').eq('is_active',true).order('name'),db.from('categories').select('id,name').eq('is_active',true).order('sort_order')]);if(s.error||c.error)throw(s.error||c.error);$('store').innerHTML=s.data.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('category').innerHTML='<option value="">Bez kategorie</option>'+c.data.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}$('offerForm').onsubmit=async e=>{e.preventDefault();$('formMsg').className='msg';const p={name:$('title').value.trim(),category_id:$('category').value||null,package_amount:$('amount').value?Number($('amount').value):null,package_unit:$('unit').value||null,image_url:$('image').value||null,is_verified:true};const{data:pd,error:pe}=await db.from('products').insert(p).select('id').single();if(pe)return msg('formMsg',pe.message,'err');const o={product_id:pd.id,store_id:$('store').value,title:p.name,price:Number($('price').value),old_price:$('oldPrice').value?Number($('oldPrice').value):null,package_amount:p.package_amount,package_unit:p.package_unit,image_url:p.image_url,valid_from:$('from').value,valid_to:$('to').value,deal_score:Number($('score').value||0),status:$('status').value,is_verified:true,published_at:$('status').value==='published'?new Date().toISOString():null};const{error}=await db.from('offers').insert(o);if(error)return msg('formMsg',error.message,'err');msg('formMsg','Nabídka byla uložena.');e.target.reset();$('score').value=80;await loadOffers()};async function loadOffers(){const{data,error}=await db.from('offers').select('id,title,price,old_price,status,valid_from,valid_to,stores(name)').order('created_at',{ascending:false}).limit(100);if(error){$('offers').innerHTML='<p>'+esc(error.message)+'</p>';return}if(!data.length){$('offers').innerHTML='<p>Zatím nejsou žádné nabídky.</p>';return}$('offers').innerHTML=data.map(o=>`<div class="offer"><div><span class="status ${esc(o.status)}">${esc(o.status)}</span><h3>${esc(o.title)}</h3><div class="price">${money(o.price)} ${o.old_price?`<small><s>${money(o.old_price)}</s></small>`:''}</div><small>${esc(o.stores?.name||'')} · ${esc(o.valid_from)} až ${esc(o.valid_to)}</small></div><div class="actions">${o.status!=='published'?`<button data-pub="${o.id}">Publikovat</button>`:''}<button data-exp="${o.id}">Ukončit</button><button class="danger" data-del="${o.id}">Smazat</button></div></div>`).join('');document.querySelectorAll('[data-pub]').forEach(b=>b.onclick=()=>setStatus(b.dataset.pub,'published'));document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>setStatus(b.dataset.exp,'expired'));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeOffer(b.dataset.del))}async function setStatus(id,status){const{error}=await db.from('offers').update({status,published_at:status==='published'?new Date().toISOString():null}).eq('id',id);if(error)alert(error.message);else loadOffers()}async function removeOffer(id){if(!confirm('Opravdu smazat nabídku?'))return;const{error}=await db.from('offers').delete().eq('id',id);if(error)alert(error.message);else loadOffers()}boot();</script></body></html>
