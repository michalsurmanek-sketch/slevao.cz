<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#34d6c7">
  <title>Slevao.cz – administrace</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--brand:#159e94;--ink:#172222;--muted:#667373;--line:#dde8e7;--bg:#f5f8f8;--danger:#a62f35}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.wrap{width:min(1160px,calc(100% - 28px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:22px;font-weight:950}.logo b{color:var(--brand)}.btn{height:44px;border:0;border-radius:14px;padding:0 17px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:#fff}.light{background:#fff;border:1px solid var(--line)}main{padding:28px 0 70px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 14px 40px rgba(23,34,34,.08)}.login{max-width:460px;margin:40px auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:900}.field input,.field select{height:46px;border:1px solid var(--line);border-radius:13px;padding:0 13px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{display:none;margin-top:12px;padding:12px;border-radius:12px}.msg.ok{display:block;background:#eef9f7;color:#0d6e67}.msg.err{display:block;background:#fff0f0;color:#9c3035}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.offer{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.offer h3{margin:7px 0}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 10px;font-weight:800;cursor:pointer}.danger{color:var(--danger)}@media(max-width:850px){.grid,.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="top"><div class="wrap topin"><div class="logo">SLEVAO<b>.cz</b> · administrace</div><div><a class="btn light" href="index.html" style="display:inline-grid;place-items:center;text-decoration:none;color:inherit">Zpět na web</a> <button id="logout" type="button" class="btn light hidden">Odhlásit</button></div></div></header>
<main class="wrap">
  <section id="loginBox" class="card login">
    <h1>Přihlášení správce</h1>
    <p class="muted">Přihlas se účtem s rolí admin nebo editor.</p>
    <form id="loginForm" onsubmit="return false;">
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="password">Heslo</label><input id="password" type="password" required autocomplete="current-password"></div>
      <button id="loginBtn" class="btn primary" type="button">Přihlásit</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </section>

  <section id="app" class="hidden">
    <div class="grid">
      <div class="card">
        <h2>Nová nabídka</h2>
        <form id="offerForm" onsubmit="return false;">
          <div class="field"><label>Název produktu</label><input id="title" required></div>
          <div class="field"><label>Obchod</label><select id="store" required></select></div>
          <div class="field"><label>Kategorie</label><select id="category"><option value="">Bez kategorie</option></select></div>
          <div class="row"><div class="field"><label>Akční cena</label><input id="price" type="number" step="0.01" min="0" required></div><div class="field"><label>Původní cena</label><input id="oldPrice" type="number" step="0.01" min="0"></div></div>
          <div class="field"><label>URL obrázku</label><input id="image" type="url"></div>
          <div class="row"><div class="field"><label>Platí od</label><input id="from" type="date" required></div><div class="field"><label>Platí do</label><input id="to" type="date" required></div></div>
          <div class="field"><label>Stav</label><select id="status"><option value="published">Publikovat</option><option value="draft">Koncept</option><option value="review">Ke kontrole</option></select></div>
          <button id="saveBtn" class="btn primary" type="button">Uložit nabídku</button>
          <div id="formMsg" class="msg"></div>
        </form>
      </div>
      <div class="card"><div class="toolbar"><div><h2>Nabídky</h2><div id="who" class="muted"></div></div><button id="reload" type="button" class="btn light">Obnovit</button></div><div id="offers"><p>Načítám…</p></div></div>
    </div>
  </section>
</main>
<script>
window.addEventListener('DOMContentLoaded', function () {
  const $ = id => document.getElementById(id);
  const showMessage = (id, text, type) => { const el=$(id); el.textContent=text; el.className='msg '+(type||'ok'); };

  if (!window.supabase) {
    showMessage('loginMsg','Nepodařilo se načíst připojení k Supabase. Obnov stránku přes Ctrl+F5.','err');
    return;
  }

  const db = window.supabase.createClient(
    'https://uhampjdqjxmbhaptgitn.supabase.co',
    'sb_publishable_2I9ronLpYyn2kdnLRcdIUA_geOMF4XU'
  );
  const roleOf = session => session && session.user && session.user.app_metadata ? session.user.app_metadata.role || '' : '';
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function showLogin(){ $('loginBox').classList.remove('hidden'); $('app').classList.add('hidden'); $('logout').classList.add('hidden'); }
  async function showApp(session){ $('loginBox').classList.add('hidden'); $('app').classList.remove('hidden'); $('logout').classList.remove('hidden'); $('who').textContent=session.user.email+' · '+roleOf(session); const today=new Date().toISOString().slice(0,10); $('from').value=today; $('to').value=new Date(Date.now()+7*86400000).toISOString().slice(0,10); await loadRefs(); await loadOffers(); }

  async function login(){
    const email=$('email').value.trim();
    const password=$('password').value;
    if(!email || !password){ showMessage('loginMsg','Vyplň e-mail i heslo.','err'); return; }
    $('loginBtn').disabled=true; $('loginBtn').textContent='Přihlašuji…';
    try{
      const {data,error}=await db.auth.signInWithPassword({email,password});
      if(error){ showMessage('loginMsg',error.message,'err'); return; }
      const role=roleOf(data.session);
      if(!['admin','editor'].includes(role)){ await db.auth.signOut(); showMessage('loginMsg','Účet nemá roli admin nebo editor.','err'); return; }
      await showApp(data.session);
    }catch(error){ showMessage('loginMsg',error.message || 'Přihlášení selhalo.','err'); }
    finally{ $('loginBtn').disabled=false; $('loginBtn').textContent='Přihlásit'; }
  }

  $('loginBtn').addEventListener('click',login);
  $('password').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); login(); }});
  $('logout').addEventListener('click',async()=>{ await db.auth.signOut(); showLogin(); });
  $('reload').addEventListener('click',loadOffers);

  async function loadRefs(){
    const [stores,categories]=await Promise.all([
      db.from('stores').select('id,name').eq('is_active',true).order('name'),
      db.from('categories').select('id,name').eq('is_active',true).order('sort_order')
    ]);
    if(stores.error || categories.error){ showMessage('formMsg',(stores.error||categories.error).message,'err'); return; }
    $('store').innerHTML=stores.data.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');
    $('category').innerHTML='<option value="">Bez kategorie</option>'+categories.data.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');
  }

  async function loadOffers(){
    const {data,error}=await db.from('offers').select('id,title,price,old_price,status,valid_from,valid_to,stores(name)').order('created_at',{ascending:false}).limit(100);
    if(error){ $('offers').innerHTML='<p>'+esc(error.message)+'</p>'; return; }
    if(!data.length){ $('offers').innerHTML='<p>Zatím nejsou žádné nabídky.</p>'; return; }
    $('offers').innerHTML=data.map(o=>'<div class="offer"><strong>'+esc(o.status)+'</strong><h3>'+esc(o.title)+'</h3><div><b>'+Number(o.price||0).toLocaleString('cs-CZ')+' Kč</b></div><div class="muted">'+esc(o.stores&&o.stores.name||'')+' · '+esc(o.valid_from)+' až '+esc(o.valid_to)+'</div><div class="actions"><button data-status="published" data-id="'+o.id+'">Publikovat</button><button data-status="expired" data-id="'+o.id+'">Ukončit</button><button class="danger" data-delete="'+o.id+'">Smazat</button></div></div>').join('');
    document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>setStatus(b.dataset.id,b.dataset.status)));
    document.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>removeOffer(b.dataset.delete)));
  }

  async function setStatus(id,status){ const {error}=await db.from('offers').update({status,published_at:status==='published'?new Date().toISOString():null}).eq('id',id); if(error) alert(error.message); else loadOffers(); }
  async function removeOffer(id){ if(!confirm('Opravdu smazat nabídku?')) return; const {error}=await db.from('offers').delete().eq('id',id); if(error) alert(error.message); else loadOffers(); }

  $('saveBtn').addEventListener('click',async()=>{
    const name=$('title').value.trim();
    if(!name || !$('store').value || !$('price').value || !$('from').value || !$('to').value){ showMessage('formMsg','Vyplň povinná pole.','err'); return; }
    const product={name,category_id:$('category').value||null,image_url:$('image').value||null,is_verified:true};
    const {data:created,error:productError}=await db.from('products').insert(product).select('id').single();
    if(productError){ showMessage('formMsg',productError.message,'err'); return; }
    const status=$('status').value;
    const {error}=await db.from('offers').insert({product_id:created.id,store_id:$('store').value,title:name,price:Number($('price').value),old_price:$('oldPrice').value?Number($('oldPrice').value):null,image_url:product.image_url,valid_from:$('from').value,valid_to:$('to').value,status,is_verified:true,published_at:status==='published'?new Date().toISOString():null});
    if(error){ showMessage('formMsg',error.message,'err'); return; }
    showMessage('formMsg','Nabídka byla uložena.','ok'); $('offerForm').reset(); await loadOffers();
  });

  db.auth.getSession().then(({data})=>{
    const session=data.session;
    if(session && ['admin','editor'].includes(roleOf(session))) showApp(session); else showLogin();
  }).catch(()=>showLogin());
});
</script>
</body>
</html>
