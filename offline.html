<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b776f">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Slevao.cz je dočasně offline</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#10201e;background:#f3f7f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.box{width:min(100%,620px);background:#fff;border:1px solid #dbe8e5;border-radius:26px;padding:30px;box-shadow:0 22px 70px rgba(15,45,40,.12)}.logo{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:950}.logo i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0b776f,#12b8a6);color:#fff;font-style:normal}.logo b{color:#12b8a6}h1{margin:28px 0 10px;font-size:clamp(32px,7vw,54px);line-height:1.02}p{color:#667774;font-size:18px;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}a,button{min-height:46px;padding:0 17px;border:1px solid #dbe8e5;border-radius:13px;background:#fff;color:#10201e;text-decoration:none;font-weight:850;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#0b776f,#12b8a6);color:#fff}@media(max-width:560px){.box{padding:22px}.actions{display:grid}.actions>*{width:100%}}
  </style>
</head>
<body>
  <main class="box">
    <div class="logo"><i>%</i><span>SLEVAO<b>.cz</b></span></div>
    <h1>Připojení právě není dostupné.</h1>
    <p>Uložený nákupní seznam zůstává v zařízení. Jakmile se internet obnoví, znovu se načtou aktuální ceny, letáky a oblíbené produkty.</p>
    <div class="actions"><button class="primary" type="button" onclick="location.reload()">Zkusit znovu</button><a href="seznam.html">Otevřít nákupní seznam</a></div>
  </main>
</body>
</html>
