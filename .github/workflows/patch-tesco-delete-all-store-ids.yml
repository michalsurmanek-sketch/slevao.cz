name: Patch Tesco complete old-offer cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tesco-delete-all-store-ids.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Tesco cleanup patch
        run: python .github/scripts/patch_tesco_delete_all_store_ids.py

      - name: Commit fix
        run: |
          git config user.name "slevao-automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/publish-imports/index.ts
          git commit -m "fix(tesco): delete old offers across duplicate store records"
          git push origin main
