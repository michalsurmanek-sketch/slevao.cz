name: One-shot top-tip CSS consolidation

on:
  push:
    branches:
      - perf/top-tip-css-inline

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: perf/top-tip-css-inline
      - name: Inline single-consumer CSS imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          top_path = Path('assets/top-tip-button.css')
          home_path = Path('assets/mobile-home-polish.css')
          filter_path = Path('assets/mobile-filter-sheet-fix.css')
          test_path = Path('tests/home-css-request-consolidation.mjs')

          top = top_path.read_text(encoding='utf-8')
          home = home_path.read_text(encoding='utf-8')
          sheet = filter_path.read_text(encoding='utf-8')
          prefix = '@import url("mobile-home-polish.css?v=20260816-4");\n@import url("mobile-filter-sheet-fix.css?v=20260816-1");\n\n'
          if not top.startswith(prefix):
              raise SystemExit('unexpected top-tip-button.css import prefix')
          if '@import' in home or '@import' in sheet:
              raise SystemExit('nested @import found in source fragments')

          top_path.write_text(home.rstrip() + '\n\n' + sheet.rstrip() + '\n\n' + top[len(prefix):], encoding='utf-8')
          home_path.unlink()
          filter_path.unlink()

          test = test_path.read_text(encoding='utf-8')
          old_decl = "const deals = fs.readFileSync('assets/mobile-deals-heading-fix.css', 'utf8');\n"
          new_decl = old_decl + "const topTip = fs.readFileSync('assets/top-tip-button.css', 'utf8');\n"
          if old_decl not in test or "const topTip =" in test:
              raise SystemExit('unexpected consolidation test declaration state')
          test = test.replace(old_decl, new_decl, 1)

          old_paths = "  'assets/mobile-card-view-row.css',\n]) {"
          new_paths = "  'assets/mobile-card-view-row.css',\n  'assets/mobile-home-polish.css',\n  'assets/mobile-filter-sheet-fix.css',\n]) {"
          if old_paths not in test:
              raise SystemExit('unexpected consolidation test path list')
          test = test.replace(old_paths, new_paths, 1)

          anchor = "assert.match(deals, /Mobile offer view: result count left, 3 icon controls right, sorting below\\./);\n\n"
          addition = "assert.equal(topTip.includes('@import'), false, 'top-tip-button.css must keep the mobile fragments inlined');\nassert.match(topTip, /mobile homepage polish, 16\\/08\\/2026/);\nassert.match(topTip, /robustní mobilní filtr bez zásahu do desktopu/);\n\n"
          if anchor not in test or addition in test:
              raise SystemExit('unexpected consolidation test assertion anchor')
          test = test.replace(anchor, anchor + addition, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Verify consolidated state
        run: |
          test ! -e assets/mobile-home-polish.css
          test ! -e assets/mobile-filter-sheet-fix.css
          ! grep -q '@import' assets/top-tip-button.css
          node tests/home-css-request-consolidation.mjs
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/top-tip-css-inline-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/top-tip-button.css tests/home-css-request-consolidation.mjs
          git rm -- assets/mobile-home-polish.css assets/mobile-filter-sheet-fix.css
          git rm --cached --ignore-unmatch .github/workflows/top-tip-css-inline-once.yml || true
          git add -u -- .github/workflows/top-tip-css-inline-once.yml
          git commit -m 'Inline top-tip mobile CSS fragments'
          git push origin HEAD:perf/top-tip-css-inline
