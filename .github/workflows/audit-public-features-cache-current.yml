name: Audit public features cache current

on:
  push:
    paths:
      - '.github/workflows/audit-public-features-cache-current.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply cache fix to current main
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html letaky.html produkt.html seznam.html ucet.html; do
            test -f "$f"
            sed -i 's/public-features\.js?v=20260828-2/public-features.js?v=20260901-1/g' "$f"
          done
          cat > tests/public-features-cache-version.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.cwd();
          const canonical = '20260901-1';
          const refs = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) {
                const source = fs.readFileSync(full, 'utf8');
                for (const match of source.matchAll(/assets\/public-features\.js\?v=([0-9]{8}-[0-9]+)/g)) refs.push({ file:path.relative(root, full), version:match[1] });
              }
            }
          }
          walk(root);
          assert.ok(refs.length >= 4, `Expected at least 4 public-features references, got ${refs.length}`);
          assert.deepEqual(refs.filter((ref) => ref.version !== canonical), []);
          console.log(`public-features cache version: OK (${refs.length} references)`);
          EOF
          node tests/public-features-cache-version.mjs
          git diff --check
      - name: Commit audited fix and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/audit-public-features-cache-current.yml
          git add index.html letaky.html produkt.html seznam.html ucet.html tests/public-features-cache-version.mjs .github/workflows/audit-public-features-cache-current.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: refresh public-features cache references'
          git push origin HEAD:main
