name: Apply unified admin icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-unified-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Attach shared icon style
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              'admin-automatizace.html',
              'admin-fotografie.html',
              'admin-pridat-fotografii.html',
              'admin-tesco-kontrola.html',
          ]
          css = '  <link rel="stylesheet" href="assets/admin-unified-icons.css?v=20260802-1">\n'
          js = '  <script defer src="assets/admin-unified-icons.js?v=20260802-1"></script>\n'

          for name in pages:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              changed = False
              if 'assets/admin-unified-icons.css' not in text:
                  text = text.replace('</head>', css + '</head>', 1)
                  changed = True
              if 'assets/admin-unified-icons.js' not in text:
                  text = text.replace('</head>', js + '</head>', 1)
                  changed = True
              if changed:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Verify files
        run: |
          grep -q 'admin-unified-icons.css' admin-automatizace.html
          grep -q 'admin-unified-icons.js' admin-automatizace.html
          grep -q 'admin-unified-icons.css' admin-fotografie.html
          grep -q 'admin-unified-icons.js' admin-fotografie.html
          grep -q 'admin-unified-icons.css' admin-pridat-fotografii.html
          grep -q 'admin-unified-icons.js' admin-pridat-fotografii.html
          grep -q 'admin-unified-icons.css' admin-tesco-kontrola.html
          grep -q 'admin-unified-icons.js' admin-tesco-kontrola.html
          ! grep -q 'admin-unified-icons' index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-automatizace.html admin-fotografie.html admin-pridat-fotografii.html admin-tesco-kontrola.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Unify elegant icons across admin subpages"
          git push origin main
