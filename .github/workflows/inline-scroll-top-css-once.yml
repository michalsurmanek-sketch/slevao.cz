name: One-shot inline homepage scroll CSS

on:
  push:
    branches:
      - perf/home-scroll-top-inline-css-20260901
    paths:
      - .github/workflows/inline-scroll-top-css-once.yml

permissions:
  contents: write

jobs:
  inline-scroll-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/home-scroll-top-inline-css-20260901
          fetch-depth: 0

      - name: Replace dynamic stylesheet request with inline scoped style
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/mobile-leaflet-nav-position.js')
          source = path.read_text(encoding='utf-8')
          old = '''    if (!document.querySelector('link[href*="leaflets-scroll-top.css"]')) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'assets/leaflets-scroll-top.css?v=20260809-1';
      document.head.appendChild(link);
    }
'''
          new = '''    if (!document.getElementById('leafletsScrollTopStyle')) {
      const style = document.createElement('style');
      style.id = 'leafletsScrollTopStyle';
      style.textContent = `
        .leafletsScrollTop{display:none}
        @media(max-width:800px){
          .leafletsScrollTop{
            --scroll-progress:0deg;
            position:fixed;
            right:14px;
            bottom:calc(80px + env(safe-area-inset-bottom));
            z-index:110;
            width:48px;
            height:48px;
            padding:3px;
            border:0;
            border-radius:50%;
            background:conic-gradient(#159e94 var(--scroll-progress),rgba(21,158,148,.16) 0);
            box-shadow:0 10px 28px rgba(9,89,83,.22);
            display:grid;
            place-items:center;
            opacity:0;
            visibility:hidden;
            transform:translateY(10px) scale(.92);
            transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
            -webkit-tap-highlight-color:transparent;
            cursor:pointer;
          }
          .leafletsScrollTop::before{
            content:"";
            position:absolute;
            inset:3px;
            border-radius:50%;
            background:rgba(255,255,255,.97);
            box-shadow:inset 0 0 0 1px rgba(21,158,148,.1);
          }
          .leafletsScrollTop svg{
            position:relative;
            z-index:1;
            width:22px;
            height:22px;
            fill:none;
            stroke:#087e75;
            stroke-width:2.25;
            stroke-linecap:round;
            stroke-linejoin:round;
          }
          .leafletsScrollTop.is-visible{
            opacity:1;
            visibility:visible;
            transform:translateY(0) scale(1);
          }
          .leafletsScrollTop:active{transform:scale(.94)}
          .leafletsScrollTop:focus,.leafletsScrollTop:focus-visible{outline:0;box-shadow:0 10px 28px rgba(9,89,83,.22)}
        }
        @media(prefers-reduced-motion:reduce){
          .leafletsScrollTop{transition:none}
        }
      `;
      document.head.appendChild(style);
    }
'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one dynamic scroll stylesheet block, found {count}')
          updated = source.replace(old, new, 1)
          if 'leaflets-scroll-top.css' in updated:
              raise SystemExit('Dynamic leaflets-scroll-top.css reference still present')
          path.write_text(updated, encoding='utf-8')
          PY
          git diff --check

      - name: Commit exact replacement and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/inline-scroll-top-css-once.yml
          git add assets/mobile-leaflet-nav-position.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Inline homepage scroll-top CSS"
          git push origin HEAD:perf/home-scroll-top-inline-css-20260901
