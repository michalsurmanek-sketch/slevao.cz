name: One-shot inline homepage scroll CSS

on:
  push:
    branches:
      - perf/home-scroll-top-inline-css-20260901
    paths:
      - .github/workflows/inline-scroll-top-css-once.yml

permissions:
  contents: write

jobs:
  inline-scroll-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/home-scroll-top-inline-css-20260901
          fetch-depth: 0

      - name: Replace dynamic stylesheet request with inline scoped style
        run: python .github/scripts/inline-scroll-top-css-once.py

      - name: Validate exact patch
        run: |
          git diff --check
          ! grep -q 'leaflets-scroll-top.css' assets/mobile-leaflet-nav-position.js
          grep -q "leafletsScrollTopStyle" assets/mobile-leaflet-nav-position.js

      - name: Commit exact replacement and remove one-shot files
        run: |
          git rm .github/workflows/inline-scroll-top-css-once.yml .github/scripts/inline-scroll-top-css-once.py
          git add assets/mobile-leaflet-nav-position.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Inline homepage scroll-top CSS"
          git push origin HEAD:perf/home-scroll-top-inline-css-20260901
