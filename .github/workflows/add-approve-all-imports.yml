name: Přidat Schválit vše k importům

on:
  push:
    paths:
      - '.github/workflows/add-approve-all-imports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upravit administraci automatizace
        shell: python
        run: |
          from pathlib import Path

          path = Path('admin-automatizace.html')
          text = path.read_text(encoding='utf-8')

          old_header = '<section class="panel" style="margin-top:16px"><div class="sectionHead"><div><h2>Poslední importy</h2><div class="meta">Živý přehled zpracování a publikace.</div></div></div><div id="imports" class="imports"></div></section>'
          new_header = '<section class="panel" style="margin-top:16px"><div class="sectionHead"><div><h2>Poslední importy</h2><div class="meta">Živý přehled zpracování a publikace.</div></div><div class="toolbar"><button id="approveAllImports" class="btn primary" disabled>✓ Schválit vše</button></div></div><div id="bulkPublishMsg" class="msg"></div><div id="imports" class="imports"></div></section>'
          if old_header not in text:
              raise SystemExit('Sekce Poslední importy nebyla nalezena.')
          text = text.replace(old_header, new_header, 1)

          old_state = "const roleOf=s=>s?.user?.app_metadata?.role||'',msg=(id,text,type='ok')=>{const e=$(id);e.textContent=text;e.className='msg '+type};let pollTimer=null,editingSourceId=null,runningSourceId=null,lastSourceHealth={problems:0,stale:0},sourceRows=[],latestImportBySource=new Map();"
          new_state = "const roleOf=s=>s?.user?.app_metadata?.role||'',msg=(id,text,type='ok')=>{const e=$(id);e.textContent=text;e.className='msg '+type};let pollTimer=null,editingSourceId=null,runningSourceId=null,bulkPublishing=false,reviewImports=[],lastSourceHealth={problems:0,stale:0},sourceRows=[],latestImportBySource=new Map();"
          if old_state not in text:
              raise SystemExit('Stav JavaScriptu nebyl nalezen.')
          text = text.replace(old_state, new_state, 1)

          old_rows = "const rows=data||[];latestImportBySource=new Map();"
          new_rows = "const rows=data||[];reviewImports=rows.filter(x=>x.status==='review'&&Number(x.product_count||0)>0);const bulkBtn=$('approveAllImports');if(bulkBtn){const totalProducts=reviewImports.reduce((sum,x)=>sum+Number(x.product_count||0),0);bulkBtn.disabled=bulkPublishing||reviewImports.length===0;bulkBtn.textContent=bulkPublishing?'Schvaluji…':reviewImports.length?'✓ Schválit vše ('+reviewImports.length+' / '+totalProducts+' produktů)':'✓ Schválit vše';}latestImportBySource=new Map();"
          if old_rows not in text:
              raise SystemExit('Načítání importů nebylo nalezeno.')
          text = text.replace(old_rows, new_rows, 1)

          marker = "async function runAutomation(){$('runNow').disabled=true;"
          bulk_code = r'''async function approveAllImports(){
  if(bulkPublishing)return;
  const imports=reviewImports.filter(x=>x.status==='review'&&Number(x.product_count||0)>0);
  if(!imports.length)return msg('bulkPublishMsg','Nejsou žádné importy k hromadnému schválení.','err');
  const totalProducts=imports.reduce((sum,x)=>sum+Number(x.product_count||0),0);
  if(!confirm('Opravdu schválit '+imports.length+' importů a až '+totalProducts+' produktů?'))return;
  bulkPublishing=true;
  const button=$('approveAllImports');button.disabled=true;
  let approved=0,published=0,failed=0;
  try{
    for(let i=0;i<imports.length;i++){
      const item=imports[i];
      button.textContent='Schvaluji '+(i+1)+'/'+imports.length+'…';
      msg('bulkPublishMsg','Zpracovávám '+(i+1)+' z '+imports.length+' importů. Publikováno '+published+' produktů.');
      try{
        const{data,error}=await db.functions.invoke('publish-imports',{body:{import_id:item.id}});
        if(error)throw error;
        const result=data?.results?.[0];
        if(result?.error)throw new Error(result.error);
        approved++;
        published+=Number(result?.published||0);
      }catch(error){
        failed++;
        console.error('Hromadná publikace importu selhala',item.id,error);
      }
    }
    const summary='Hotovo: schváleno '+approved+' importů, publikováno '+published+' produktů'+(failed?', chyby u '+failed+' importů.':'.');
    msg('bulkPublishMsg',summary,failed?'err':'ok');
    msg('runMsg',summary,failed?'err':'ok');
  }finally{
    bulkPublishing=false;
    button.textContent='✓ Schválit vše';
    await loadAll();
  }
}
$('approveAllImports').onclick=approveAllImports;
'''
          if marker not in text:
              raise SystemExit('Místo pro vložení hromadné publikace nebylo nalezeno.')
          text = text.replace(marker, bulk_code + marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commitnout změnu
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-automatizace.html
          if git diff --cached --quiet; then
            echo "Žádná změna"
            exit 0
          fi
          git commit -m "Přidat tlačítko Schválit vše k importům"
          git push

