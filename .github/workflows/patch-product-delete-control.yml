name: Add product delete confirmation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-product-delete-control.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add delete button and confirmation modal
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('admin-tesco-kontrola.html')
          text = path.read_text(encoding='utf-8')

          old_css = ".rowAction{white-space:nowrap}.editBtn{height:36px;border:1px solid #cfe4e2;background:#fff;color:var(--brand-strong);border-radius:9px;padding:0 11px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer}.editBtn:hover{background:var(--brand-soft);border-color:#9fd4cf}.editBtn:disabled{opacity:.45;cursor:not-allowed}.editBtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}"
          new_css = ".rowAction{white-space:nowrap;display:flex;align-items:center;gap:7px}.editBtn,.deleteBtn{height:36px;border-radius:9px;padding:0 11px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer}.editBtn{border:1px solid #cfe4e2;background:#fff;color:var(--brand-strong)}.editBtn:hover{background:var(--brand-soft);border-color:#9fd4cf}.deleteBtn{border:1px solid #f1c6cb;background:#fff;color:var(--bad)}.deleteBtn:hover{background:var(--bad-bg);border-color:#e59aa3}.editBtn:disabled,.deleteBtn:disabled{opacity:.45;cursor:not-allowed}.editBtn svg,.deleteBtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.confirmBox{width:min(500px,100%)}.confirmIcon{width:48px;height:48px;border-radius:14px;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;margin-bottom:14px}.confirmIcon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.confirmText{color:var(--muted);line-height:1.55;margin:0}.confirmProduct{margin:16px 0;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.confirmProduct strong{display:block;font-size:15px}.confirmProduct span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.confirmWarning{padding:11px 12px;border-radius:11px;background:var(--bad-bg);color:#a51d2d;font-size:12px;line-height:1.45}.confirmActions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.dangerConfirm{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important}"
          if old_css in text:
              text = text.replace(old_css, new_css, 1)
          elif '.deleteBtn{' not in text:
              raise SystemExit('CSS marker was not found')

          modal = '''\n<div id="deleteModal" class="modal" hidden><div class="modalBox confirmBox" role="alertdialog" aria-modal="true" aria-labelledby="deleteTitle"><div class="confirmIcon"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg></div><div class="modalHead"><div><h2 id="deleteTitle">Odstranit produkt?</h2><div class="sub">Před smazáním zkontroluj správnou nabídku.</div></div><button id="deleteClose" class="closeBtn" type="button" aria-label="Zavřít">×</button></div><p class="confirmText">Tato akce odstraní nabídku z databáze a po obnovení zmizí také z veřejného webu.</p><div class="confirmProduct"><strong id="deleteProductName">—</strong><span id="deleteProductDetails">—</span></div><div class="confirmWarning"><strong>Odstranění nejde vrátit.</strong> Ostatní nabídky stejného produktu se nesmažou.</div><div class="confirmActions"><button id="deleteCancel" class="btn" type="button">Zrušit</button><button id="deleteConfirm" class="btn dangerConfirm" type="button"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg>Ano, odstranit nabídku</button></div><div id="deleteMessage" class="saveMessage"></div></div></div>\n'''
          marker = '\n<script>\nwindow.addEventListener'
          if 'id="deleteModal"' not in text:
              if marker not in text:
                  raise SystemExit('Script marker was not found')
              text = text.replace(marker, modal + marker, 1)

          old_state = "let rows=[],stores=[],dups=new Map(),canEdit=false;"
          new_state = "let rows=[],stores=[],dups=new Map(),canEdit=false,deleteTarget=null;"
          if old_state in text:
              text = text.replace(old_state, new_state, 1)

          old_action = '''<td class="rowAction"><button class="editBtn" type="button" data-edit-id="${esc(r.id)}" ${canEdit?'':'disabled'}><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Upravit</button></td>'''
          new_action = '''<td class="rowAction"><button class="editBtn" type="button" data-edit-id="${esc(r.id)}" ${canEdit?'':'disabled'}><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Upravit</button><button class="deleteBtn" type="button" data-delete-id="${esc(r.id)}" ${canEdit?'':'disabled'}><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg>Odstranit</button></td>'''
          if old_action in text:
              text = text.replace(old_action, new_action, 1)
          elif 'data-delete-id=' not in text:
              raise SystemExit('Action cell marker was not found')

          function_marker = "async function fetchAll(){"
          delete_functions = '''function closeDelete(){$('deleteModal').hidden=true;deleteTarget=null;$('deleteMessage').className='saveMessage';$('deleteMessage').textContent='';document.body.style.overflow=''}function openDelete(id){if(!canEdit){$('authWarning').classList.add('show');return}const r=rows.find(x=>x.id===id);if(!r)return;deleteTarget=r;$('deleteProductName').textContent=r.title||r.products?.name||'Bez názvu';$('deleteProductDetails').textContent=`${r.stores?.name||'Neznámý obchod'} · ${money(r.price)} Kč · ${date(r.valid_from)}–${date(r.valid_to)}`;$('deleteMessage').className='saveMessage';$('deleteMessage').textContent='';$('deleteModal').hidden=false;document.body.style.overflow='hidden'}async function removeSelected(){if(!canEdit||!deleteTarget)return;const target=deleteTarget;$('deleteConfirm').disabled=true;$('deleteCancel').disabled=true;$('deleteMessage').className='saveMessage';$('deleteMessage').textContent='Odstraňuji nabídku…';try{const {error}=await db.from('offers').delete().eq('id',target.id);if(error)throw error;try{Object.keys(localStorage).filter(k=>k.startsWith('slevao-public-data-')).forEach(k=>localStorage.removeItem(k))}catch{}$('deleteMessage').className='saveMessage ok';$('deleteMessage').textContent='Nabídka byla odstraněna.';await load();setTimeout(closeDelete,450)}catch(e){$('deleteMessage').className='saveMessage err';$('deleteMessage').textContent=e?.message||'Odstranění selhalo.'}finally{$('deleteConfirm').disabled=false;$('deleteCancel').disabled=false}}'''
          if 'function openDelete(' not in text:
              if function_marker not in text:
                  raise SystemExit('fetchAll marker was not found')
              text = text.replace(function_marker, delete_functions + function_marker, 1)

          old_click = "$('table').onclick=e=>{const b=e.target.closest('[data-edit-id]');if(b)openEdit(b.dataset.editId)};"
          new_click = "$('table').onclick=e=>{const edit=e.target.closest('[data-edit-id]'),del=e.target.closest('[data-delete-id]');if(edit)openEdit(edit.dataset.editId);else if(del)openDelete(del.dataset.deleteId)};"
          if old_click in text:
              text = text.replace(old_click, new_click, 1)
          elif "data-delete-id" not in text:
              raise SystemExit('Table click marker was not found')

          old_handlers = "$('editClose').onclick=closeEdit;$('editModal').onclick=e=>{if(e.target===$('editModal'))closeEdit()};$('editSave').onclick=save;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('editModal').hidden)closeEdit()});load()"
          new_handlers = "$('editClose').onclick=closeEdit;$('editModal').onclick=e=>{if(e.target===$('editModal'))closeEdit()};$('editSave').onclick=save;$('deleteClose').onclick=closeDelete;$('deleteCancel').onclick=closeDelete;$('deleteModal').onclick=e=>{if(e.target===$('deleteModal'))closeDelete()};$('deleteConfirm').onclick=removeSelected;document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('deleteModal').hidden)closeDelete();else if(!$('editModal').hidden)closeEdit()});load()"
          if old_handlers in text:
              text = text.replace(old_handlers, new_handlers, 1)
          elif "$('deleteConfirm').onclick" not in text:
              raise SystemExit('Event handler marker was not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched product control
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-tesco-kontrola.html
          if ! git diff --cached --quiet; then
            git commit -m "Add confirmed product deletion"
            git push origin HEAD:main
          fi
