name: Kontrola Lidl verified parseru

on:
  pull_request:
    paths:
      - 'supabase/migrations/**lidl**'
      - 'tests/lidl-verified-parser-source-control.mjs'
      - '.github/workflows/lidl-verified-parser-check.yml'
  push:
    branches: ['main']
    paths:
      - 'supabase/migrations/**lidl**'
      - 'tests/lidl-verified-parser-source-control.mjs'
      - '.github/workflows/lidl-verified-parser-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ověřit source-controlled Lidl verified parser
        run: node tests/lidl-verified-parser-source-control.mjs
