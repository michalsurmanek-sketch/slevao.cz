name: Apply mobile leaflet fix

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix-mobile-leaflet-blob-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download signed leaflet into a local blob
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/store-feed.js')
          text = path.read_text(encoding='utf-8')
          old = """      if (payload && typeof payload === 'object') {
        const signedUrl = String(payload.url || '');
        if (!signedUrl.startsWith(`${SUPABASE_URL}/storage/v1/object/sign/`)) throw new Error(payload.error || 'Neplatný odkaz na leták.');
        frame.src = `${signedUrl}#page=1&zoom=page-fit`;
        frame.hidden = false;
        requestAnimationFrame(fitLeafletViewer);
        setTimeout(fitLeafletViewer, 450);
        $('leafletViewerStatus').hidden = true;
        return;
      }
"""
          new = """      if (payload && typeof payload === 'object') {
        const signedUrl = String(payload.url || '');
        if (!signedUrl.startsWith(`${SUPABASE_URL}/storage/v1/object/sign/`)) throw new Error(payload.error || 'Neplatný odkaz na leták.');
        const signedResponse = await fetch(signedUrl, {
          headers: { accept: 'application/pdf,image/webp,image/png,image/jpeg,*/*;q=0.8' },
          cache: 'no-store',
          signal: leafletLoadController.signal,
        });
        if (!signedResponse.ok) throw new Error(`Soubor letáku vrátil HTTP ${signedResponse.status}.`);
        const downloadedBlob = await signedResponse.blob();
        if (!downloadedBlob.size) throw new Error('Stažený leták je prázdný.');
        const rawType = signedResponse.headers.get('content-type') || downloadedBlob.type || '';
        const safeType = /^image\//i.test(rawType) ? rawType.split(';')[0] : 'application/pdf';
        const documentBlob = downloadedBlob.type === safeType
          ? downloadedBlob
          : new Blob([downloadedBlob], { type: safeType });
        if (leafletObjectUrl) URL.revokeObjectURL(leafletObjectUrl);
        leafletObjectUrl = URL.createObjectURL(documentBlob);
        frame.src = `${leafletObjectUrl}#page=1&zoom=page-fit`;
        frame.hidden = false;
        requestAnimationFrame(fitLeafletViewer);
        setTimeout(fitLeafletViewer, 450);
        $('leafletViewerStatus').hidden = true;
        return;
      }
"""
          if old not in text:
              raise SystemExit('Signed URL viewer block was not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('assets/store-feed-tesco-v8.js').write_text(text, encoding='utf-8')

          changed = 0
          for html in Path('.').glob('*.html'):
              source = html.read_text(encoding='utf-8')
              if 'window.SLEVAO_STORE' not in source:
                  continue
              updated = source.replace('assets/store-feed.js?v=20260801-18', 'assets/store-feed.js?v=20260802-19')
              if updated != source:
                  html.write_text(updated, encoding='utf-8')
                  changed += 1
          if changed != 73:
              raise SystemExit(f'Expected 73 store pages, updated {changed}')
          PY

      - name: Remove branch installer
        run: rm -f .github/workflows/fix-mobile-leaflet-blob.yml

      - name: Verify JavaScript and site quality
        run: |
          node --check assets/store-feed.js
          node --check assets/store-feed-tesco-v8.js
          test "$(grep -l 'assets/store-feed.js?v=20260802-19' ./*.html | wc -l)" -eq 73
          ! grep -q 'frame.src = `${signedUrl}' assets/store-feed.js
          grep -q 'const signedResponse = await fetch(signedUrl' assets/store-feed.js
          node tests/quality.mjs

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898254+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load signed leaflet documents through local blobs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
