name: Repair public-features cache keys once

on:
  push:
    branches:
      - audit/public-features-cache-bust-20260905
    paths:
      - .github/workflows/fix-public-features-cache-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/public-features-cache-bust-20260905
          fetch-depth: 0

      - name: Normalize public-features cache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          canonical = 'assets/public-features.js?v=20260901-1'
          pattern = re.compile(r'assets/public-features\.js\?v=\d{8}-\d+')
          changed = []
          replacements = 0

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(canonical, source)
              if count and updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
                  replacements += count

          if replacements < 4:
              raise SystemExit(f'Expected at least 4 public-features references to normalize, got {replacements}')

          test = r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const canonical = '20260901-1';
          const refs = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) {
                const source = fs.readFileSync(full, 'utf8');
                for (const match of source.matchAll(/assets\/public-features\.js\?v=([0-9]{8}-[0-9]+)/g)) {
                  refs.push({ file: path.relative(root, full), version: match[1] });
                }
              }
            }
          }

          walk(root);
          assert.ok(refs.length >= 4, `Expected at least 4 public-features references, got ${refs.length}`);
          const stale = refs.filter((ref) => ref.version !== canonical);
          assert.deepEqual(stale, [], `Stale public-features cache versions: ${JSON.stringify(stale)}`);
          console.log(`public-features cache version: OK (${refs.length} references)`);
          '''
          Path('tests/public-features-cache-version.mjs').write_text(test, encoding='utf-8')
          print('Updated:', ', '.join(changed))
          print('References normalized:', replacements)
          PY

          node tests/public-features-cache-version.mjs
          git diff --check

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-public-features-cache-once.yml
          git add -- '*.html' tests/public-features-cache-version.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix stale public-features cache keys"
          git push origin HEAD:audit/public-features-cache-bust-20260905
