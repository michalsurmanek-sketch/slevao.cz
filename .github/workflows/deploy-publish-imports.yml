name: Deploy publish-imports

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/publish-imports/**'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/publish-imports/**'
      - '.github/workflows/deploy-publish-imports.yml'
  workflow_dispatch:

concurrency:
  group: deploy-publish-imports-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate publish-imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate function auth contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^verify_jwt[[:space:]]*=[[:space:]]*false[[:space:]]*$' supabase/functions/publish-imports/config.toml
          grep -q 'Deno.serve' supabase/functions/publish-imports/index.ts
          grep -q -- '--no-verify-jwt' .github/workflows/deploy-publish-imports.yml

  deploy:
    name: Deploy publish-imports
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Verify Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Deploy publish-imports
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy publish-imports \
            --no-verify-jwt \
            --project-ref uhampjdqjxmbhaptgitn
