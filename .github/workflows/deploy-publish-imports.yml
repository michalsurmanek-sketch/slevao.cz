name: Deploy publish-imports

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/publish-imports/**'
      - '.github/workflows/deploy-publish-imports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy publish-imports
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy publish-imports --no-verify-jwt --project-ref uhampjdqjxmbhaptgitn
