name: Fast leaflet thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-leaflet-thumbnails.py'
      - '.github/workflows/leaflet-thumbnails.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: leaflet-thumbnails
  cancel-in-progress: false

jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image converters
        run: python -m pip install pymupdf Pillow
      - name: Verify cover conversion and date guards
        run: python scripts/test-leaflet-thumbnails.py
      - name: Prepare current covers
        run: python scripts/build-leaflet-thumbnails.py
      - name: Save generated covers
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/leaflet-thumbnails
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Refresh pre-rendered current leaflet thumbnails'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN commits do not trigger Pages builds; publish explicitly.
      - uses: actions/configure-pages@v5
        if: steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.save.outputs.changed == 'true'
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        if: steps.save.outputs.changed == 'true'
