name: JIP OCR

# Legacy emergency fallback only. The production JIP pipeline runs in
# Supabase; starting this expensive OCR job requires an explicit operator action.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jip-ocr-production
  cancel-in-progress: false

jobs:
  jip-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: uhampjdqjxmbhaptgitn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Install Czech Tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces
          tesseract --version | head -n 1
          tesseract --list-langs | grep -x ces

      - name: OCR and publish JIP offers
        run: python3 .github/scripts/jip_ocr_sync.py
