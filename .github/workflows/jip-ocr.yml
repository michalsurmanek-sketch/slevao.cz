name: JIP OCR

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/jip_ocr_sync.py'
      - '.github/workflows/jip-ocr.yml'
  schedule:
    - cron: '25 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jip-ocr
  cancel-in-progress: false

jobs:
  ocr:
    name: JIP 12-page MO OCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: uhampjdqjxmbhaptgitn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověřit Supabase token
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nainstalovat český Tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng python3-pil
          tesseract --version | head -n 2
          tesseract --list-langs

      - name: OCR chybějících JIP stran
        run: python3 scripts/jip_ocr_sync.py
