name: Trace next homepage CSS once
on:
  push:
    branches:
      - perf/home-next-css-trace-20260902
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/home-next-css-trace-20260902
          fetch-depth: 0
      - name: Trace candidate stylesheet sizes and refs
        shell: bash
        run: |
          set -euo pipefail
          echo '--- sizes ---'
          wc -c assets/home-leaflet-covers.css assets/home-overview.css assets/home-save-today.css assets/home-autopilot.css assets/home-in-store.css
          for f in home-leaflet-covers home-overview home-save-today home-autopilot home-in-store; do
            echo "--- refs: $f.css ---"
            grep -RIn --exclude-dir=.git --exclude='trace-next-home-css-once.yml' "$f\\.css" . || true
          done
          echo '--- index order ---'
          grep -n 'home-live-hero\.css\|home-leaflet-covers\.css\|home-overview\.css\|home-footer-redesign\.css\|home-autopilot\.css\|home-save-today\.css\|home-in-store\.css' index.html || true
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/trace-next-home-css-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove next homepage CSS trace workflow"
          git push origin HEAD:perf/home-next-css-trace-20260902
