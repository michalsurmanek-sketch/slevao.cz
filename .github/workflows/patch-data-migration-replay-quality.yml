name: Patch data migration replay quality guard

on:
  push:
    branches: ['stabilize/data-migration-replay-safety']
    paths:
      - '.github/workflows/patch-data-migration-replay-quality.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/data-migration-replay-safety
      - name: Verify replay guards and append quality test
        run: |
          python - <<'PY'
          from pathlib import Path

          batch_files = [
            '20260818200839_deactivate_safe_albert_v4_unbranded_duplicates_b.sql',
            '20260818201017_deactivate_safe_albert_v4_unbranded_duplicates_z.sql',
            '20260818201050_deactivate_safe_albert_v4_unbranded_duplicates_s.sql',
            '20260818201119_deactivate_safe_albert_v4_unbranded_duplicates_p.sql',
            '20260818201158_deactivate_safe_albert_v4_unbranded_duplicates_r.sql',
            '20260818201223_deactivate_safe_albert_v4_unbranded_duplicates_tuvw.sql',
            '20260818201246_deactivate_safe_albert_v4_unbranded_duplicates_jl.sql',
            '20260818201331_deactivate_safe_albert_v4_unbranded_duplicates_mo.sql',
            '20260818201357_deactivate_safe_albert_v4_unbranded_duplicates_acdf.sql',
            '20260818201421_deactivate_safe_albert_v4_unbranded_duplicates_ghk.sql',
          ]
          for name in batch_files:
            text = Path('supabase/migrations', name).read_text().replace(' ', '')
            if 'ifnot(v_count=0andv_clusters=0)and(' not in text:
              raise SystemExit(f'Missing no-data guard in {name}')

          branded = Path('supabase/migrations/20260818191857_deactivate_safe_albert_v4_branded_duplicates_v1.sql').read_text().replace(' ', '')
          if 'ifnot(v_count=0andv_clusters=0)' not in branded:
            raise SystemExit('Missing branded no-data guard')

          repair = Path('supabase/migrations/20260818194000_repair_albert_v1_private_taxonomy_refs.sql').read_text().replace(' ', '')
          if 'ifnot(v_candidates=0andv_logs=0andv_visual=0andv_inactive_canonicals=0)' not in repair:
            raise SystemExit('Missing private-ref no-data guard')

          q = Path('.github/workflows/quality.yml')
          text = q.read_text()
          cmd = 'node tests/data-migration-replay-safety.mjs'
          if cmd not in text:
            anchor = 'node tests/store-leaflet-feed-published-only.mjs'
            if anchor not in text:
              raise SystemExit('Quality workflow anchor not found')
            q.write_text(text.replace(anchor, anchor + ' && ' + cmd, 1))
          PY
          git diff --check
      - name: Commit quality guard if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/quality.yml
          git commit -m 'Run data migration replay safety test'
          git push origin HEAD:stabilize/data-migration-replay-safety
