name: Nasazení databázových oprav administrace

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260803182000_admin_integrity_hardening.sql'
      - 'supabase/migrations/20260803185000_admin_offer_transaction.sql'
      - 'supabase/migrations/20260803190000_preserve_expired_offers.sql'
      - '.github/workflows/apply-admin-integrity-migrations.yml'
  workflow_dispatch:

concurrency:
  group: apply-admin-integrity-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Použít bezpečný koš, ukládání a archivaci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Použít SQL opravy v produkční databázi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: uhampjdqjxmbhaptgitn
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'supabase/migrations/20260803182000_admin_integrity_hardening.sql'
            'supabase/migrations/20260803185000_admin_offer_transaction.sql'
            'supabase/migrations/20260803190000_preserve_expired_offers.sql'
          )

          for file in "${files[@]}"; do
            echo "Používám $file"
            payload="$(jq -Rs '{query: ., read_only: false}' "$file")"
            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$payload")"

            cat "$response_file"
            echo
            if [[ "$http_status" != '200' && "$http_status" != '201' ]]; then
              echo "Nasazení $file selhalo s HTTP $http_status"
              exit 1
            fi
          done

          echo 'Databázové opravy administrace byly úspěšně použity.'
