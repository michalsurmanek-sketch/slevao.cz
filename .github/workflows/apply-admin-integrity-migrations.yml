name: Nasazení a kontrola administrace

on:
  push:
    branches:
      - main
    paths:
      - 'admin.html'
      - '404.html'
      - 'obchod.html'
      - 'assets/admin-save-offer-v2.js'
      - 'assets/admin-offers-full-list.js'
      - 'assets/admin-store-delete.js'
      - 'assets/admin-homepage-image-nav.js'
      - 'assets/store-generic-bootstrap.js'
      - 'supabase/migrations/20260803182000_admin_integrity_hardening.sql'
      - 'supabase/migrations/20260803185000_admin_offer_transaction.sql'
      - 'supabase/migrations/20260803190000_preserve_expired_offers.sql'
      - 'supabase/migrations/20260803193000_harden_public_rls.sql'
      - 'supabase/migrations/20260803194500_admin_create_offer_v2.sql'
      - '.github/workflows/apply-admin-integrity-migrations.yml'
  workflow_dispatch:

concurrency:
  group: apply-admin-integrity-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-and-test:
    name: Databáze, syntaxe a provozní kontrola
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zkontrolovat syntaxi JavaScriptu
        run: |
          node --check assets/admin-save-offer-v2.js
          node --check assets/admin-offers-full-list.js
          node --check assets/admin-store-delete.js
          node --check assets/admin-homepage-image-nav.js
          node --check assets/store-generic-bootstrap.js

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Použít SQL opravy v produkční databázi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: uhampjdqjxmbhaptgitn
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'supabase/migrations/20260803182000_admin_integrity_hardening.sql'
            'supabase/migrations/20260803185000_admin_offer_transaction.sql'
            'supabase/migrations/20260803190000_preserve_expired_offers.sql'
            'supabase/migrations/20260803193000_harden_public_rls.sql'
            'supabase/migrations/20260803194500_admin_create_offer_v2.sql'
          )

          run_query() {
            local file="$1"
            local read_only="${2:-false}"
            local payload response_file http_status
            payload="$(jq -Rs --argjson read_only "$read_only" '{query: ., read_only: $read_only}' "$file")"
            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$payload")"
            cat "$response_file"
            echo
            if [[ "$http_status" != '200' && "$http_status" != '201' ]]; then
              echo "Databázový dotaz selhal s HTTP $http_status"
              exit 1
            fi
          }

          for file in "${files[@]}"; do
            echo "Používám $file"
            run_query "$file" false
          done

          cat > /tmp/verify_admin.sql <<'SQL'
          do $$
          begin
            if to_regprocedure('public.admin_trash_offer(uuid)') is null then
              raise exception 'Chybí funkce admin_trash_offer';
            end if;
            if to_regprocedure('public.admin_restore_offer(uuid)') is null then
              raise exception 'Chybí funkce admin_restore_offer';
            end if;
            if to_regprocedure('public.admin_create_offer_v2(text,uuid,uuid,numeric,numeric,text,date,date,text,uuid)') is null then
              raise exception 'Chybí funkce admin_create_offer_v2';
            end if;
            if exists (
              select 1 from public.offers
              where status not in ('published','draft','review','expired','trash')
            ) then
              raise exception 'Databáze obsahuje neplatný stav nabídky';
            end if;
            if exists (
              select 1 from public.offers
              where status = 'published' and valid_to < current_date
            ) then
              raise exception 'Databáze obsahuje publikovanou prošlou nabídku';
            end if;
            if exists (
              select 1
              from pg_class
              where oid in (
                'public.offers'::regclass,
                'public.stores'::regclass,
                'public.categories'::regclass,
                'public.products'::regclass
              ) and not relrowsecurity
            ) then
              raise exception 'Na některé veřejné tabulce není aktivní RLS';
            end if;
          end
          $$;

          select
            (select count(*) from public.offers where status <> 'trash') as active_offers,
            (select count(*) from public.offers where status = 'trash') as trash_offers,
            (select count(*) from public.stores where is_active) as active_stores;
          SQL

          echo 'Ověřuji výsledný stav databáze'
          run_query /tmp/verify_admin.sql false
          echo 'Administrace a databázová integrita prošly automatickou kontrolou.'
