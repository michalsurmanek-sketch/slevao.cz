name: Nasazení a kontrola administrace

on:
  push:
    branches:
      - main
    paths:
      - 'admin.html'
      - 'admin-nahrat-letaky.html'
      - '404.html'
      - 'obchod.html'
      - 'assets/admin-save-offer-v2.js'
      - 'assets/admin-offers-full-list.js'
      - 'assets/admin-store-delete.js'
      - 'assets/admin-homepage-image-nav.js'
      - 'assets/admin-manual-leaflets.js'
      - 'assets/store-generic-bootstrap.js'
      - 'supabase/migrations/20260803182000_admin_integrity_hardening.sql'
      - 'supabase/migrations/20260803185000_admin_offer_transaction.sql'
      - 'supabase/migrations/20260803190000_preserve_expired_offers.sql'
      - 'supabase/migrations/20260803193000_harden_public_rls.sql'
      - 'supabase/migrations/20260803194500_admin_create_offer_v2.sql'
      - 'supabase/migrations/20260803200000_category_integrity.sql'
      - '.github/workflows/apply-admin-integrity-migrations.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'admin.html'
      - 'admin-nahrat-letaky.html'
      - '404.html'
      - 'obchod.html'
      - 'assets/admin-save-offer-v2.js'
      - 'assets/admin-offers-full-list.js'
      - 'assets/admin-store-delete.js'
      - 'assets/admin-homepage-image-nav.js'
      - 'assets/admin-manual-leaflets.js'
      - 'assets/store-generic-bootstrap.js'
      - 'supabase/migrations/20260803182000_admin_integrity_hardening.sql'
      - 'supabase/migrations/20260803185000_admin_offer_transaction.sql'
      - 'supabase/migrations/20260803190000_preserve_expired_offers.sql'
      - 'supabase/migrations/20260803193000_harden_public_rls.sql'
      - 'supabase/migrations/20260803194500_admin_create_offer_v2.sql'
      - 'supabase/migrations/20260803200000_category_integrity.sql'
      - '.github/workflows/apply-admin-integrity-migrations.yml'
  workflow_dispatch:

concurrency:
  group: apply-admin-integrity-migrations-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Syntaxe a architektura administrace
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.database-change.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Zkontrolovat syntaxi a architekturu JavaScriptu
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/admin-save-offer-v2.js
          node --check assets/admin-offers-full-list.js
          node --check assets/admin-store-delete.js
          node --check assets/admin-homepage-image-nav.js
          node --check assets/admin-manual-leaflets.js
          node --check assets/store-generic-bootstrap.js

          # Ruční upload musí používat jedinou serverovou Edge Function cestu.
          grep -Fq "const UPLOAD_FUNCTION = 'manual-leaflet-upload-v2';" assets/admin-manual-leaflets.js
          grep -Fq "const form = new FormData();" assets/admin-manual-leaflets.js
          grep -Fq "form.append('file', item.file, item.file.name);" assets/admin-manual-leaflets.js
          grep -Fq 'await callUploadFunction(form)' assets/admin-manual-leaflets.js
          ! grep -Fq 'storage.from' assets/admin-manual-leaflets.js
          ! grep -Fq 'admin-manual-leaflets-inline-fallback' admin-nahrat-letaky.html
          ! grep -Fq 'admin-manual-leaflets-client-register' admin-nahrat-letaky.html
          ! grep -Fq 'admin-manual-leaflets-bucket-hotfix' admin-nahrat-letaky.html

      - name: Zjistit, zda se změnily databázové migrace
        id: database-change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Pull request pouze validuje administraci; produkční DB se nemění.'
            exit 0
          fi

          migrations_regex='^supabase/migrations/(20260803182000_admin_integrity_hardening|20260803185000_admin_offer_transaction|20260803190000_preserve_expired_offers|20260803193000_harden_public_rls|20260803194500_admin_create_offer_v2|20260803200000_category_integrity)\.sql$'
          base="$BEFORE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
          fi

          if git diff --name-only "$base" "$HEAD_SHA" | grep -Eq "$migrations_regex"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Databázová migrace se změnila; produkční SQL kontrola se spustí.'
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Změna se netýká sledovaných migrací; produkční databáze zůstává beze změny.'
          fi

  apply-database:
    name: Databázová integrita
    needs: validate
    if: needs.validate.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Použít SQL opravy v produkční databázi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: uhampjdqjxmbhaptgitn
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'supabase/migrations/20260803182000_admin_integrity_hardening.sql'
            'supabase/migrations/20260803185000_admin_offer_transaction.sql'
            'supabase/migrations/20260803190000_preserve_expired_offers.sql'
            'supabase/migrations/20260803193000_harden_public_rls.sql'
            'supabase/migrations/20260803194500_admin_create_offer_v2.sql'
            'supabase/migrations/20260803200000_category_integrity.sql'
          )

          run_query() {
            local file="$1"
            local read_only="${2:-false}"
            local payload response_file http_status
            payload="$(jq -Rs --argjson read_only "$read_only" '{query: ., read_only: $read_only}' "$file")"
            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$payload")"
            cat "$response_file"
            echo
            if [[ "$http_status" != '200' && "$http_status" != '201' ]]; then
              echo "Databázový dotaz selhal s HTTP $http_status"
              exit 1
            fi
          }

          for file in "${files[@]}"; do
            echo "Používám $file"
            run_query "$file" false
          done

          cat > /tmp/verify_admin.sql <<'SQL'
          do $$
          begin
            if to_regprocedure('public.admin_trash_offer(uuid)') is null then
              raise exception 'Chybí funkce admin_trash_offer';
            end if;
            if to_regprocedure('public.admin_restore_offer(uuid)') is null then
              raise exception 'Chybí funkce admin_restore_offer';
            end if;
            if to_regprocedure('public.admin_create_offer_v2(text,uuid,uuid,numeric,numeric,text,date,date,text,uuid)') is null then
              raise exception 'Chybí funkce admin_create_offer_v2';
            end if;
            if exists (
              select 1 from public.offers
              where status not in ('published','draft','review','expired','trash')
            ) then
              raise exception 'Databáze obsahuje neplatný stav nabídky';
            end if;
            if exists (
              select 1 from public.offers
              where status = 'published' and valid_to < current_date
            ) then
              raise exception 'Databáze obsahuje publikovanou prošlou nabídku';
            end if;
            if exists (
              select 1 from public.categories
              where coalesce(trim(slug), '') = ''
            ) then
              raise exception 'Některá kategorie nemá slug';
            end if;
            if exists (
              select slug from public.categories
              group by slug having count(*) > 1
            ) then
              raise exception 'Kategorie obsahují duplicitní slug';
            end if;
            if exists (
              select 1
              from pg_class
              where oid in (
                'public.offers'::regclass,
                'public.stores'::regclass,
                'public.categories'::regclass,
                'public.products'::regclass,
                'public.leaflet_sources'::regclass,
                'public.leaflet_imports'::regclass
              ) and not relrowsecurity
            ) then
              raise exception 'Na některé veřejné tabulce není aktivní RLS';
            end if;
          end
          $$;

          select
            (select count(*) from public.offers where status <> 'trash') as active_offers,
            (select count(*) from public.offers where status = 'trash') as trash_offers,
            (select count(*) from public.stores where is_active) as active_stores,
            (select count(*) from public.categories where is_active) as active_categories,
            (select count(*) from public.leaflet_imports where metadata @> '{"manual_upload":true}'::jsonb) as manual_imports;
          SQL

          echo 'Ověřuji výsledný stav databáze'
          run_query /tmp/verify_admin.sql false
          echo 'Administrace a databázová integrita prošly automatickou kontrolou.'
