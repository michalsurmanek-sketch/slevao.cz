name: Kontrola kvality

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install_leaflet_card_fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix-home-leaflet-cards-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply repair
        run: |
          if [ ! -f .github/fix-home-leaflet-cards-trigger.txt ]; then
            echo "Repair already applied."
            exit 0
          fi
          python .github/scripts/fix_home_leaflet_cards.py
          rm -f .github/workflows/fix-home-leaflet-cards.yml
          rm -f .github/scripts/fix_home_leaflet_cards.py
          rm -f .github/fix-home-leaflet-cards-trigger.txt
          cat > .github/workflows/quality.yml <<'YAML'
          name: Kontrola kvality

          on:
            push:
              branches: ['main']
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Ověřit bezpečnost, JavaScript a SEO soubory
                  run: node tests/quality.mjs
          YAML
          node --check assets/home-leaflet-covers.js
          grep -q 'legacy/build/pdf.min.mjs' assets/home-leaflet-covers.js
          grep -q 'leafletFrontPageFrame' assets/home-leaflet-covers.js
          grep -q 'applyUnavailableCover(card)' assets/home-leaflet-covers.js
          ! grep -q 'card.remove();' assets/home-leaflet-covers.js
          grep -q 'home-leaflet-covers.js?v=20260802-2' index.html
          grep -q 'home-leaflet-covers.css?v=20260802-2' index.html
          node tests/quality.mjs
      - name: Commit repair
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898254+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep all current leaflet cards visible"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ověřit bezpečnost, JavaScript a SEO soubory
        run: node tests/quality.mjs
