name: Kontrola kvality

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Jednorázově přizpůsobit PDF mobilní obrazovce
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('assets/store-feed.js')
          js = js_path.read_text(encoding='utf-8')
          old_fit = """  function fitLeafletViewer() {
    const frame = $('leafletFrame');
    if (!frame || frame.hidden) return;
    const top = Math.max(frame.getBoundingClientRect().top, innerWidth <= 520 ? 76 : 96);
    const minimum = innerWidth <= 520 ? 360 : 420;
    frame.style.height = `${Math.max(minimum, Math.min(900, innerHeight - top - 12))}px`;
  }
"""
          new_fit = """  function fitLeafletViewer() {
    const frame = $('leafletFrame');
    if (!frame || frame.hidden) return;
    if (matchMedia('(max-width: 820px)').matches) {
      frame.style.removeProperty('height');
      frame.style.width = '100%';
      return;
    }
    const top = Math.max(frame.getBoundingClientRect().top, 96);
    frame.style.height = `${Math.max(420, Math.min(900, innerHeight - top - 12))}px`;
  }

  function leafletDocumentUrl(url, mobileViewer) {
    const view = mobileViewer
      ? 'page=1&zoom=page-width&view=FitH&toolbar=0&navpanes=0'
      : 'page=1&zoom=page-fit&view=Fit';
    return `${url}${url.includes('#') ? '&' : '#'}${view}`;
  }
"""
          if old_fit in js:
              js = js.replace(old_fit, new_fit, 1)
          js = js.replace("frame.src = `${signedUrl}#page=1&zoom=page-fit`;", "frame.src = leafletDocumentUrl(signedUrl, mobileViewer);", 1)
          js = js.replace("frame.src = `${leafletObjectUrl}#page=1&zoom=page-fit`;", "frame.src = leafletDocumentUrl(leafletObjectUrl, mobileViewer);", 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/store-feed.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Mobilní PDF přes celou obrazovku */'
          if marker not in css:
              css += """
/* Mobilní PDF přes celou obrazovku */
@media(max-width:820px){
  .leafletViewer{width:100vw;height:100dvh;max-width:none;max-height:100dvh}
  .leafletViewerHead{width:100%;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .leafletViewer iframe{display:block;flex:1 1 0;width:100vw!important;max-width:100vw;height:100%!important;min-height:0;margin:0;border:0;overflow:auto;background:#eef2f2}
}
"""
          css_path.write_text(css, encoding='utf-8')

          for path in Path('.').glob('*.html'):
              original = path.read_text(encoding='utf-8')
              updated = re.sub(r'assets/store-feed\.css\?v=[^"\']+', 'assets/store-feed.css?v=20260801-17', original)
              updated = re.sub(r'assets/store-feed\.js\?v=[^"\']+', 'assets/store-feed.js?v=20260801-19', updated)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
          PY

          node --check assets/store-feed.js
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/store-feed.js assets/store-feed.css -- '*.html'
            git commit -m "Fit leaflet PDFs to mobile screens"
            git push origin HEAD:main
          fi

      - name: Ověřit bezpečnost, JavaScript a SEO soubory
        run: node tests/quality.mjs
