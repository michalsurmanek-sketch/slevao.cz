name: Kontrola kvality

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ověřit bezpečnost, JavaScript a SEO soubory
        run: node tests/account-security.mjs && node tests/product-seo-canonical.mjs && node tests/public-offer-metrics.mjs && node tests/public-offer-page.mjs && node tests/public-offer-search.mjs && node tests/public-store-facets.mjs && node tests/home-server-search.mjs && node tests/product-taxonomy-preview.mjs && node tests/taxonomy-backfill-guard.mjs && node tests/product-detail-regression.mjs && node tests/generic-product-image-workflow.mjs && node tests/hruska-verified-import.mjs && node tests/quality.mjs && node tests/globus-viewer.mjs && node tests/store-delete.mjs && node tests/home-all-stores.mjs && node tests/homepage-leaflet-images.mjs && node tests/homepage-leaflet-visibility.mjs
