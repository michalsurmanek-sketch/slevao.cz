name: Kontrola kvality

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ověřit bezpečnost, JavaScript a SEO soubory
        run: node tests/quality.mjs

  verify_homepage_leaflet_feed:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'verify-homepage-leaflet-feed-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ověřit více nasazených letáků a dokumentů
        env:
          PUBLIC_KEY: sb_publishable_2I9ronLpYyn2kdnLRcdIUA_geOMF4XU
        run: |
          node <<'NODE'
          const base = 'https://uhampjdqjxmbhaptgitn.supabase.co';
          const key = process.env.PUBLIC_KEY;
          const slugs = ['tesco','penny','makro','kaufland','lidl','albert','billa','globus','coop','hruska','norma','terno'];
          const today = new Date().toISOString().slice(0, 10);
          const valid = [];

          async function timeoutFetch(url, options = {}, ms = 20000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            try { return await fetch(url, { ...options, signal: controller.signal }); }
            finally { clearTimeout(timer); }
          }

          async function actualDocument(previewUrl) {
            let response = await timeoutFetch(previewUrl, {
              method: 'HEAD',
              headers: { apikey: key },
            });
            let type = String(response.headers.get('content-type') || '').toLowerCase();
            if (response.ok && (type.includes('application/pdf') || type.startsWith('image/'))) {
              return { response, type };
            }
            if (!type.includes('application/json')) return { response, type };

            const jsonResponse = await timeoutFetch(previewUrl, {
              headers: { apikey: key, accept: 'application/json,application/pdf,*/*' },
            });
            if (!jsonResponse.ok) return { response: jsonResponse, type: String(jsonResponse.headers.get('content-type') || '').toLowerCase() };
            const payload = await jsonResponse.json();
            const signedUrl = String(payload?.url || '');
            if (!signedUrl.startsWith('https://')) return { response: jsonResponse, type: 'application/json' };

            response = await timeoutFetch(signedUrl, { method: 'HEAD' });
            type = String(response.headers.get('content-type') || '').toLowerCase();
            return { response, type };
          }

          for (const slug of slugs) {
            try {
              const response = await timeoutFetch(`${base}/functions/v1/store-leaflet-feed?store=${slug}&source=github-live-test-v2`, {
                headers: { apikey: key },
              });
              if (!response.ok) {
                console.log(`${slug}: feed HTTP ${response.status}`);
                continue;
              }
              const payload = await response.json();
              const leaflet = (Array.isArray(payload.leaflets) ? payload.leaflets : [])
                .filter((item) => item?.preview_url)
                .filter((item) => !item.valid_from || item.valid_from <= today)
                .filter((item) => !item.valid_to || item.valid_to >= today)[0];
              if (!leaflet) {
                console.log(`${slug}: bez aktuálního preview_url`);
                continue;
              }

              const { response: documentResponse, type } = await actualDocument(leaflet.preview_url);
              if (!documentResponse.ok || (!type.includes('application/pdf') && !type.startsWith('image/'))) {
                console.log(`${slug}: dokument HTTP ${documentResponse.status}, ${type || 'bez content-type'}`);
                continue;
              }
              valid.push({ slug, type, validTo: leaflet.valid_to || null });
              console.log(`${slug}: OK ${type}, platí do ${leaflet.valid_to || 'neuvedeno'}`);
            } catch (error) {
              console.log(`${slug}: ${error instanceof Error ? error.message : String(error)}`);
            }
          }

          if (valid.length < 2) {
            throw new Error(`Živý test našel pouze ${valid.length} použitelné aktuální letáky.`);
          }
          console.log(`OVĚŘENO: ${valid.length} použitelných letáků: ${valid.map((item) => item.slug).join(', ')}`);
          NODE
