name: Kontrola kvality

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Nasadit opravený dokumentový proxy Globus
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy store-leaflet-document \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt
      - name: Ověřit bezpečnost, JavaScript, SEO a živý Globus PDF
        run: node tests/quality.mjs && node tests/globus-viewer.mjs