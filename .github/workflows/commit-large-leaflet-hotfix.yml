name: Zapsat opravu velkých letáků

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/patch_process_leaflet_large_files.py'
      - '.github/workflows/commit-large-leaflet-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-large-leaflet-hotfix
  cancel-in-progress: false

jobs:
  patch-and-commit:
    name: Upravit zdroj process-leaflet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplikovat opravu
        run: |
          python .github/scripts/patch_process_leaflet_large_files.py
          grep -q "storageUploadWarning" supabase/functions/process-leaflet/index.ts
          grep -q "useRemoteUrl" supabase/functions/process-leaflet/index.ts

      - name: Commitnout změnu zdrojového kódu
        shell: bash
        run: |
          if git diff --quiet -- supabase/functions/process-leaflet/index.ts; then
            echo 'Zdrojový kód už obsahuje opravu.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/process-leaflet/index.ts
          git commit -m 'Opravit pád při zpracování velkých letáků'
          git push origin HEAD:main
