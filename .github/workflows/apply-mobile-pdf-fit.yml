name: Použít mobilní přizpůsobení PDF

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/apply-mobile-pdf-fit.yml'

permissions:
  contents: write

jobs:
  apply-mobile-pdf-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Přizpůsobit PDF šířce mobilu
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const jsPath = 'assets/store-feed.js';
          let js = fs.readFileSync(jsPath, 'utf8');
          const openMarker = '  async function openLeafletViewer(previewUrl, title, shouldScroll = true) {';
          const helper = `  function leafletDocumentUrl(url, mobileViewer) {
            const view = mobileViewer
              ? 'page=1&zoom=page-width&view=FitH&toolbar=0&navpanes=0&pagemode=none'
              : 'page=1&zoom=page-fit&view=Fit';
            return \`${'${url}'}#\${view}\`;
          }

`;

          if (!js.includes('function leafletDocumentUrl(')) {
            if (!js.includes(openMarker)) throw new Error('Nenalezen openLeafletViewer.');
            js = js.replace(openMarker, helper + openMarker);
          }

          js = js.replaceAll(
            'frame.src = `${signedUrl}#page=1&zoom=page-fit`;',
            'frame.src = leafletDocumentUrl(signedUrl, mobileViewer);'
          );
          js = js.replaceAll(
            'frame.src = `${leafletObjectUrl}#page=1&zoom=page-fit`;',
            'frame.src = leafletDocumentUrl(leafletObjectUrl, mobileViewer);'
          );
          fs.writeFileSync(jsPath, js);

          const htmlFiles = fs.readdirSync('.').filter((name) => name.endsWith('.html'));
          let changed = 0;
          for (const file of htmlFiles) {
            const original = fs.readFileSync(file, 'utf8');
            const updated = original.replace(
              /assets\/store-feed\.js\?v=[^"']+/g,
              'assets/store-feed.js?v=20260801-20'
            );
            if (updated !== original) {
              fs.writeFileSync(file, updated);
              changed++;
            }
          }
          console.log(`Aktualizováno ${changed} HTML stránek.`);
          NODE

          node --check assets/store-feed.js

      - name: Uložit změny
        run: |
          if git diff --quiet; then
            echo "Žádné změny"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/store-feed.js -- '*.html'
          git commit -m "Fit leaflet PDFs to mobile width"
          git push origin HEAD:main
