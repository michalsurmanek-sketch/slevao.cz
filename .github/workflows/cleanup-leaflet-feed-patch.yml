name: Cleanup leaflet feed patch helpers

on:
  push:
    branches: ['security/published-leaflet-feed-fallback']
    paths:
      - '.github/workflows/cleanup-leaflet-feed-patch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/published-leaflet-feed-fallback
      - name: Verify final patch state
        run: |
          python - <<'PY'
          from pathlib import Path
          feed = Path('supabase/functions/store-leaflet-feed/index.ts').read_text()
          if "li.status in ('published','review','publishing')" in feed:
              raise SystemExit('Legacy public status predicate still present')
          if feed.count("li.status = 'published'") < 2:
              raise SystemExit('Published-only fallback predicates missing')
          quality = Path('.github/workflows/quality.yml').read_text()
          if 'node tests/store-leaflet-feed-published-only.mjs' not in quality:
              raise SystemExit('Fallback regression test is not in quality workflow')
          if not Path('tests/store-leaflet-feed-published-only.mjs').exists():
              raise SystemExit('Fallback regression test file is missing')
          PY
      - name: Remove one-shot helpers
        run: |
          git rm -f .github/workflows/patch-published-leaflet-feed.yml \
                    .github/workflows/patch-leaflet-feed-quality.yml \
                    .github/workflows/cleanup-leaflet-feed-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-shot leaflet feed patch helpers'
          git push origin HEAD:security/published-leaflet-feed-fallback
