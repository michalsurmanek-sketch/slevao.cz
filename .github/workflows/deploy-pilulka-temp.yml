name: Deploy Pilulka sync (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pilulka-temp.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Replace unused diagnostic with Pilulka sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions delete inspect-product-page --project-ref uhampjdqjxmbhaptgitn --yes || true
          supabase functions deploy sync-pilulka-products --project-ref uhampjdqjxmbhaptgitn --use-api --no-verify-jwt
