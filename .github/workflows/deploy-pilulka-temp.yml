name: Remove blocked Pilulka sync (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pilulka-temp.yml
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Remove blocked Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions delete sync-pilulka-products --project-ref uhampjdqjxmbhaptgitn --yes || true
