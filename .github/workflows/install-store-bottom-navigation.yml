name: Install store bottom navigation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add shared bottom navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          js = r'''(() => {
            'use strict';

            const config = window.SLEVAO_STORE || {};
            const stores = [
              ['action','Action'],['albert','Albert'],['alza','Alza'],['asko','ASKO'],['auto-kelly','Auto Kelly'],['bauhaus','BAUHAUS'],
              ['benu','BENU'],['billa','BILLA'],['brnenka','Brněnka'],['ca','C&A'],['cba','CBA'],['coop','COOP'],['cropp','Cropp'],
              ['datart','DATART'],['decathlon','Decathlon'],['dek','DEK'],['dm','dm'],['dr-max','Dr. Max'],['enapo','Enapo'],
              ['eso-market','ESO MARKET'],['flop','FLOP'],['globus','Globus'],['hm','H&M'],['hornbach','HORNBACH'],['house','House'],
              ['hruska','Hruška'],['ikea','IKEA'],['intersport','INTERSPORT'],['jednota','Jednota'],['jip','JIP'],['jysk','JYSK'],
              ['kaufland','Kaufland'],['kik','KiK'],['konzum','Konzum'],['kosik','Košík.cz'],['kubik','Kubík'],['lidl','Lidl'],
              ['makro','MAKRO'],['moebelix','Möbelix'],['mountfield','Mountfield'],['new-yorker','NEW YORKER'],['norma','NORMA'],
              ['obi','OBI'],['okay','OKAY'],['penny','PENNY'],['pepco','PEPCO'],['petcenter','PetCenter'],['pilulka','Pilulka.cz'],
              ['planeo','PLANEO'],['potraviny-muj-obchod','Můj obchod'],['pramen-cz','Pramen CZ'],['pro-doma','PRO-DOMA'],['ratio','Ratio'],
              ['reserved','Reserved'],['rohlik','Rohlík.cz'],['rosa-market','ROSA market'],['rossmann','ROSSMANN'],['sconto','SCONTO'],
              ['sinsay','Sinsay'],['smarty','Smarty'],['sportisimo','SPORTISIMO'],['stavmat','STAVMAT'],['super-zoo','Super zoo'],
              ['takko','TAKKO'],['tamda','TAMDA'],['tedi','TEDi'],['tempo','TEMPO'],['terno','TERNO'],['tesco','Tesco'],['teta','Teta'],
              ['trefa','Trefa'],['xxxlutz','XXXLutz'],['zabka','Žabka']
            ];

            if (!config.slug || document.querySelector('.storeBottomNav')) return;
            const index = stores.findIndex(([slug]) => slug === config.slug);
            if (index < 0) return;

            const previous = stores[(index - 1 + stores.length) % stores.length];
            const next = stores[(index + 1) % stores.length];
            const href = ([slug]) => `${encodeURIComponent(slug)}.html`;

            const nav = document.createElement('nav');
            nav.className = 'storeBottomNav';
            nav.setAttribute('aria-label', 'Navigace mezi obchody a letákem');
            nav.innerHTML = `
              <a class="storeBottomNav__side storeBottomNav__previous" href="${href(previous)}" aria-label="Předchozí obchod: ${previous[1]}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                <span><small>Předchozí</small><strong>${previous[1]}</strong></span>
              </a>
              <button class="storeBottomNav__leaflet" type="button" aria-label="Přejít na aktuální leták">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 11h6M9 15h6"/></svg>
                <span>Leták</span>
              </button>
              <a class="storeBottomNav__side storeBottomNav__next" href="${href(next)}" aria-label="Následující obchod: ${next[1]}">
                <span><small>Následující</small><strong>${next[1]}</strong></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </a>`;

            document.body.appendChild(nav);
            document.body.classList.add('hasStoreBottomNav');

            const leafletButton = nav.querySelector('.storeBottomNav__leaflet');
            const leafletSection = document.querySelector('.leafletSection')
              || document.getElementById('leafletHeading')?.closest('section')
              || document.getElementById('storeLeafletHeading')?.closest('section');

            leafletButton.addEventListener('click', () => {
              const target = document.getElementById('leafletHeading')
                || document.getElementById('storeLeafletHeading')
                || leafletSection;
              target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
              leafletButton.classList.add('is-active');
              window.setTimeout(() => leafletButton.classList.remove('is-active'), 1400);
            });

            if (leafletSection && 'IntersectionObserver' in window) {
              const observer = new IntersectionObserver(([entry]) => {
                leafletButton.classList.toggle('is-visible', entry.isIntersecting);
              }, { threshold: 0.18, rootMargin: '-70px 0px -45% 0px' });
              observer.observe(leafletSection);
            }
          })();
          '''

          css = r'''/* Pevná spodní navigace detailu obchodu -------------------------------- */
          .hasStoreBottomNav{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
          .storeBottomNav{position:fixed;z-index:90;left:50%;bottom:16px;transform:translateX(-50%);width:min(760px,calc(100% - 24px));display:grid;grid-template-columns:minmax(0,1fr) 132px minmax(0,1fr);gap:7px;padding:8px;border:1px solid rgba(16,32,30,.12);border-radius:23px;background:rgba(255,255,255,.94);box-shadow:0 18px 54px rgba(10,35,32,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
          .storeBottomNav a,.storeBottomNav button{min-width:0;min-height:62px;border:0;border-radius:16px;text-decoration:none;cursor:pointer;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
          .storeBottomNav a:hover,.storeBottomNav button:hover{transform:translateY(-2px)}
          .storeBottomNav__side{display:flex;align-items:center;gap:10px;padding:8px 13px;color:var(--ink);background:transparent}
          .storeBottomNav__side:hover{background:#f0f6f5}
          .storeBottomNav__side svg{flex:0 0 23px;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
          .storeBottomNav__side span{min-width:0;display:flex;flex-direction:column;line-height:1.08}
          .storeBottomNav__side small{margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
          .storeBottomNav__side strong{overflow:hidden;color:var(--ink);font-size:14px;font-weight:950;text-overflow:ellipsis;white-space:nowrap}
          .storeBottomNav__next{justify-content:flex-end;text-align:right}
          .storeBottomNav__leaflet{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;background:var(--store);color:var(--store-on,#fff);font-weight:950;box-shadow:0 8px 22px color-mix(in srgb,var(--store) 28%,transparent)}
          .storeBottomNav__leaflet svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
          .storeBottomNav__leaflet.is-visible,.storeBottomNav__leaflet.is-active{background:var(--store-accent);color:color-mix(in srgb,var(--store) 82%,#111);box-shadow:0 0 0 3px color-mix(in srgb,var(--store-accent) 24%,transparent)}
          @media(max-width:650px){
            .hasStoreBottomNav{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
            .storeBottomNav{bottom:0;width:100%;grid-template-columns:minmax(0,1fr) 98px minmax(0,1fr);gap:4px;padding:7px 7px calc(7px + env(safe-area-inset-bottom,0px));border-width:1px 0 0;border-radius:20px 20px 0 0}
            .storeBottomNav a,.storeBottomNav button{min-height:58px;border-radius:14px}
            .storeBottomNav__side{gap:5px;padding:6px 7px}.storeBottomNav__side svg{width:20px;height:20px;flex-basis:20px}
            .storeBottomNav__side small{display:none}.storeBottomNav__side strong{font-size:12px}.storeBottomNav__leaflet{gap:5px;padding:0 8px;font-size:13px}.storeBottomNav__leaflet svg{width:21px;height:21px}
          }
          @media(prefers-reduced-motion:reduce){.storeBottomNav a,.storeBottomNav button{transition:none}.storeBottomNav a:hover,.storeBottomNav button:hover{transform:none}}
          '''

          Path('assets/store-bottom-nav.js').write_text(js.strip() + '\n', encoding='utf-8')
          Path('assets/store-bottom-nav.css').write_text(css.strip() + '\n', encoding='utf-8')

          pages = []
          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              if 'window.SLEVAO_STORE=' not in text:
                  continue
              pages.append(page)
              if 'assets/store-bottom-nav.css' not in text:
                  text = text.replace('</head>', '  <link rel="stylesheet" href="assets/store-bottom-nav.css?v=20260802-1">\n</head>')
              if 'assets/store-bottom-nav.js' not in text:
                  text = text.replace('</body>', '  <script src="assets/store-bottom-nav.js?v=20260802-1"></script>\n</body>')
              page.write_text(text, encoding='utf-8')

          if len(pages) != 73:
              raise SystemExit(f'Expected 73 store pages, found {len(pages)}')

          Path('.github/workflows/install-store-bottom-navigation.yml').unlink()
          PY

      - name: Verify navigation
        run: |
          node --check assets/store-bottom-nav.js
          python - <<'PY'
          from pathlib import Path
          pages = [p for p in Path('.').glob('*.html') if 'window.SLEVAO_STORE=' in p.read_text(encoding='utf-8')]
          assert len(pages) == 73
          for page in pages:
              text = page.read_text(encoding='utf-8')
              assert 'assets/store-bottom-nav.css?v=20260802-1' in text, page
              assert 'assets/store-bottom-nav.js?v=20260802-1' in text, page
          js = Path('assets/store-bottom-nav.js').read_text(encoding='utf-8')
          assert 'storeBottomNav__previous' in js
          assert 'storeBottomNav__leaflet' in js
          assert 'storeBottomNav__next' in js
          assert 'scrollIntoView' in js
          PY
          node tests/quality.mjs

      - name: Commit bottom navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add bottom navigation to store pages"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
