name: Apply critical admin improvements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-critical.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Attach critical admin files
        run: |
          python - <<'PY'
          from pathlib import Path

          admin = Path('admin.html')
          text = admin.read_text(encoding='utf-8')
          css = '  <link rel="stylesheet" href="assets/admin-critical.css?v=20260802-1">\n'
          js = '<script defer src="assets/admin-critical.js?v=20260802-1"></script>\n'
          if 'assets/admin-critical.css' not in text:
              text = text.replace('  <link rel="stylesheet" href="assets/admin-modern.css?v=20260802-1">\n', '  <link rel="stylesheet" href="assets/admin-modern.css?v=20260802-1">\n' + css, 1)
          if 'assets/admin-critical.js' not in text:
              text = text.replace('<script defer src="assets/admin-modern-ui.js?v=20260802-2"></script>\n', '<script defer src="assets/admin-modern-ui.js?v=20260802-2"></script>\n' + js, 1)
          admin.write_text(text, encoding='utf-8')

          control = Path('admin-tesco-kontrola.html')
          text = control.read_text(encoding='utf-8')
          query = '  <script defer src="assets/admin-product-control-query.js?v=20260802-1"></script>\n'
          if 'assets/admin-product-control-query.js' not in text:
              text = text.replace('  <script defer src="assets/admin-product-control.js?v=20260802-1"></script>\n', '  <script defer src="assets/admin-product-control.js?v=20260802-1"></script>\n' + query, 1)
          control.write_text(text, encoding='utf-8')
          PY

      - name: Verify implementation
        run: |
          node --check assets/admin-critical.js
          node --check assets/admin-product-control-query.js
          grep -q 'admin-critical.css' admin.html
          grep -q 'admin-critical.js' admin.html
          grep -q 'admin-product-control-query.js' admin-tesco-kontrola.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html admin-tesco-kontrola.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Activate critical admin improvements"
          git push origin main
