name: Deploy Žabka sync (temporary final)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-zabka-temp.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Replace unused diagnostic with Žabka sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions delete inspect-tesco-viewer --project-ref uhampjdqjxmbhaptgitn --yes || true
          supabase functions delete sync-zabka-products --project-ref uhampjdqjxmbhaptgitn --yes || true
          supabase functions deploy sync-zabka-products --project-ref uhampjdqjxmbhaptgitn --use-api --no-verify-jwt
