name: Install homepage leaflet covers

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'homepage-real-leaflet-covers-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Connect actual leaflet front pages
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('assets/home-leaflet-covers.js')
          js = js_path.read_text(encoding='utf-8')
          replacements = {
              "const document = await task.promise;": "const pdfDocument = await task.promise;",
              "const page = await document.getPage(1);": "const page = await pdfDocument.getPage(1);",
              "await document.destroy();": "await pdfDocument.destroy();",
          }
          for old, new in replacements.items():
              if old not in js:
                  raise SystemExit(f'Missing PDF renderer marker: {old}')
              js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          css_anchor = '<link rel="stylesheet" href="assets/home-v2.css?v=20260802-2">'
          css_link = '<link rel="stylesheet" href="assets/home-leaflet-covers.css?v=20260802-1">'
          if css_link not in html:
              if css_anchor not in html:
                  raise SystemExit('Homepage CSS anchor was not found')
              html = html.replace(css_anchor, css_anchor + '\n  ' + css_link, 1)

          old_copy = '<div><span class="eyebrow">Aktuálně v obchodech</span><h2>Letáky a nabídky obchodů</h2><p>Rychlý vstup do obchodů s platnými akčními nabídkami.</p></div>'
          new_copy = '<div><span class="eyebrow">Aktuálně v obchodech</span><h2>Letáky a nabídky obchodů</h2><p>Prohlédni si titulní strany právě platných letáků.</p></div>'
          if old_copy in html:
              html = html.replace(old_copy, new_copy, 1)

          script_anchor = '<script src="assets/home-v2.js?v=20260802-2" defer></script>'
          script_link = '<script src="assets/home-leaflet-covers.js?v=20260802-1" defer></script>'
          if script_link not in html:
              if script_anchor not in html:
                  raise SystemExit('Homepage JavaScript anchor was not found')
              html = html.replace(script_anchor, script_anchor + '\n  ' + script_link, 1)
          index_path.write_text(html, encoding='utf-8')
          PY

      - name: Remove one-time installer
        run: rm -f .github/workflows/install-home-leaflet-covers.yml .github/leaflet-cover-install-trigger.txt

      - name: Verify implementation
        run: |
          node --check assets/home-v2.js
          node --check assets/home-leaflet-covers.js
          grep -q 'assets/home-leaflet-covers.css?v=20260802-1' index.html
          grep -q 'assets/home-leaflet-covers.js?v=20260802-1' index.html
          grep -q 'pdfDocument.getPage(1)' assets/home-leaflet-covers.js
          grep -q 'Titulní strana aktuálního letáku' assets/home-leaflet-covers.js
          ! grep -q 'productPreview' assets/home-leaflet-covers.js
          node tests/quality.mjs

      - name: Commit verified homepage covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898254+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show current leaflet front pages on homepage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
