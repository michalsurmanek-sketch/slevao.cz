permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
      - name: Zkontrolovat JavaScript a manifest
        run: |
          node --check assets/rpc-request-dedupe.js
          node --check assets/home-v2.js
          node --check assets/home-count-semantics.js
          node --check assets/home-favorite-offer-sync.js
          node --check assets/web-push.js
          node --check assets/public-features.js
          node --check assets/public-nav-upgrade.js
          node --check assets/shopping-list.js
          node --check assets/shopping-insights.js
          node --check assets/product-detail.js
          node --check assets/product-detail-safety.js
          node --check assets/product-identity-guard.js
          node --check assets/product-search.js
          node --check assets/product-seo.js
          node --check assets/product-personalization.js
          node --check assets/product-intelligence.js
          node --check assets/product-leaflet-location-global.js
          node --check assets/product-premium-runtime.js
          node --check assets/product-equivalence.js
          node --check assets/home-personal-deals.js
          node --check assets/pwa-install.js
          node --check assets/account.js
          node --check assets/store-feed.js
          node --check assets/store-generic-bootstrap.js
          node --check assets/store-bottom-nav.js
          node --check assets/home-footer-redesign.js
          node --check assets/admin-modern-ui.js
          node --check service-worker.js
          node --check scripts/generate-product-sitemap.mjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest je platný JSON.')"
      - name: Homepage uložené a oblíbené produkty
        run: node tests/favorite-offer-reconciliation.mjs
      - name: Homepage facety a deduplikace
        run: node tests/home-facets-request-dedupe.mjs
      - name: Homepage request race a fallback
        run: node tests/home-request-race-resilience.mjs
      - name: Homepage význam počtů nabídek
        run: node tests/home-count-semantics.mjs
      - name: Generic discovery nesmí hladovět
        run: node tests/generic-leaflet-discovery-clock.mjs
      - name: Vlastnictví automatizace letáků
        run: node tests/leaflet-automation-ownership.mjs
      - name: Průběžné zdroje musí publikovat snapshot
        run: node tests/continuous-source-autopublish.mjs
      - name: FLOP produktový sync nesmí posouvat discovery clock
        run: node tests/flop-discovery-clock.mjs
      - name: FLOP prostorový PDF parser
        run: node tests/flop-pdf-spatial-parser.mjs
      - name: Globus plný API produktový feed
        run: node tests/globus-full-products-contract.mjs
      - name: JIP 12stránkový pack zdroj
        run: node tests/jip-pack-source-contract.mjs
      - name: JIP 24stránkový consensus fallback
        run: node tests/jip-html-consensus-fallback.mjs
      - name: KiK oficiální Publitas pipeline
        run: node tests/kik-official-publitas.mjs
      - name: Tesco bezpečný Apollo/PDF produktový feed
        run: node tests/tesco-apollo-pdf-safe-products.mjs
      - name: STAVMAT dedikovaná produktová pipeline
        run: node tests/stavmat-dedicated-pipeline.mjs
      - name: PLANEO waiting-source produktová pipeline
        run: node tests/planeo-waiting-source.mjs
      - name: Semantika product sync health
        run: node tests/product-sync-health-semantics.mjs
      - name: PRO-DOMA ukončení chybového index runu
        run: node tests/pro-doma-index-terminal-state.mjs
      - name: PRO-DOMA oficiální assets mirror
        run: node tests/pro-doma-assets-mirror.mjs
      - name: PRO-DOMA transient retry
        run: node tests/pro-doma-transient-retry.mjs
      - name: Sportisimo ověřený výprodej
        run: node tests/sportisimo-sale-frontpage.mjs
      - name: XXXLutz ověřené letákové slevy
        run: node tests/xxxlutz-verified-leaflets.mjs
      - name: Möbelix ověřené SALE kategorie
        run: node tests/moebelix-sale-categories.mjs
      - name: pg_net recyklace request ID
        run: node tests/pg-net-request-id-reuse.mjs
      - name: Web Push aktivační kontrakt
        run: node tests/web-push-contract.mjs
      - name: Regresní diagnostika detailu produktu
        run: node tests/product-detail-regression.mjs
      - name: Datová integrita store feedu
        run: node tests/store-feed-data-integrity.mjs