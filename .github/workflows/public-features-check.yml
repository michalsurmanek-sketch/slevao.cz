name: Kontrola veřejných funkcí

on:
  push:
    branches: [main]
    paths:
      - 'assets/public-features.js'
      - 'assets/shopping-list.js'
      - 'assets/product-detail.js'
      - 'assets/account.js'
      - 'assets/store-bottom-nav.js'
      - 'assets/home-footer-redesign.js'
      - 'assets/admin-modern-ui.js'
      - '.github/workflows/public-features-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
      - name: Zkontrolovat syntaxi JavaScriptu
        run: |
          node --check assets/public-features.js
          node --check assets/shopping-list.js
          node --check assets/product-detail.js
          node --check assets/account.js
          node --check assets/store-bottom-nav.js
          node --check assets/home-footer-redesign.js
          node --check assets/admin-modern-ui.js
