name: Add homepage overview guards once
on:
  push:
    branches:
      - perf/home-overview-inline-20260902
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/home-overview-inline-20260902
          fetch-depth: 0
      - name: Add overview bundle guards and tighten CSS budget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/e2e/home-request-budget.spec.mjs')
          s = p.read_text().replace('const CSS_BUDGET = 25;', 'const CSS_BUDGET = 24;')
          p.write_text(s)

          for name in [
              'tests/e2e/home-leaflet-covers-inline.spec.mjs',
              'tests/e2e/home-radius-inline.spec.mjs',
              'tests/e2e/home-mobile-hero-inline.spec.mjs',
          ]:
              p = Path(name)
              s = p.read_text().replace('stays at 25 CSS requests', 'stays at 24 CSS requests')
              s = s.replace('Expected at most 25 homepage CSS requests', 'Expected at most 24 homepage CSS requests')
              s = s.replace('toBeLessThanOrEqual(25)', 'toBeLessThanOrEqual(24)')
              p.write_text(s)

          p = Path('tests/home-css-request-consolidation.mjs')
          s = p.read_text()
          s = s.replace('assets\\/home-live-hero\\.css\\?v=20260902-10', 'assets\\/home-live-hero\\.css\\?v=20260902-11')
          needle = "const directCssLinks = [...index.matchAll(/<link\\s+rel=\"stylesheet\"\\s+href=\"assets\\/[^\"?]+\\.css(?:\\?[^\"#]*)?\"[^>]*>/g)];"
          block = r'''assert.equal(
  index.includes('assets/home-overview.css'),
  false,
  'homepage must keep desktop overview styles bundled into home-live-hero.css',
);
assert.match(liveHero, /Homepage bundle: desktop overview/);
assert.match(liveHero, /\.desktopOverview\{padding:0 0 14px\}/);
assert.match(liveHero, /\.desktopOverviewGrid\{width:min\(1450px,calc\(100% - 48px\)\);display:grid;grid-template-columns:1\.04fr \.98fr 1\.12fr/);
assert.match(liveHero, /\.overviewPanel\{min-width:0;min-height:0;height:var\(--overview-panel-height,auto\);display:flex;flex-direction:column;[\s\S]*border-radius:24px/);
assert.match(liveHero, /\.overviewLeaflets\{flex:1;display:grid;grid-template-columns:repeat\(3,minmax\(0,1fr\)\)/);
assert.match(liveHero, /\.overviewStores\{flex:1;display:grid;grid-template-columns:repeat\(4,minmax\(0,1fr\)\);grid-template-rows:repeat\(2,minmax\(0,1fr\)\)/);
assert.match(liveHero, /@media\(max-width:1100px\)\{\.desktopOverview\{display:none\}\}/);

'''
          if needle not in s:
              raise SystemExit('direct CSS guard anchor not found')
          s = s.replace(needle, block + needle, 1)
          s = s.replace("directCssLinks.length, 20, 'homepage should keep the consolidated 20 direct CSS links'", "directCssLinks.length, 19, 'homepage should keep the consolidated 19 direct CSS links'")
          p.write_text(s)
          PY

          cat > tests/e2e/home-overview-inline.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          const BASE_URL = 'http://127.0.0.1:4173';

          test('homepage keeps desktop overview styles bundled and stays at 24 CSS requests', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 1000 });
            const stylesheets = [];

            page.on('request', (request) => {
              let url;
              try { url = new URL(request.url()); } catch { return; }
              if (url.origin !== BASE_URL) return;
              if (request.resourceType() === 'stylesheet' && url.pathname.endsWith('.css')) {
                stylesheets.push(url.pathname);
              }
            });

            const response = await page.goto(`${BASE_URL}/index.html`, { waitUntil: 'domcontentloaded' });
            expect(response?.status()).toBe(200);
            await page.waitForTimeout(3000);

            expect(stylesheets.filter((path) => path === '/assets/home-overview.css')).toEqual([]);
            expect(stylesheets.length, `Expected at most 24 homepage CSS requests, got ${stylesheets.length}`).toBeLessThanOrEqual(24);

            const desktop = await page.evaluate(() => {
              const host = document.createElement('div');
              host.innerHTML = `
                <section class="desktopOverview">
                  <div class="desktopOverviewGrid">
                    <article class="overviewPanel">
                      <header class="overviewPanelHead"><h2>Letáky</h2></header>
                      <div class="overviewLeaflets">
                        <article class="leafletCard"><div class="leafletCover"><img class="leafletFrontPage"></div></article>
                        <article class="leafletCard"><div class="leafletCover"><img class="leafletFrontPage"></div></article>
                        <article class="leafletCard"><div class="leafletCover"><img class="leafletFrontPage"></div></article>
                      </div>
                    </article>
                    <article class="overviewPanel"><div class="overviewStores"><div class="storeCard"></div></div></article>
                    <article class="overviewPanel"><div class="overviewEnding"><a class="overviewDealRow"></a></div></article>
                  </div>
                </section>`;
              document.body.appendChild(host);
              const section = host.querySelector('.desktopOverview');
              const grid = host.querySelector('.desktopOverviewGrid');
              const panel = host.querySelector('.overviewPanel');
              const leaflets = host.querySelector('.overviewLeaflets');
              const cover = host.querySelector('.overviewLeaflets .leafletCover');
              const stores = host.querySelector('.overviewStores');
              const ending = host.querySelector('.overviewEnding');
              const row = host.querySelector('.overviewDealRow');
              const result = {
                sectionDisplay: getComputedStyle(section).display,
                sectionPaddingBottom: getComputedStyle(section).paddingBottom,
                gridDisplay: getComputedStyle(grid).display,
                gridColumns: getComputedStyle(grid).gridTemplateColumns,
                gridGap: getComputedStyle(grid).gap,
                panelRadius: getComputedStyle(panel).borderRadius,
                panelDisplay: getComputedStyle(panel).display,
                leafletsDisplay: getComputedStyle(leaflets).display,
                leafletColumns: getComputedStyle(leaflets).gridTemplateColumns,
                coverHeight: getComputedStyle(cover).height,
                storesDisplay: getComputedStyle(stores).display,
                storeColumns: getComputedStyle(stores).gridTemplateColumns,
                endingDisplay: getComputedStyle(ending).display,
                endingRows: getComputedStyle(ending).gridTemplateRows,
                rowRadius: getComputedStyle(row).borderRadius,
              };
              host.remove();
              return result;
            });

            expect(desktop.sectionDisplay).not.toBe('none');
            expect(desktop.sectionPaddingBottom).toBe('14px');
            expect(desktop.gridDisplay).toBe('grid');
            expect(desktop.gridColumns.split(' ').length).toBe(3);
            expect(desktop.gridGap).toBe('12px');
            expect(desktop.panelRadius).toBe('24px');
            expect(desktop.panelDisplay).toBe('flex');
            expect(desktop.leafletsDisplay).toBe('grid');
            expect(desktop.leafletColumns.split(' ').length).toBe(3);
            expect(desktop.coverHeight).toBe('173px');
            expect(desktop.storesDisplay).toBe('grid');
            expect(desktop.storeColumns.split(' ').length).toBe(4);
            expect(desktop.endingDisplay).toBe('grid');
            expect(desktop.endingRows.split(' ').length).toBe(3);
            expect(desktop.rowRadius).toBe('13px');

            await page.setViewportSize({ width: 1000, height: 900 });
            const mobileHidden = await page.evaluate(() => {
              const el = document.createElement('section');
              el.className = 'desktopOverview';
              document.body.appendChild(el);
              const display = getComputedStyle(el).display;
              el.remove();
              return display;
            });
            expect(mobileHidden).toBe('none');
          });
          EOF
          sed -i 's/^          //' tests/e2e/home-overview-inline.spec.mjs
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/add-home-overview-guards-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Guard bundled homepage overview styles"
          git push origin HEAD:perf/home-overview-inline-20260902
