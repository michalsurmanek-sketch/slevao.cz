name: Terno OCR

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/sync_terno_ocr.py'
      - '.github/workflows/sync-terno-ocr.yml'
      - '.github/terno-ocr-trigger.txt'

permissions:
  contents: read

concurrency:
  group: terno-ocr-current-flyer
  cancel-in-progress: false

jobs:
  ocr:
    name: OCR aktuálního Terno letáku
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověřit Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Nainstalovat český Tesseract
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng
          tesseract --version | head -1
          tesseract --list-langs | grep -E '^(ces|eng)$'

      - name: OCR a uložení souřadnic do Supabase
        run: python3 scripts/sync_terno_ocr.py
