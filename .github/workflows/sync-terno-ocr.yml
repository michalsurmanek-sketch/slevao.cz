name: Terno OCR

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/terno-ocr-trigger.txt'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/sync_terno_ocr.py'
      - 'scripts/sync_terno_ocr_direct.py'
      - 'scripts/test_terno_ocr_direct.py'
      - '.github/workflows/sync-terno-ocr.yml'
      - '.github/terno-ocr-trigger.txt'

permissions:
  contents: read

concurrency:
  group: terno-ocr-current-flyer
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ocr:
    name: OCR aktuálního Terno letáku
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ověřit Terno target selector bez sítě
        shell: bash
        run: python3 scripts/test_terno_ocr_direct.py

      - name: Ověřit Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Nainstalovat český Tesseract
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng
          tesseract --version | head -1
          tesseract --list-langs | grep -E '^(ces|eng)$'

      - name: OCR a uložení souřadnic do Supabase
        shell: bash
        run: |
          set -euo pipefail
          last_status=1
          for attempt in 1 2 3 4 5; do
            log_file="$(mktemp)"
            set +e
            python3 scripts/sync_terno_ocr_direct.py > >(tee "$log_file") 2> >(tee -a "$log_file" >&2)
            status=$?
            set -e
            last_status=$status

            if [[ $status -eq 0 ]]; then
              rm -f "$log_file"
              exit 0
            fi

            if ! grep -Eqi 'TimeoutError|timed out|HTTP (408|425|429|5[0-9]{2})' "$log_file"; then
              echo "Terno OCR selhal trvalou chybou; retry se neprovede."
              rm -f "$log_file"
              exit "$status"
            fi

            if [[ $attempt -lt 5 ]]; then
              delay=$((attempt * 30))
              echo "Dočasná síťová chyba Terno OCR (pokus ${attempt}/5), opakuji za ${delay} s."
              rm -f "$log_file"
              sleep "$delay"
            else
              rm -f "$log_file"
            fi
          done
          exit "$last_status"
