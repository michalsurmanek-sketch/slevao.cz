name: Nasazení hlavní pipeline letáků v2

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/run-leaflet-pipeline-v2/**'
      - '.github/workflows/deploy-run-leaflet-pipeline-v2.yml'
  workflow_dispatch:

concurrency:
  group: deploy-run-leaflet-pipeline-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Nasadit run-leaflet-pipeline-v2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit pouze hlavní pipeline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy run-leaflet-pipeline-v2 \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Ověřit dostupnost funkce
        run: |
          response="$(curl --fail --silent --show-error \
            --request OPTIONS \
            --retry 10 --retry-delay 3 \
            'https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/run-leaflet-pipeline-v2')"
          test "$response" = 'ok'
