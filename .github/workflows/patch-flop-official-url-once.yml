name: Patch FLOP official URL once

on:
  push:
    branches: ['fix/flop-waiting-source-v1']
    paths:
      - '.github/workflows/patch-flop-official-url-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flop-waiting-source-v1
      - name: Replace exactly the stale FLOP source definition
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/sync-official-leaflet-sources/index.ts')
          s = p.read_text()
          old = "{ slug: 'flop', name: 'Flop – akční leták', urls: ['https://www.flop.cz/akcni-letak', 'https://www.flop-potraviny.cz/akcni-letak'] },"
          new = "{ slug: 'flop', name: 'Flop – akční leták', urls: ['https://www.flop-potraviny.cz/akcni-letaky/'] },"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale FLOP catalog definition, found {s.count(old)}')
          s = s.replace(old, new, 1)
          if 'https://www.flop-potraviny.cz/akcni-letak\'' in s or 'https://www.flop.cz/akcni-letak\'' in s:
              raise SystemExit('Stale FLOP source URL remained after patch')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit patch and remove helper
        run: |
          git rm .github/workflows/patch-flop-official-url-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/sync-official-leaflet-sources/index.ts
          git commit -m 'Use current FLOP official leaflet URL'
          git push origin HEAD:fix/flop-waiting-source-v1
