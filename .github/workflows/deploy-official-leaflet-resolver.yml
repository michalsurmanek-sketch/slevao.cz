name: Nasazení vyhledávače oficiálních letáků

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/sync-official-leaflet-sources/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-official-leaflet-resolver.yml'

concurrency:
  group: deploy-official-leaflet-resolver
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit JWT konfiguraci
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^\[functions\.sync-official-leaflet-sources\]$' supabase/config.toml
          awk '
            /^\[functions\.sync-official-leaflet-sources\]$/ { in_target=1; next }
            /^\[/ { in_target=0 }
            in_target && /^verify_jwt[[:space:]]*=[[:space:]]*true[[:space:]]*$/ { found=1 }
            END { exit(found ? 0 : 1) }
          ' supabase/config.toml

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit vyhledávač oficiálních letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-official-leaflet-sources \
            --project-ref uhampjdqjxmbhaptgitn

      - name: Ověřit JWT ochranu nasazené funkce
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"store_slug":"flop","limit":1}' \
            'https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/sync-official-leaflet-sources')"
          cat "$response_file"
          echo
          test "$http_code" = '401'
