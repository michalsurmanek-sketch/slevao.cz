name: Nasazení vyhledávače oficiálních letáků

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/sync-official-leaflet-sources/**'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/sync-official-leaflet-sources/**'
      - '.github/workflows/deploy-official-leaflet-resolver.yml'
  workflow_dispatch:

concurrency:
  group: deploy-official-leaflet-resolver-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Ověřit official leaflet resolver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ověřit JWT konfiguraci a zdroj
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^verify_jwt[[:space:]]*=[[:space:]]*true[[:space:]]*$' supabase/functions/sync-official-leaflet-sources/config.toml
          grep -q 'Deno.serve' supabase/functions/sync-official-leaflet-sources/index.ts
          ! grep -q -- '--no-verify-jwt' .github/workflows/deploy-official-leaflet-resolver.yml

  deploy:
    name: Nasadit official leaflet resolver
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit vyhledávač oficiálních letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-official-leaflet-sources \
            --project-ref uhampjdqjxmbhaptgitn

      - name: Ověřit JWT ochranu nasazené funkce
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"store_slug":"flop","limit":1}' \
            'https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/sync-official-leaflet-sources')"
          cat "$response_file"
          echo
          test "$http_code" = '401'
