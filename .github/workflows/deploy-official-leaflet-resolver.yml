name: Nasazení vyhledávače oficiálních letáků

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/sync-official-leaflet-sources/**'
      - '.github/workflows/deploy-official-leaflet-resolver.yml'

concurrency:
  group: deploy-official-leaflet-resolver
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit vyhledávač oficiálních letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-official-leaflet-sources \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Ověřit dostupnost nasazené funkce
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --request OPTIONS \
            --retry 10 --retry-delay 3 \
            'https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/sync-official-leaflet-sources')"
          test "$response" = 'ok'
