name: Trace store-arrival CSS loader once

on:
  push:
    branches:
      - perf/store-arrival-css-trace-20260901
    paths:
      - .github/workflows/trace-store-arrival-css-once.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/store-arrival-css-trace-20260901
          fetch-depth: 0
      - name: Trace exact references
        shell: bash
        run: |
          echo '=== exact store-arrival stylesheet refs ==='
          grep -RIn --exclude-dir=.git --exclude='trace-store-arrival-css-once.yml' 'store-arrival-alerts.css' . || true
          echo '=== store-arrival refs in assets ==='
          grep -RIn --include='*.js' --include='*.css' 'store-arrival-alerts' assets || true
          echo '=== stylesheet loaders near arrival modules ==='
          grep -RIn --include='*.js' -E 'createElement.*link|rel.*stylesheet|href.*\.css' assets | grep -E 'arrival|personal|public|footer|home' || true
      - name: Remove diagnostic workflow
        shell: bash
        run: |
          git rm .github/workflows/trace-store-arrival-css-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove store-arrival CSS trace workflow"
          git push origin HEAD:perf/store-arrival-css-trace-20260901
