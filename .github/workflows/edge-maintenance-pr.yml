name: Edge maintenance PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  edge-maintenance:
    name: Uvolnit kapacitu Supabase Edge Functions
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[edge-maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.SUPABASE_PERSONAL_ACCESS_TOKEN || secrets.SUPABASE_PAT || secrets.SUPABASE_CLI_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Není dostupný žádný podporovaný GitHub secret s Supabase management tokenem.'
            exit 1
          }

      - name: Odstranit nepoužívané diagnostické Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_REF='uhampjdqjxmbhaptgitn'
          debug_functions=(
            debug-albert-catalog-parser
            debug-albert-collection-stores
            debug-albert-dynamic-page
            debug-albert-graphql
            debug-albert-publitas
            debug-albert-site
            debug-albert-source
            debug-albert-store
            debug-albert-text-parser
            debug-bauhaus-source
            debug-benu-source
            debug-datart-source
            debug-dm-source
            debug-drmax-source
            debug-intersport-source
            debug-jip-source
            debug-jysk-source
            debug-kik-source
            debug-makro-source
            debug-moebelix-source
            debug-obi-source
            debug-pepco-source
            debug-retail-candidates
            debug-rossmann-source
            debug-tedi-source
            debug-terno-source
            debug-teta-source
            debug-xxxlutz-source
            debug-zabka-source
          )
          for function_name in "${debug_functions[@]}"; do
            echo "Odstraňuji ${function_name}, pokud existuje..."
            printf 'y\n' | supabase functions delete "$function_name" --project-ref "$PROJECT_REF" || true
          done
          echo 'debug-kaufland-source zůstává zachován.'

      - name: Nasadit strukturovaný retail parser
        run: |
          supabase functions deploy sync-structured-retail-products \
            --project-ref uhampjdqjxmbhaptgitn \
            --use-api

      - name: Nasadit úplný BENU parser
        run: |
          supabase functions deploy sync-benu-source \
            --project-ref uhampjdqjxmbhaptgitn \
            --use-api

      - name: Ověřit výslednou kapacitu
        run: |
          supabase functions list --project-ref uhampjdqjxmbhaptgitn
