name: Deploy KiK source fix (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-kik-source-temp.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Replace KiK source Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions delete sync-kik-source --project-ref uhampjdqjxmbhaptgitn --yes || true
          supabase functions deploy sync-kik-source --project-ref uhampjdqjxmbhaptgitn --use-api --no-verify-jwt
