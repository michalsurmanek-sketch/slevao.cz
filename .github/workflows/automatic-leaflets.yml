name: Automatické letáky

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Nasazení vyhledávače oficiálních letáků
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: automatic-leaflets
  cancel-in-progress: true

jobs:
  sync-official:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Doplnit ${{ matrix.store }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        store:
          - flop
          - terno
          - trefa
          - jip
          - norma
          - zabka
          - brnenka
          - cba
          - jednota
          - konzum
          - tempo
          - ratio
          - kubik
          - rosa-market
          - tamda
          - potraviny-muj-obchod
          - pramen-cz
          - eso-market
          - rossmann
          - teta
          - dm
          - tedi
          - pepco
          - kik
          - takko
          - hornbach
          - dek
          - pro-doma
          - stavmat
          - datart
          - planeo
          - okay
          - smarty
          - jysk
          - xxxlutz
          - decathlon
          - sportisimo
          - super-zoo
          - petcenter
          - dr-max
          - benu
          - pilulka
          - auto-kelly
    steps:
      - name: Ověřit Supabase secret
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Najít aktuální oficiální leták
        env:
          STORE_SLUG: ${{ matrix.store }}
          SUPABASE_URL: https://uhampjdqjxmbhaptgitn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --location \
            --retry 2 \
            --retry-delay 5 \
            --max-time 300 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "{\"store_slug\":\"$STORE_SLUG\",\"limit\":1}" \
            "$SUPABASE_URL/functions/v1/sync-official-leaflet-sources")"

          cat "$response_file"
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Synchronizace obchodu $STORE_SLUG skončila HTTP $http_code"
            exit 1
          fi
