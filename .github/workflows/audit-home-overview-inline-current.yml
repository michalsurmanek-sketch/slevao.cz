name: Apply current homepage overview CSS consolidation

on:
  push:
    branches:
      - 'perf/home-overview-inline-20260906'
    paths:
      - '.github/workflows/audit-home-overview-inline-current.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/home-overview-inline-20260906
      - name: Inline current overview CSS without reverting newer homepage work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          hero_path = Path('assets/home-live-hero.css')
          overview_path = Path('assets/home-overview.css')
          hero = hero_path.read_text()
          overview = overview_path.read_text().strip()
          marker = '/* Homepage bundle: desktop overview */'
          if marker not in hero:
              hero = hero.rstrip() + '\n\n' + marker + '\n' + overview + '\n'
              hero_path.write_text(hero)

          index_path = Path('index.html')
          index = index_path.read_text()
          index, hero_count = re.subn(
              r'(<link rel="stylesheet" href="assets/home-live-hero\.css\?v=)[^"]+(">)',
              r'\g<1>20260906-1\2',
              index,
              count=1,
          )
          if hero_count != 1:
              raise SystemExit(f'home-live-hero link count was {hero_count}, expected 1')
          index, overview_count = re.subn(
              r'^\s*<link rel="stylesheet" href="assets/home-overview\.css\?v=[^"]+">\s*\n',
              '',
              index,
              count=1,
              flags=re.M,
          )
          if overview_count != 1:
              raise SystemExit(f'home-overview link count was {overview_count}, expected 1')
          index_path.write_text(index)

          guard_path = Path('tests/home-css-request-consolidation.mjs')
          guard = guard_path.read_text()
          overview_guard = """assert.equal(\n  index.includes('assets/home-overview.css'),\n  false,\n  'homepage must keep desktop overview styles bundled into home-live-hero.css',\n);\nassert.match(liveHero, /Homepage bundle: desktop overview/);\nassert.match(liveHero, /\\.desktopOverview\\{padding:0 0 14px\\}/);\n\n"""
          anchor = 'const directCssLinks ='
          if overview_guard not in guard:
              if anchor not in guard:
                  raise SystemExit('direct CSS link guard anchor missing')
              guard = guard.replace(anchor, overview_guard + anchor, 1)
          old_budget = "assert.equal(directCssLinks.length, 20, 'homepage should keep the consolidated 20 direct CSS links with recipe styles inline');"
          new_budget = "assert.equal(directCssLinks.length, 19, 'homepage should keep the consolidated 19 direct CSS links with recipe styles inline');"
          if old_budget in guard:
              guard = guard.replace(old_budget, new_budget, 1)
          elif new_budget not in guard:
              raise SystemExit('static CSS request budget anchor missing')
          guard_path.write_text(guard)

          for filename in [
              'tests/e2e/home-leaflet-covers-inline.spec.mjs',
              'tests/e2e/home-mobile-hero-inline.spec.mjs',
              'tests/e2e/home-radius-inline.spec.mjs',
          ]:
              path = Path(filename)
              text = path.read_text()
              text = text.replace('25 CSS requests', '24 CSS requests')
              text = text.replace('at most 25 homepage CSS requests', 'at most 24 homepage CSS requests')
              text = text.replace('toBeLessThanOrEqual(25)', 'toBeLessThanOrEqual(24)')
              path.write_text(text)

          budget_path = Path('tests/e2e/home-request-budget.spec.mjs')
          budget = budget_path.read_text()
          if 'const CSS_BUDGET = 25;' in budget:
              budget = budget.replace('const CSS_BUDGET = 25;', 'const CSS_BUDGET = 24;', 1)
          elif 'const CSS_BUDGET = 24;' not in budget:
              raise SystemExit('browser CSS budget anchor missing')
          budget_path.write_text(budget)

          overview_test = Path('tests/e2e/home-overview-inline.spec.mjs')
          overview_test.write_text("""import { test, expect } from '@playwright/test';\n\nconst BASE_URL = 'http://127.0.0.1:4173';\n\ntest('homepage keeps desktop overview styles bundled and stays at 24 CSS requests', async ({ page }) => {\n  await page.setViewportSize({ width: 1440, height: 900 });\n  const stylesheets = [];\n  page.on('request', (request) => {\n    let url;\n    try { url = new URL(request.url()); } catch { return; }\n    if (url.origin !== BASE_URL) return;\n    if (request.resourceType() === 'stylesheet' && url.pathname.endsWith('.css')) stylesheets.push(url.pathname);\n  });\n\n  const response = await page.goto(`${BASE_URL}/index.html`, { waitUntil: 'domcontentloaded' });\n  expect(response?.status()).toBe(200);\n  await page.waitForTimeout(3000);\n\n  expect(stylesheets.filter((path) => path === '/assets/home-overview.css')).toEqual([]);\n  expect(stylesheets.length, `Expected at most 24 homepage CSS requests, got ${stylesheets.length}`).toBeLessThanOrEqual(24);\n\n  const computed = await page.evaluate(() => {\n    const host = document.createElement('section');\n    host.className = 'desktopOverview';\n    host.innerHTML = '<div class="desktopOverviewGrid"><article class="overviewPanel"><div class="overviewPanelHead"><h2>Test</h2></div></article></div>';\n    document.body.appendChild(host);\n    const grid = host.querySelector('.desktopOverviewGrid');\n    const panel = host.querySelector('.overviewPanel');\n    const out = { gridDisplay: getComputedStyle(grid).display, panelRadius: getComputedStyle(panel).borderRadius };\n    host.remove();\n    return out;\n  });\n  expect(computed.gridDisplay).toBe('grid');\n  expect(computed.panelRadius).toBe('24px');\n});\n""")
          PY
          node tests/home-css-request-consolidation.mjs
          git diff --check
      - name: Commit audited current-main optimization and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/audit-home-overview-inline-current.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf: inline current homepage overview styles'
          git push origin HEAD:perf/home-overview-inline-20260906
