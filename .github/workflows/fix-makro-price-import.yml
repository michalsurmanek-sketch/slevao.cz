name: Jednorázová oprava cen MAKRO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-makro-price-import.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit normalizaci cen MAKRO
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/process-leaflet/index.ts')
          text = path.read_text(encoding='utf-8')

          old_prompt = " U MAKRO vždy použij jako price konečnou cenu s DPH. Menší cenu bez DPH a větší cenu s DPH nikdy nevykládej jako akční a původní cenu; old_price v takovém případě musí být null."
          new_prompt = " U MAKRO vždy použij jako price velkou hlavní zvýrazněnou cenu uvedenou u produktu. Menší doplňkovou cenu s DPH ani bez DPH neukládej jako old_price; old_price musí být null, pokud leták výslovně neukazuje přeškrtnutou původní cenu."
          if old_prompt not in text:
              raise SystemExit('Nenalezen původní MAKRO prompt.')
          text = text.replace(old_prompt, new_prompt, 1)

          old_block = """      if (isMakro && oldPrice) {
        price = oldPrice;
        oldPrice = null;
      }
"""
          new_block = """      if (isMakro) {
        // Zachovej velkou hlavní cenu z letáku. Doplňková cena s DPH/bez DPH
        // není původní cena a nesmí hlavní cenu přepsat.
        oldPrice = null;
      }
"""
          if old_block not in text:
              raise SystemExit('Nenalezen původní blok přepisu cen MAKRO.')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text, encoding='utf-8')
          PY

          grep -F "Zachovej velkou hlavní cenu z letáku" supabase/functions/process-leaflet/index.ts
          grep -F "velkou hlavní zvýrazněnou cenu" supabase/functions/process-leaflet/index.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Nasadit opravený import
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Chybí SUPABASE_ACCESS_TOKEN' && exit 1)
          supabase functions deploy process-leaflet --project-ref uhampjdqjxmbhaptgitn

      - name: Uložit opravu a odstranit jednorázový workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-makro-price-import.yml
          git add supabase/functions/process-leaflet/index.ts
          git commit -m "Preserve advertised Makro leaflet prices"
          git push origin HEAD:main
