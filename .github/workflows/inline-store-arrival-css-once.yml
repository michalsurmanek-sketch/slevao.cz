name: Inline store-arrival CSS once

on:
  push:
    branches:
      - perf/store-arrival-css-inline-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/store-arrival-css-inline-20260901
          fetch-depth: 0

      - name: Inline homepage arrival CSS and keep non-home loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arrival_path = Path('assets/store-arrival-alerts.css')
          home_css_path = Path('assets/home-footer-redesign.css')
          nav_path = Path('assets/public-nav-upgrade.js')

          arrival = arrival_path.read_text(encoding='utf-8').strip()
          home_css = home_css_path.read_text(encoding='utf-8')
          marker = '/* Homepage bundle: store-arrival alerts */'
          if marker in home_css:
              raise SystemExit('arrival CSS already in homepage bundle')
          home_css_path.write_text(home_css.rstrip() + '\n\n' + marker + '\n' + arrival + '\n', encoding='utf-8')

          nav = nav_path.read_text(encoding='utf-8')
          old = "if (!document.querySelector('link[href*=\"store-arrival-alerts.css\"]')) {"
          new = "if (!isHomePage() && !document.querySelector('link[href*=\"store-arrival-alerts.css\"]')) {"
          if nav.count(old) != 1:
              raise SystemExit(f'expected exactly one arrival CSS loader guard, got {nav.count(old)}')
          nav_path.write_text(nav.replace(old, new, 1), encoding='utf-8')

          nav_old = 'assets/public-nav-upgrade.js?v=20260830-1'
          nav_new = 'assets/public-nav-upgrade.js?v=20260901-2'
          footer_old = 'assets/home-footer-redesign.css?v=20260811-3'
          footer_new = 'assets/home-footer-redesign.css?v=20260901-4'
          nav_hits = 0
          footer_hits = 0
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              n1 = text.count(nav_old)
              n2 = text.count(footer_old)
              if n1 or n2:
                  text = text.replace(nav_old, nav_new).replace(footer_old, footer_new)
                  path.write_text(text, encoding='utf-8')
                  nav_hits += n1
                  footer_hits += n2
          if nav_hits < 1:
              raise SystemExit('no public-nav-upgrade cache-bust references updated')
          if footer_hits < 1:
              raise SystemExit('no home-footer-redesign cache-bust references updated')
          print({'nav_refs_updated': nav_hits, 'footer_refs_updated': footer_hits})
          PY

          grep -n "Homepage bundle: store-arrival alerts" assets/home-footer-redesign.css
          grep -n "!isHomePage() && !document.querySelector('link\[href\*=\\\"store-arrival-alerts.css\\\"\]')" assets/public-nav-upgrade.js
          grep -RIn --include='*.html' 'public-nav-upgrade.js?v=20260901-2' .
          grep -RIn --include='*.html' 'home-footer-redesign.css?v=20260901-4' .

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/inline-store-arrival-css-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/public-nav-upgrade.js assets/home-footer-redesign.css '*.html'
          git commit -m "Inline homepage store-arrival styles"
          git push origin HEAD:perf/store-arrival-css-inline-20260901
