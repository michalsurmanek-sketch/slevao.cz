name: Párování centrálního katalogu

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximální počet nabídek v jedné dávce (1–80)
        required: false
        default: '80'
      max_batches:
        description: Maximální počet dávek v jednom běhu (1–8)
        required: false
        default: '8'
  schedule:
    - cron: '27 */3 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/invoke_supabase_edge.sh'
      - '.github/workflows/match-product-catalog.yml'

concurrency:
  group: match-product-catalog-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validace Edge retry helperu
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Ověřit Bash syntaxi
        run: bash -n scripts/invoke_supabase_edge.sh

  match-catalog:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ověřit konfiguraci
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo 'Chybí GitHub secret SUPABASE_URL' && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo 'Chybí GitHub secret SUPABASE_SERVICE_ROLE_KEY' && exit 1)
          bash -n scripts/invoke_supabase_edge.sh

      - name: Sjednotit nabídky s katalogem
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CATALOG_LIMIT: ${{ github.event.inputs.limit || '80' }}
          MAX_BATCHES: ${{ github.event.inputs.max_batches || '8' }}
        run: |
          set -euo pipefail

          if ! [[ "$CATALOG_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "Neplatný limit: $CATALOG_LIMIT"
            exit 1
          fi
          if (( CATALOG_LIMIT < 1 )); then
            CATALOG_LIMIT=1
          elif (( CATALOG_LIMIT > 80 )); then
            echo "Limit $CATALOG_LIMIT je vyšší než maximum Edge Function; používám 80."
            CATALOG_LIMIT=80
          fi

          if ! [[ "$MAX_BATCHES" =~ ^[0-9]+$ ]]; then
            echo "Neplatný počet dávek: $MAX_BATCHES"
            exit 1
          fi
          if (( MAX_BATCHES < 1 )); then
            MAX_BATCHES=1
          elif (( MAX_BATCHES > 8 )); then
            echo "Počet dávek $MAX_BATCHES je vyšší než bezpečné maximum; používám 8."
            MAX_BATCHES=8
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          total_checked=0
          total_matched=0
          total_retained=0
          total_needs_review=0
          total_failed=0

          for (( batch=1; batch<=MAX_BATCHES; batch++ )); do
            echo "=== Dávka $batch/$MAX_BATCHES (limit $CATALOG_LIMIT) ==="

            scripts/invoke_supabase_edge.sh \
              match-product-catalog \
              "{\"limit\":$CATALOG_LIMIT}" \
              > "$response_file"

            cat "$response_file"
            echo

            if ! jq -e '.ok == true' "$response_file" >/dev/null; then
              echo 'Edge Function nevrátila validní JSON s ok=true'
              exit 1
            fi

            requested=$(jq -r '.requested // 0' "$response_file")
            checked=$(jq -r '.checked // 0' "$response_file")
            matched=$(jq -r '.matched // 0' "$response_file")
            retained=$(jq -r '.retained // 0' "$response_file")
            needs_review=$(jq -r '.needs_review // 0' "$response_file")
            failed=$(jq -r '.failed // 0' "$response_file")

            total_checked=$((total_checked + checked))
            total_matched=$((total_matched + matched))
            total_retained=$((total_retained + retained))
            total_needs_review=$((total_needs_review + needs_review))
            total_failed=$((total_failed + failed))

            if (( checked == 0 )); then
              echo 'Žádné další nezpracované nabídky.'
              break
            fi

            if (( requested < CATALOG_LIMIT )); then
              echo 'Fronta nezpracovaných nabídek je pro tento běh vyčerpaná.'
              break
            fi
          done

          echo '=== Souhrn běhu ==='
          echo "Zkontrolováno: $total_checked"
          echo "Spárováno: $total_matched"
          echo "Ponecháno: $total_retained"
          echo "K revizi: $total_needs_review"
          echo "Chyby: $total_failed"

          if (( total_failed > 0 )); then
            echo 'Běh dokončen, ale některé nabídky skončily chybou.'
            exit 1
          fi
