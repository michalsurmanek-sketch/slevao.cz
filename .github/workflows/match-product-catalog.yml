name: Párování centrálního katalogu

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximální počet nabídek
        required: false
        default: '500'
  schedule:
    - cron: '27 */3 * * *'

concurrency:
  group: match-product-catalog
  cancel-in-progress: false

jobs:
  match-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ověřit konfiguraci
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo 'Chybí GitHub secret SUPABASE_URL' && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo 'Chybí GitHub secret SUPABASE_SERVICE_ROLE_KEY' && exit 1)

      - name: Sjednotit nabídky s katalogem
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CATALOG_LIMIT: ${{ github.event.inputs.limit || '500' }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/match-product-catalog" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"limit\":$CATALOG_LIMIT}")
          echo "$response"
          echo "$response" | grep -q '"ok":true'
