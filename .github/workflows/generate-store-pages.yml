name: Kontrola store stránek

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-store-pages.mjs'
      - 'tests/store-page-generator-guard.mjs'
      - '.github/workflows/generate-store-pages.yml'

permissions:
  contents: read

concurrency:
  group: store-pages-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Připravit Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Ověřit generátor store stránek
        run: node scripts/generate-store-pages.mjs
      - name: Ověřit store stránky a generátor
        run: node tests/store-page-generator-guard.mjs
      - name: Ověřit, že generátor nevyžaduje commit
        run: |
          if git diff --quiet -- '*.html' sitemap.xml; then
            echo "Store stránky jsou aktuální."
            exit 0
          fi
          echo "Store stránky nejsou synchronizované. Spusť generátor lokálně a změny odešli přes běžný pull request."
          git diff --check -- '*.html' sitemap.xml
          git diff --exit-code -- '*.html' sitemap.xml
