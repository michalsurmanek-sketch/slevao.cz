name: PWA runtime sync

on:
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'letaky.html'
      - 'seznam.html'
      - 'produkt.html'
      - 'ucet.html'
      - 'service-worker.js'
      - 'assets/**'
      - 'tests/pwa-homepage-runtime-sync.mjs'
      - '.github/workflows/pwa-runtime-sync.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'letaky.html'
      - 'seznam.html'
      - 'produkt.html'
      - 'ucet.html'
      - 'service-worker.js'
      - 'assets/**'
      - 'tests/pwa-homepage-runtime-sync.mjs'
      - '.github/workflows/pwa-runtime-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ověřit shodu veřejných stránek a PWA runtime
        run: node tests/pwa-homepage-runtime-sync.mjs
