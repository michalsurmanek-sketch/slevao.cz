name: PWA runtime sync

on:
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'assets/home-footer-redesign.js'
      - 'assets/home-autopilot.js'
      - 'assets/home-autopilot.css'
      - 'assets/mobile-leaflet-nav-position.js'
      - 'tests/pwa-homepage-runtime-sync.mjs'
      - '.github/workflows/pwa-runtime-sync.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'assets/home-footer-redesign.js'
      - 'assets/home-autopilot.js'
      - 'assets/home-autopilot.css'
      - 'assets/mobile-leaflet-nav-position.js'
      - 'tests/pwa-homepage-runtime-sync.mjs'
      - '.github/workflows/pwa-runtime-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ověřit shodu homepage a PWA runtime
        run: node tests/pwa-homepage-runtime-sync.mjs
