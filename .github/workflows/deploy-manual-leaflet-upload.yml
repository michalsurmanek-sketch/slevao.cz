name: Nasazení ručního nahrávání letáků

on:
  push:
    branches:
      - main
    paths:
      - 'admin-nahrat-letaky.html'
      - 'assets/admin-manual-leaflets.css'
      - 'assets/admin-manual-leaflets.js'
      - 'assets/admin-pdf-pages.js'
      - 'supabase/functions/manual-leaflet-upload-v2/**'
      - 'supabase/functions/process-manual-leaflet-v2/**'
      - 'supabase/functions/run-manual-leaflet-import/**'
      - 'supabase/functions/generate-leaflet-product-crops/**'
      - 'supabase/migrations/*leaflet_product_crops*.sql'
      - '.github/workflows/deploy-manual-leaflet-upload.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'admin-nahrat-letaky.html'
      - 'assets/admin-manual-leaflets.css'
      - 'assets/admin-manual-leaflets.js'
      - 'assets/admin-pdf-pages.js'
      - 'supabase/functions/manual-leaflet-upload-v2/**'
      - 'supabase/functions/process-manual-leaflet-v2/**'
      - 'supabase/functions/run-manual-leaflet-import/**'
      - 'supabase/functions/generate-leaflet-product-crops/**'
      - 'supabase/migrations/*leaflet_product_crops*.sql'
      - '.github/workflows/deploy-manual-leaflet-upload.yml'
  workflow_dispatch:

concurrency:
  group: deploy-manual-leaflet-upload-v2-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Ověřit ruční import letáků
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.backend-change.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Zkontrolovat jedinou bezpečnou cestu
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/admin-manual-leaflets.js
          node --check assets/admin-pdf-pages.js
          grep -q "manual-leaflet-upload-v2" assets/admin-manual-leaflets.js
          grep -q "MAX_PDF_SIZE = 50 \* 1024 \* 1024" assets/admin-pdf-pages.js
          grep -q "MAX_PAGES = 160" assets/admin-pdf-pages.js
          grep -q "splitPdf" assets/admin-pdf-pages.js
          grep -q "PDF bylo rozděleno na všech" assets/admin-pdf-pages.js
          grep -q "process-manual-leaflet-v2" supabase/functions/manual-leaflet-upload-v2/index.ts
          grep -q "edge-multipart-storage-v3" supabase/functions/manual-leaflet-upload-v2/index.ts
          grep -q "confirmProcessorStarted" supabase/functions/manual-leaflet-upload-v2/index.ts
          grep -q "searchParams.get('health')" supabase/functions/manual-leaflet-upload-v2/index.ts
          grep -q "await authenticatedUser(request, db)" supabase/functions/manual-leaflet-upload-v2/index.ts
          grep -q "server-bytes-data-url" supabase/functions/process-manual-leaflet-v2/index.ts
          grep -q "leaflet_import_items" supabase/functions/process-manual-leaflet-v2/index.ts
          grep -q "x-cron-secret" supabase/functions/run-manual-leaflet-import/index.ts
          grep -q "leaflet_ai_crop" supabase/functions/generate-leaflet-product-crops/index.ts
          grep -q "crop_box_percent" supabase/functions/generate-leaflet-product-crops/index.ts
          grep -q "product_image_candidates" supabase/functions/generate-leaflet-product-crops/index.ts
          ! grep -q "database-data-url" assets/admin-manual-leaflets.js
          ! grep -q "storage.from" assets/admin-manual-leaflets.js
          ! grep -q "register-manual-leaflet" assets/admin-manual-leaflets.js
          test "$(grep -c 'assets/admin-pdf-pages.js' admin-nahrat-letaky.html)" -eq 1
          test "$(grep -c 'assets/admin-manual-leaflets.js' admin-nahrat-letaky.html)" -eq 1
          grep -q 'PDF do 50 MB' admin-nahrat-letaky.html

      - name: Zjistit, zda se změnil backend ručního importu
        id: backend-change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
          fi

          if git diff --name-only "$base" "$HEAD_SHA" | grep -Eq '^supabase/functions/(manual-leaflet-upload-v2|process-manual-leaflet-v2|run-manual-leaflet-import|generate-leaflet-product-crops)/'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Backend ručního importu se změnil; Edge Functions se nasadí.'
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Backend se nezměnil; produkční Edge Functions zůstávají beze změny.'
          fi

  deploy:
    name: Nasadit a ověřit Edge Functions ručního importu
    needs: validate
    if: needs.validate.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit procesor ručních letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy process-manual-leaflet-v2 \
            --project-ref uhampjdqjxmbhaptgitn

      - name: Nasadit výřezy produktů z letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy generate-leaflet-product-crops \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Nasadit serverový upload
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy manual-leaflet-upload-v2 \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Nasadit serverové opakování importu
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy run-manual-leaflet-import \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Ověřit dostupnost Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for function_name in process-manual-leaflet-v2 generate-leaflet-product-crops manual-leaflet-upload-v2 run-manual-leaflet-import; do
            response="$(curl --fail --silent --show-error \
              --request OPTIONS \
              --retry 8 --retry-delay 3 \
              "https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/${function_name}")"
            test "$response" = 'ok'
          done
