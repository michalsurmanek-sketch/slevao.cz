name: Nasazení ručního nahrávání letáků

on:
  push:
    branches:
      - main
    paths:
      - 'admin-nahrat-letaky.html'
      - 'assets/admin-manual-leaflets.css'
      - 'assets/admin-manual-leaflets.js'
      - 'assets/admin-pdf-pages.js'
      - 'supabase/functions/manual-leaflet-upload-v2/**'
      - 'supabase/functions/process-manual-leaflet-v2/**'
      - 'supabase/functions/run-manual-leaflet-import/**'
      - '.github/workflows/deploy-manual-leaflet-upload.yml'
  workflow_dispatch:

concurrency:
  group: deploy-manual-leaflet-upload-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-and-validate:
    name: Nasadit a ověřit celý ruční import
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zkontrolovat jedinou bezpečnou cestu
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/admin-manual-leaflets.js
          node --check assets/admin-pdf-pages.js
          grep -q "manual-leaflet-upload-v2" assets/admin-manual-leaflets.js
          grep -q "MAX_PDF_SIZE = 50 \* 1024 \* 1024" assets/admin-pdf-pages.js
          grep -q "MAX_PAGES = 160" assets/admin-pdf-pages.js
          grep -q "splitPdf" assets/admin-pdf-pages.js
          grep -q "PDF bylo rozděleno na všech" assets/admin-pdf-pages.js
          grep -q "process-manual-leaflet-v2" supabase/functions/manual-leaflet-upload-v2/index.ts
          grep -q "edge-multipart-storage-v3" supabase/functions/manual-leaflet-upload-v2/index.ts
          grep -q "confirmProcessorStarted" supabase/functions/manual-leaflet-upload-v2/index.ts
          grep -q "searchParams.get('health')" supabase/functions/manual-leaflet-upload-v2/index.ts
          grep -q "server-bytes-data-url" supabase/functions/process-manual-leaflet-v2/index.ts
          grep -q "leaflet_import_items" supabase/functions/process-manual-leaflet-v2/index.ts
          grep -q "x-cron-secret" supabase/functions/run-manual-leaflet-import/index.ts
          ! grep -q "database-data-url" assets/admin-manual-leaflets.js
          ! grep -q "storage.from" assets/admin-manual-leaflets.js
          ! grep -q "register-manual-leaflet" assets/admin-manual-leaflets.js
          test "$(grep -c 'assets/admin-pdf-pages.js' admin-nahrat-letaky.html)" -eq 1
          test "$(grep -c 'assets/admin-manual-leaflets.js' admin-nahrat-letaky.html)" -eq 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit procesor ručních letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy process-manual-leaflet-v2 \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Nasadit serverový upload
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy manual-leaflet-upload-v2 \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Nasadit serverové opakování importu
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy run-manual-leaflet-import \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Ověřit Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for function_name in process-manual-leaflet-v2 manual-leaflet-upload-v2 run-manual-leaflet-import; do
            response="$(curl --fail --silent --show-error \
              --request OPTIONS \
              --retry 8 --retry-delay 3 \
              "https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/${function_name}")"
            test "$response" = 'ok'
          done

      - name: Ověřit Storage a návaznost
        shell: bash
        run: |
          set -euo pipefail
          health_file="$(mktemp)"
          http_status="$(curl --silent --show-error \
            --output "$health_file" \
            --write-out '%{http_code}' \
            --retry 8 --retry-delay 3 \
            'https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/manual-leaflet-upload-v2?health=1')"
          cat "$health_file"
          echo
          test "$http_status" = '200'
          jq -e '.ok == true and .upload == "ready" and .processor == "ready" and .bucket == "leaflets" and .processor_name == "process-manual-leaflet-v2"' "$health_file"

      - name: Ověřit produkční stránku a 50MB PDF
        shell: bash
        run: |
          set -euo pipefail
          page_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 18 --retry-delay 5 \
            "https://slevao.cz/admin-nahrat-letaky.html?deploy=${GITHUB_SHA}" \
            > "$page_file"
          grep -q 'admin-pdf-pages.js?v=20260803-2' "$page_file"
          grep -q 'admin-manual-leaflets.js?v=20260803-10' "$page_file"
          grep -q 'PDF do 50 MB' "$page_file"
