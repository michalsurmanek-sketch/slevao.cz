name: Kontrola ručního nahrávání letáků

on:
  push:
    branches:
      - main
    paths:
      - 'admin-nahrat-letaky.html'
      - 'assets/admin-manual-leaflets.css'
      - 'assets/admin-manual-leaflets.js'
      - 'supabase/functions/manual-leaflet-upload-v2/**'
      - '.github/workflows/deploy-manual-leaflet-upload.yml'
  workflow_dispatch:

concurrency:
  group: check-manual-leaflet-upload
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Syntaxe a kontrola serverové importní cesty
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zkontrolovat JavaScript
        run: node --check assets/admin-manual-leaflets.js

      - name: Ověřit jedinou upload cestu
        shell: bash
        run: |
          set -euo pipefail
          grep -q "manual-leaflet-upload-v2" assets/admin-manual-leaflets.js
          grep -q "multipart/form-data" supabase/functions/manual-leaflet-upload-v2/index.ts
          grep -q "upload_transport: 'edge-multipart-storage'" supabase/functions/manual-leaflet-upload-v2/index.ts
          ! grep -q "database-data-url" assets/admin-manual-leaflets.js
          ! grep -q "storage.from" assets/admin-manual-leaflets.js
          ! grep -q "register-manual-leaflet" assets/admin-manual-leaflets.js
          ! grep -q "admin-manual-leaflets-inline-fallback" admin-nahrat-letaky.html
          ! grep -q "admin-manual-leaflets-client-register" admin-nahrat-letaky.html
          ! grep -q "admin-manual-leaflets-bucket-hotfix" admin-nahrat-letaky.html
          test "$(grep -c 'assets/admin-manual-leaflets.js' admin-nahrat-letaky.html)" -eq 1

      - name: Ověřit produkční stránku
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 \
            https://slevao.cz/admin-nahrat-letaky.html \
            | grep -q 'admin-manual-leaflets.js?v=20260803-7'
