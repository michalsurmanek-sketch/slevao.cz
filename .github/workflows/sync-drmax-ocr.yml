name: Dr. Max OCR

on:
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/sync_drmax_ocr.py'
      - 'scripts/sync_terno_ocr.py'
      - 'tests/drmax-ocr-worker-regression.py'
      - '.github/workflows/sync-drmax-ocr.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/sync_drmax_ocr.py'
      - 'scripts/sync_terno_ocr.py'
      - 'tests/drmax-ocr-worker-regression.py'
      - '.github/workflows/sync-drmax-ocr.yml'

permissions:
  contents: read

concurrency:
  group: drmax-ocr-current-flyer
  cancel-in-progress: false

jobs:
  validate:
    name: Validace Dr. Max OCR workeru
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ověřit Python syntaxi
        run: python3 -m py_compile scripts/sync_drmax_ocr.py scripts/sync_terno_ocr.py tests/drmax-ocr-worker-regression.py

      - name: Ověřit výběr OCR cíle
        run: python3 tests/drmax-ocr-worker-regression.py

  ocr:
    name: OCR aktuálního Dr. Max letáku
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ověřit Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Zjistit, zda je co OCR zpracovat
        id: target
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=4
          last_status=1
          for attempt in $(seq 1 "$max_attempts"); do
            log_file="$(mktemp)"
            echo "Dr. Max OCR probe attempt $attempt/$max_attempts"
            set +e
            python3 scripts/sync_drmax_ocr.py --probe 2>&1 | tee "$log_file" /tmp/drmax-target.json
            status=${PIPESTATUS[0]}
            set -e
            last_status=$status

            if [ "$status" -eq 0 ]; then
              rm -f "$log_file"
              break
            fi

            if ! grep -Eqi 'TimeoutError|timed out|HTTP (408|425|429|5[0-9]{2})' "$log_file"; then
              echo "::error::Dr. Max OCR probe failed with a non-transient error; retry skipped"
              rm -f "$log_file"
              exit "$status"
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 10))
              echo "::warning::Transient Dr. Max OCR probe failure; retrying in ${delay}s"
              rm -f "$log_file"
              sleep "$delay"
            else
              rm -f "$log_file"
            fi
          done

          if [ "$last_status" -ne 0 ]; then
            echo "::error::Dr. Max OCR probe failed after $max_attempts transient attempts"
            exit "$last_status"
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('/tmp/drmax-target.json').read_text(encoding='utf-8').splitlines()[-1])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"has_target={'true' if payload.get('ok') else 'false'}\n")
              output.write(f"reason={payload.get('reason') or 'ready'}\n")
          PY

      - name: Bez práce pro aktuální běh
        if: steps.target.outputs.has_target != 'true'
        run: echo "Dr. Max OCR přeskočen — ${{ steps.target.outputs.reason }}"

      - name: Nainstalovat český Tesseract
        if: steps.target.outputs.has_target == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng
          tesseract --version | head -1
          tesseract --list-langs | grep -E '^(ces|eng)$'

      - name: OCR a uložení souřadnic do Supabase
        if: steps.target.outputs.has_target == 'true'
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=4
          last_status=1
          for attempt in $(seq 1 "$max_attempts"); do
            log_file="$(mktemp)"
            echo "Dr. Max OCR attempt $attempt/$max_attempts"
            set +e
            python3 scripts/sync_drmax_ocr.py 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e
            last_status=$status

            if [ "$status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi

            if ! grep -Eqi 'TimeoutError|timed out|HTTP (408|425|429|5[0-9]{2})' "$log_file"; then
              echo "::error::Dr. Max OCR failed with a non-transient error; retry skipped"
              rm -f "$log_file"
              exit "$status"
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 10))
              echo "::warning::Transient Dr. Max OCR failure; retrying in ${delay}s"
              rm -f "$log_file"
              sleep "$delay"
            else
              rm -f "$log_file"
            fi
          done
          echo "::error::Dr. Max OCR failed after $max_attempts transient attempts"
          exit "$last_status"
