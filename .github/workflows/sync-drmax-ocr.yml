name: Dr. Max OCR

on:
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/sync_drmax_ocr.py'
      - 'scripts/sync_terno_ocr.py'
      - 'tests/drmax-ocr-worker-regression.py'
      - '.github/workflows/sync-drmax-ocr.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/sync_drmax_ocr.py'
      - 'scripts/sync_terno_ocr.py'
      - 'tests/drmax-ocr-worker-regression.py'
      - '.github/workflows/sync-drmax-ocr.yml'

permissions:
  contents: read

concurrency:
  group: drmax-ocr-current-flyer
  cancel-in-progress: false

jobs:
  validate:
    name: Validace Dr. Max OCR workeru
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověřit Python syntaxi
        run: python3 -m py_compile scripts/sync_drmax_ocr.py scripts/sync_terno_ocr.py tests/drmax-ocr-worker-regression.py

      - name: Ověřit výběr OCR cíle
        run: python3 tests/drmax-ocr-worker-regression.py

  ocr:
    name: OCR aktuálního Dr. Max letáku
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověřit Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Zjistit, zda je co OCR zpracovat
        id: target
        shell: bash
        run: |
          python3 scripts/sync_drmax_ocr.py --probe | tee /tmp/drmax-target.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('/tmp/drmax-target.json').read_text(encoding='utf-8').splitlines()[-1])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"has_target={'true' if payload.get('ok') else 'false'}\n")
              output.write(f"reason={payload.get('reason') or 'ready'}\n")
          PY

      - name: Bez práce pro aktuální běh
        if: steps.target.outputs.has_target != 'true'
        run: echo "Dr. Max OCR přeskočen — ${{ steps.target.outputs.reason }}"

      - name: Nainstalovat český Tesseract
        if: steps.target.outputs.has_target == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng
          tesseract --version | head -1
          tesseract --list-langs | grep -E '^(ces|eng)$'

      - name: OCR a uložení souřadnic do Supabase
        if: steps.target.outputs.has_target == 'true'
        run: python3 scripts/sync_drmax_ocr.py
