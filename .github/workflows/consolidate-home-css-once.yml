name: Consolidate homepage CSS once

on:
  push:
    branches: ['perf/home-css-request-consolidation']

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate CSS without changing cascade order
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          deals = root / 'assets/mobile-deals-heading-fix.css'
          category = root / 'assets/mobile-category-scroll-arrow.css'
          row = root / 'assets/mobile-card-view-row.css'
          store = root / 'assets/mobile-store-row-fix.css'
          dividers = root / 'assets/mobile-section-dividers.css'
          index = root / 'index.html'
          workflow = root / '.github/workflows/consolidate-home-css-once.yml'

          deals_text = deals.read_text()
          category_text = category.read_text()
          row_text = row.read_text()
          store_text = store.read_text()
          index_text = index.read_text()

          expected_import = "@import url('./mobile-category-scroll-arrow.css?v=20260816-3');\n\n"
          if not deals_text.startswith(expected_import):
              raise SystemExit('unexpected mobile deals import')
          if '@import url("mobile-section-dividers.css?v=20260811-5");' in store_text:
              raise SystemExit('mobile section dividers were not inlined before consolidation')
          if '/* Slevao.cz – subtilní oddělovače sekcí. */' not in store_text:
              raise SystemExit('inlined section divider marker missing')

          card_link = '  <link rel="stylesheet" href="assets/mobile-card-view-row.css?v=20260816-2">\n'
          if index_text.count(card_link) != 1:
              raise SystemExit('unexpected mobile-card-view-row link count')

          checks = {
              'mobile-category-scroll-arrow.css': {'assets/mobile-deals-heading-fix.css'},
              'mobile-card-view-row.css': {'index.html'},
              'mobile-section-dividers.css': set(),
          }
          for needle, allowed in checks.items():
              hits = set()
              for path in root.rglob('*'):
                  if not path.is_file() or '.git' in path.parts:
                      continue
                  try:
                      text = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  if needle in text:
                      rel = path.as_posix()
                      if rel != workflow.as_posix():
                          hits.add(rel)
              if hits != allowed:
                  raise SystemExit(f'unexpected consumers for {needle}: {sorted(hits)}')

          deals.write_text(category_text.rstrip() + '\n\n' + deals_text[len(expected_import):].rstrip() + '\n\n' + row_text.rstrip() + '\n')
          index.write_text(index_text.replace(card_link, '', 1))
          category.unlink()
          row.unlink()
          dividers.unlink()
          workflow.unlink()
          PY
      - name: Verify consolidation
        run: |
          test ! -e assets/mobile-category-scroll-arrow.css
          test ! -e assets/mobile-card-view-row.css
          test ! -e assets/mobile-section-dividers.css
          ! grep -q 'mobile-category-scroll-arrow.css' assets/mobile-deals-heading-fix.css
          ! grep -q 'mobile-section-dividers.css' assets/mobile-store-row-fix.css
          ! grep -q 'mobile-card-view-row.css' index.html
          grep -q 'slCategoryArrowNudge' assets/mobile-deals-heading-fix.css
          grep -q 'Mobile offer view: result count left' assets/mobile-deals-heading-fix.css
          grep -q 'subtilní oddělovače sekcí' assets/mobile-store-row-fix.css
      - name: Commit exact scope
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets/mobile-deals-heading-fix.css assets/mobile-store-row-fix.css assets/mobile-category-scroll-arrow.css assets/mobile-card-view-row.css assets/mobile-section-dividers.css .github/workflows/consolidate-home-css-once.yml
          git diff --cached --check
          git commit -m 'Consolidate homepage mobile CSS requests'
          git push origin HEAD:perf/home-css-request-consolidation
