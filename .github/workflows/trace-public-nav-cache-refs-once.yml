name: Trace public nav cache refs once

on:
  push:
    branches:
      - perf/store-arrival-css-inline-20260901

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/store-arrival-css-inline-20260901
          fetch-depth: 0
      - name: Trace stale public-nav and store-bottom-nav versions
        shell: bash
        run: |
          echo '--- public-nav-upgrade 20260830-1 refs ---'
          grep -RIn --exclude-dir=.git --exclude='trace-public-nav-cache-refs-once.yml' 'public-nav-upgrade\.js?v=20260830-1\|navVersion = .20260830-1.' . || true
          echo '--- store-bottom-nav 20260828-1 refs ---'
          grep -RIn --exclude-dir=.git --exclude='trace-public-nav-cache-refs-once.yml' 'store-bottom-nav\.js?v=20260828-1' . || true
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/trace-public-nav-cache-refs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove public nav cache trace workflow"
          git push origin HEAD:perf/store-arrival-css-inline-20260901
