name: Patch published leaflet feed fallback

on:
  push:
    branches: ['security/published-leaflet-feed-fallback']
    paths:
      - '.github/workflows/patch-published-leaflet-feed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/published-leaflet-feed-fallback
      - name: Replace only the two legacy public-status predicates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/store-leaflet-feed/index.ts')
          s = p.read_text()
          old = "li.status in ('published','review','publishing')"
          new = "li.status = 'published'"
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 legacy status predicates, found {count}')
          s = s.replace(old, new)
          if old in s:
              raise SystemExit('Legacy status predicate remained after replacement')
          p.write_text(s)
          PY
          git diff --check
          git diff --exit-code -- supabase/functions/store-leaflet-feed/index.ts && exit 1 || true
      - name: Commit guarded patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/store-leaflet-feed/index.ts
          git commit -m 'Restrict fallback leaflet feed to published imports'
          git push origin HEAD:security/published-leaflet-feed-fallback
