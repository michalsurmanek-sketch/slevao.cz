name: Jednorázová oprava názvů obchodů

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/one-time-store-heading-cache.yml'

permissions:
  contents: write

jobs:
  update-store-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Odstranit text za názvem obchodu a obnovit CSS cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          heading_pattern = re.compile(r'(<h1[^>]*>\s*<span id="titleName">.*?</span>)[^<]*(</h1>)')
          css_pattern = re.compile(r'assets/store-feed\.css\?v=[^"\']+')

          for path in Path('.').glob('*.html'):
              original = path.read_text(encoding='utf-8')
              updated = heading_pattern.sub(r'\1\2', original)
              if 'assets/store-feed.css' in updated:
                  updated = css_pattern.sub('assets/store-feed.css?v=20260801-16', updated)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)

          print(f'Upraveno {len(changed)} souborů:')
          print('\n'.join(changed))
          PY
      - name: Uložit hromadnou opravu
        run: |
          if git diff --quiet; then
            echo "Žádné změny"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Show only store names and refresh store styles"
          git push origin HEAD:main
