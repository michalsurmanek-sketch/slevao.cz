name: Zapsat podporu ručních letáků

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/patch_process_leaflet_manual_uploads.py'
      - '.github/workflows/commit-manual-leaflet-support.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-manual-leaflet-support
  cancel-in-progress: false

jobs:
  patch-and-commit:
    name: Upravit zdroj process-leaflet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplikovat podporu ručních importů
        run: |
          python .github/scripts/patch_process_leaflet_manual_uploads.py
          grep -q "job.metadata?.auto_publish" supabase/functions/process-leaflet/index.ts

      - name: Commitnout změnu zdrojového kódu
        shell: bash
        run: |
          if git diff --quiet -- supabase/functions/process-leaflet/index.ts; then
            echo 'Zdrojový kód už obsahuje podporu ručních letáků.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/process-leaflet/index.ts
          git commit -m 'Zapnout automatickou publikaci ručních letáků'
          git push origin HEAD:main
