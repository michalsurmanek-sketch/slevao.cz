name: Patch leaflet feed quality guard

on:
  push:
    branches: ['security/published-leaflet-feed-fallback']
    paths:
      - '.github/workflows/patch-leaflet-feed-quality.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/published-leaflet-feed-fallback
      - name: Verify feed patch and append quality test
        run: |
          python - <<'PY'
          from pathlib import Path

          feed = Path('supabase/functions/store-leaflet-feed/index.ts')
          source = feed.read_text()
          old = "li.status in ('published','review','publishing')"
          count = source.count(old)
          if count == 2:
              source = source.replace(old, "li.status = 'published'")
              feed.write_text(source)
          elif count != 0:
              raise SystemExit(f'Expected 0 or 2 legacy feed predicates, found {count}')
          if source.count("li.status = 'published'") < 2:
              raise SystemExit('Published-only fallback predicates are missing')

          q = Path('.github/workflows/quality.yml')
          text = q.read_text()
          cmd = 'node tests/store-leaflet-feed-published-only.mjs'
          if cmd not in text:
              anchor = 'node tests/store-leaflet-document-published-only.mjs'
              if anchor not in text:
                  raise SystemExit('Quality workflow anchor not found')
              text = text.replace(anchor, anchor + ' && ' + cmd, 1)
              q.write_text(text)
          PY
          git diff --check
          git status --short
      - name: Commit guarded patch if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/store-leaflet-feed/index.ts .github/workflows/quality.yml
          git commit -m 'Enforce published-only leaflet feed fallback'
          git push origin HEAD:security/published-leaflet-feed-fallback
