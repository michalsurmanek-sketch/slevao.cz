name: Repair leaflet processing pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-leaflet-pipeline.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch processing lifecycle
        shell: python
        run: |
          from pathlib import Path

          processor = Path('supabase/functions/process-leaflet/index.ts')
          text = processor.read_text(encoding='utf-8')
          old = """  runInBackground(processImport(importId));
  return Response.json({ ok: true, accepted: true, import_id: importId }, { status: 202, headers: CORS_HEADERS });"""
          new = """  await processImport(importId);
  const { data: completedJob } = await db
    .from('leaflet_imports')
    .select('status,product_count,error_message')
    .eq('id', importId)
    .maybeSingle();
  const succeeded = Boolean(completedJob && !['failed', 'queued', 'downloading', 'processing'].includes(String(completedJob.status || '')));
  return Response.json({
    ok: succeeded,
    accepted: true,
    import_id: importId,
    status: completedJob?.status || null,
    products: completedJob?.product_count || 0,
    error: completedJob?.error_message || null,
  }, { status: succeeded ? 200 : 500, headers: CORS_HEADERS });"""
          if old not in text:
              raise SystemExit('Expected process-leaflet background block was not found')
          processor.write_text(text.replace(old, new, 1), encoding='utf-8')

          discover = Path('supabase/functions/discover-leaflets/index.ts')
          text = discover.read_text(encoding='utf-8')
          text2 = text.replace("Date.now() - 8 * 60_000", "Date.now() - 25 * 60_000")
          text2 = text2.replace("ageMs >= 8 * 60_000", "ageMs >= 25 * 60_000")
          if text2 == text:
              raise SystemExit('Expected discover-leaflets timeout values were not found')
          discover.write_text(text2, encoding='utf-8')

          runner = Path('supabase/functions/run-leaflet-import/index.ts')
          text = runner.read_text(encoding='utf-8')
          text2 = text.replace('await sleep(9000);', 'await sleep(30000);')
          if text2 == text:
              raise SystemExit('Expected run-leaflet-import wait value was not found')
          runner.write_text(text2, encoding='utf-8')

          Path('.github/workflows/repair-leaflet-pipeline.yml').unlink()

      - name: Commit repaired pipeline
        run: |
          git config user.name "slevao-automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/process-leaflet/index.ts supabase/functions/discover-leaflets/index.ts supabase/functions/run-leaflet-import/index.ts .github/workflows/repair-leaflet-pipeline.yml
          git commit -m "fix: complete leaflet processing before returning"
          git push origin main
