name: Patch static homepage quality checks

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update homepage quality checks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/quality.mjs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "  'assets/search-suggest.js',\n];",
              "  'assets/search-suggest.js', 'assets/home-v2.css', 'assets/home-v2.js',\n];"
          )
          text = text.replace(
              "  'deploy-edge-functions.yml',\n  'deploy-publish-imports.yml',",
              "  'deploy-edge-functions.yml',\n  'deploy-official-leaflet-resolver.yml',\n  'deploy-publish-imports.yml',"
          )
          text = text.replace(
              "const index = read('index.html');",
              "const index = read('index.html');\nconst homeJs = read('assets/home-v2.js');\nconst homeCss = read('assets/home-v2.css');"
          )

          replacements = {
              "assert.match(index, /fetchActiveOffers/, 'Katalog musí podporovat stránkované načítání z databáze.');":
                  "assert.match(homeJs, /async function fetchOffers\\(/, 'Katalog musí podporovat stránkované načítání z databáze.');",
              "assert.match(index, /deduplicateOffers/, 'Katalog musí mít ochranu proti duplicitám.');":
                  "assert.match(homeJs, /function deduplicate\\(/, 'Katalog musí mít ochranu proti duplicitám.');",
              "assert.match(index, /AbortController/, 'Databázové načítání musí mít přerušitelný časový limit.');":
                  "assert.match(homeJs, /AbortController/, 'Databázové načítání musí mít přerušitelný časový limit.');",
              "assert.match(index, /retryRequest/, 'Databázové načítání se musí po přechodné chybě zopakovat.');":
                  "assert.match(homeJs, /catch \\(error\\).*return collect\\(simpleSelect\\)/s, 'Databázové načítání musí mít bezpečný náhradní dotaz.');",
              "assert.match(index, /id=\"retryLoad\"/, 'Chyba načítání musí nabídnout ruční opakování.');":
                  "assert.match(homeJs, /location\\.reload\\(\\)/, 'Chyba načítání musí nabídnout ruční opakování.');",
              "assert.match(index, /DATA_CACHE_KEY/, 'Homepage musí umět zobrazit poslední funkční data při výpadku.');":
                  "assert.match(homeJs, /CACHE_KEY/, 'Homepage musí umět zobrazit poslední funkční data při výpadku.');",
              "assert.doesNotMatch(index, /filter\\(s=>activeSlugs\\.has/, 'Homepage nesmí skrývat aktivní obchody bez aktuální nabídky.');":
                  "assert.doesNotMatch(homeJs, /filter\\(s=>activeSlugs\\.has/, 'Homepage nesmí používat zastaralou filtraci obchodů.');",
              "assert.match(index, /href=\"\\$\\{encodeURIComponent\\(s\\.slug\\)\\}\\.html\"/, 'Karta obchodu musí vést na jeho vlastní feedovou stránku.');":
                  "assert.match(homeJs, /encodeURIComponent\\(store\\.slug\\).*\\.html/, 'Karta obchodu musí vést na jeho vlastní feedovou stránku.');",
              "assert.match(index, /penny:'assets\\/logos\\/penny\\.svg\\?v=4'/, 'Homepage musí používat stejné lokální logo PENNY.');":
                  "assert.match(homeJs, /penny:'assets\\/logos\\/penny\\.svg\\?v=4'/, 'Homepage musí používat stejné lokální logo PENNY.');",
              "assert.doesNotMatch(index, /s\\.slug==='penny'[^\\n]*clearbit/, 'PENNY se nesmí vrátit k externímu náhradnímu logu.');":
                  "assert.doesNotMatch(homeJs, /s\\.slug==='penny'[^\\n]*clearbit/, 'PENNY se nesmí vrátit k externímu náhradnímu logu.');",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing quality assertion to replace: {old}')
              text = text.replace(old, new)

          start = text.index("const inlineScripts = [...index.matchAll")
          end_marker = "assert.match(index, /search-suggest\\.js\\?v=20260801-freeze-fix/, 'Opravený skript musí obejít starou cache prohlížeče.');"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = """new Script(homeJs, { filename: 'assets/home-v2.js' });
new Script(read('assets/search-suggest.js'), { filename: 'assets/search-suggest.js' });
assert.match(index, /assets\\/home-v2\\.css\\?v=20260802-2/, 'Homepage musí načítat statické styly v2.');
assert.match(index, /assets\\/home-v2\\.js\\?v=20260802-2/, 'Homepage musí načítat statický JavaScript v2.');
assert.match(index, /id=\"categoriesSection\"/, 'Homepage musí obsahovat kategorie.');
assert.match(index, /id=\"leafletsSection\"/, 'Homepage musí obsahovat letáky a nabídky obchodů.');
assert.match(index, /Končí dnes/, 'Homepage musí obsahovat rychlý filtr končících akcí.');
assert.match(homeJs, /function openCompare\\(/, 'Homepage musí umět porovnat produkt mezi obchody.');
assert.match(homeJs, /function geographyMatches\\(/, 'Homepage musí podporovat lokalitu.');
assert.match(homeCss, /\\.mobileNav/, 'Homepage musí mít mobilní spodní navigaci.');
assert.doesNotMatch(index + homeJs + read('assets/search-suggest.js'), /DecompressionStream|\\.home-v2-parts/, 'Homepage nesmí používat dynamický komprimovaný zavaděč.');
assert.doesNotMatch(read('assets/search-suggest.js'), /MutationObserver|setInterval/, 'Loga nesmí vytvářet nekonečnou smyčku změn DOM.');"""
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow before validation
        run: rm .github/workflows/patch-static-homepage-quality.yml

      - name: Verify static homepage and tests
        run: |
          node --check assets/home-v2.js
          node --check assets/search-suggest.js
          node tests/quality.mjs

      - name: Commit quality migration and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/quality.mjs .github/workflows/patch-static-homepage-quality.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update quality checks for static homepage v2"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
