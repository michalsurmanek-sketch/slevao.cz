name: Patch Tesco replace old offers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tesco-replace-old-offers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Tesco replacement patch
        run: python .github/scripts/patch_tesco_replace_old_offers.py

      - name: Commit Tesco replacement rule
        run: |
          git config user.name "slevao-automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/publish-imports/index.ts
          git commit -m "fix(tesco): replace old offers when publishing new leaflet"
          git push origin main
