name: Audit produce all filter v125

on:
  push:
    branches: [audit/produce-all-v125]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/produce-all-v125
      - name: Apply minimal produce filter fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/home-semantic-filters.js')
          s = p.read_text()
          old1 = "forms:[['ovoce','Čerstvé','♧'],['mrazene ovoce','Mražené','❄'],['susene ovoce','Sušené','◒']]"
          new1 = "forms:[['cerstve ovoce','Čerstvé','♧'],['mrazene ovoce','Mražené','❄'],['susene ovoce','Sušené','◒']]"
          old2 = "forms:[['zelenina','Čerstvá','♧'],['mrazena zelenina','Mražená','❄'],['sterilovana zelenina','Sterilovaná','◒'],['zeleninove vyrobky','Výrobky','▱']]"
          new2 = "forms:[['cerstva zelenina','Čerstvá','♧'],['mrazena zelenina','Mražená','❄'],['sterilovana zelenina','Sterilovaná','◒'],['zeleninove vyrobky','Výrobky','▱']]"
          assert s.count(old1) == 1, f'fruit anchor count={s.count(old1)}'
          assert s.count(old2) == 1, f'veg anchor count={s.count(old2)}'
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          import re
          s2, n = re.subn(r'assets/home-semantic-filters\.js\?v=[^"\']+', 'assets/home-semantic-filters.js?v=20260905-2', s)
          assert n == 1, f'cache key replacements={n}'
          p.write_text(s2)
          PY
          git diff --check
          git diff -- assets/home-semantic-filters.js index.html
      - name: Commit audited change and remove helper workflow
        shell: bash
        run: |
          git config user.name "michalsurmanek-sketch"
          git config user.email "230581147+michalsurmanek-sketch@users.noreply.github.com"
          rm .github/workflows/audit-produce-all-v125.yml
          git add assets/home-semantic-filters.js index.html .github/workflows/audit-produce-all-v125.yml
          git diff --cached --check
          git commit -m "fix: make produce Vše distinct from Čerstvé"
          git push origin HEAD:audit/produce-all-v125
