name: Audit footer fallback cache sync

on:
  push:
    branches:
      - audit/quick-filter-cache-20260905
    paths:
      - '.github/workflows/audit-footer-fallback-cache-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/quick-filter-cache-20260905
      - name: Align fallback loaders and regression tests
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/public-features\.js?v=20260828-2/public-features.js?v=20260901-1/g' assets/home-footer-redesign.js
          sed -i 's/home-quick-food-filter\.js?v=20260829-4/home-quick-food-filter.js?v=20260905-1/g' assets/home-footer-redesign.js
          sed -i "s/const publicFeaturesVersion = '20260828-2';/const publicFeaturesVersion = '20260901-1';/" tests/public-nav-location-loader-sync.mjs
          sed -i 's/home-footer-redesign\.js?v=20260901-3/home-footer-redesign.js?v=20260905-1/g' index.html
          cat > tests/homepage-quick-filter-cache-version.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html','utf8');
          const footer = fs.readFileSync('assets/home-footer-redesign.js','utf8');
          const version = '20260905-1';
          const matches = [...html.matchAll(/assets\/home-quick-food-filter\.js\?v=([^"']+)/g)].map((m) => m[1]);
          assert.deepEqual(matches, [version]);
          assert.match(footer, new RegExp(`assets/home-quick-food-filter\\.js\\?v=${version}`));
          assert.doesNotMatch(html, /home-quick-food-filter\.js\?v=20260829-4/);
          assert.doesNotMatch(footer, /home-quick-food-filter\.js\?v=20260829-4/);
          assert.match(html, /assets\/home-footer-redesign\.js\?v=20260905-1/);
          console.log('homepage quick filter cache version: OK');
          EOF
          node tests/public-nav-location-loader-sync.mjs
          node tests/homepage-quick-filter-cache-version.mjs
          git diff --check
      - name: Commit audited changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/home-footer-redesign.js index.html tests/public-nav-location-loader-sync.mjs tests/homepage-quick-filter-cache-version.mjs
          git commit -m 'fix: align homepage fallback asset versions'
          git push origin HEAD:audit/quick-filter-cache-20260905
