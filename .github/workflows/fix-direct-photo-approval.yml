name: Opravit schvaleni nalezene fotografie

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-direct-photo-approval.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upravit admin fotografii
        shell: python
        run: |
          from pathlib import Path

          path = Path('admin-pridat-fotografii.html')
          text = path.read_text(encoding='utf-8')

          old_render = """function renderCandidates(candidates){$('candidateGrid').innerHTML=candidates.map((c,i)=>`<article class=\"candidateCard\"><img src=\"${esc(c.image_url)}\" alt=\"Návrh fotografie ${i+1}\" loading=\"lazy\"><div class=\"candidateInfo\"><strong>Návrh ${i+1} · kvalita ${c.quality_score||0}/100</strong><small>Shoda ${Math.round(Number(c.match_score||0)*100)} % · ${esc(c.source_domain||'zdroj neuveden')}</small>${c.source_url?`<a class=\"sourceLink\" href=\"${esc(c.source_url)}\" target=\"_blank\" rel=\"noopener\">${isDirectImageUrl(c.source_url)?'Otevřít obrázek':'Otevřít produktovou stránku'} ↗</a>`:''}</div></article>`).join('');$('candidateGrid').classList.toggle('hidden',!candidates.length)}"""
          new_render = """function renderCandidates(candidates){$('candidateGrid').innerHTML=candidates.map((c,i)=>`<article class=\"candidateCard\"><img src=\"${esc(c.image_url)}\" alt=\"Návrh fotografie ${i+1}\" loading=\"lazy\"><div class=\"candidateInfo\"><strong>Návrh ${i+1} · kvalita ${c.quality_score||0}/100</strong><small>Shoda ${Math.round(Number(c.match_score||0)*100)} % · ${esc(c.source_domain||'zdroj neuveden')}</small><button class=\"btn primary\" style=\"width:100%;margin-top:10px\" type=\"button\" data-approve-image=\"${esc(c.image_url)}\">Schválit fotografii</button></div></article>`).join('');$('candidateGrid').classList.toggle('hidden',!candidates.length);$('candidateGrid').querySelectorAll('[data-approve-image]').forEach(btn=>btn.onclick=()=>approveCandidate(btn.dataset.approveImage,btn))}"""
          if old_render not in text:
              raise SystemExit('Puvodni renderCandidates nebyl nalezen')
          text = text.replace(old_render, new_render)

          marker = "async function loadProducts(){"
          approve_fn = """async function approveCandidate(imageUrl,button){if(!selectedId||!imageUrl){showAuto('Chybí produkt nebo fotografie.','err');return}if(button)button.disabled=true;const {error}=await db.from('product_image_candidates').update({status:'approved',reviewed_at:new Date().toISOString(),rejection_reason:null}).eq('product_id',selectedId).eq('image_url',imageUrl);if(error){showAuto(error.message,'err');if(button)button.disabled=false;return}showAuto('Fotografie byla schválena a použije se u produktu ve všech nabídkách.');if(button){button.textContent='Schváleno ✓';button.disabled=true}}
"""
          if marker not in text:
              raise SystemExit('Marker loadProducts nebyl nalezen')
          text = text.replace(marker, approve_fn + marker, 1)

          text = text.replace("$('inspect').textContent=isDirectImageUrl(foundUrl)?'Otevřít obrázek':'Načíst fotografii z odkazu'", "$('inspect').textContent=isDirectImageUrl(foundUrl)?'Schválit fotografii':'Načíst fotografii z odkazu'")
          text = text.replace("if(isDirectImageUrl(page_url)){window.open(page_url,'_blank','noopener');show('Otevřel jsem přímý odkaz na nalezený obrázek. Fotografie už je uložená ve frontě ke schválení.');return}", "if(isDirectImageUrl(page_url)){await approveCandidate(page_url,$('inspect'));return}")

          path.write_text(text, encoding='utf-8')
      - name: Commit a push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-pridat-fotografii.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): schvalit nalezenou fotografii jednim kliknutim"
          git push
