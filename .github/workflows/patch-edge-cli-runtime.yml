name: Patch Edge CLI runtime

on:
  push:
    branches:
      - 'ci/edge-cli-v2-pin-20260906'
    paths:
      - '.github/workflows/patch-edge-cli-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/edge-cli-v2-pin-20260906
      - name: Upgrade deploy workflow action runtimes and pin Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-edge-functions.yml')
          text = path.read_text()

          checkout_old = 'uses: actions/checkout@v4'
          checkout_count = text.count(checkout_old)
          if checkout_count != 4:
              raise SystemExit(f'Expected 4 checkout@v4 uses, found {checkout_count}')
          text = text.replace(checkout_old, 'uses: actions/checkout@v7')

          setup_old = """uses: supabase/setup-cli@v1
        with:
          version: latest"""
          setup_new = """uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}"""
          setup_count = text.count(setup_old)
          if setup_count != 4:
              raise SystemExit(f'Expected 4 setup-cli@v1 latest blocks, found {setup_count}')
          text = text.replace(setup_old, setup_new)

          if 'actions/checkout@v4' in text or 'supabase/setup-cli@v1' in text or 'version: latest' in text:
              raise SystemExit('Legacy action/runtime reference remains in deploy workflow')

          path.write_text(text)
          PY
          git diff --check
          grep -c 'actions/checkout@v7' .github/workflows/deploy-edge-functions.yml | grep -qx '4'
          grep -c 'supabase/setup-cli@v2' .github/workflows/deploy-edge-functions.yml | grep -qx '4'
          grep -c 'version: 2.116.0' .github/workflows/deploy-edge-functions.yml | grep -qx '4'
          grep -c 'github-token: \${{ github.token }}' .github/workflows/deploy-edge-functions.yml | grep -qx '4'
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-edge-cli-runtime.yml
          git add -A
          git commit -m 'ci: pin Edge deploy to Supabase CLI v2 runtime'
          git push origin HEAD:ci/edge-cli-v2-pin-20260906
