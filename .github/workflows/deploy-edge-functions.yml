name: Nasazení Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit vyhledávač oficiálních letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-official-leaflet-sources \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Nasadit ostatní Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy \
            --project-ref uhampjdqjxmbhaptgitn

      - name: Ověřit feed titulních stran homepage
        env:
          PUBLIC_KEY: sb_publishable_2I9ronLpYyn2kdnLRcdIUA_geOMF4XU
        run: |
          endpoint='https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/homepage-leaflet-feed?limit=12'
          body=''
          for attempt in $(seq 1 12); do
            if body=$(curl --fail --silent --show-error \
              --header "apikey: $PUBLIC_KEY" \
              "$endpoint"); then
              break
            fi
            echo "Feed ještě není dostupný, pokus $attempt/12"
            sleep 5
          done
          test -n "$body" || { echo 'Homepage feed nevrátil odpověď.'; exit 1; }
          printf '%s' "$body" > /tmp/homepage-leaflet-feed.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/homepage-leaflet-feed.json', 'utf8'));
          if (!payload.ok) throw new Error(payload.error || 'Homepage feed vrátil ok=false.');
          if (!Array.isArray(payload.leaflets)) throw new Error('Homepage feed nevrátil pole leaflets.');
          if (payload.leaflets.length < 2) throw new Error(`Homepage feed vrátil pouze ${payload.leaflets.length} leták.`);
          for (const leaflet of payload.leaflets) {
            if (!leaflet.store_slug || !leaflet.store_name || !leaflet.preview_url) {
              throw new Error('Některý leták nemá obchod nebo preview_url.');
            }
          }
          console.log(`Homepage feed ověřen: ${payload.leaflets.length} aktuálních letáků.`);
          NODE
