name: Nasazení Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/scripts/patch_process_leaflet_large_files.py'
      - '.github/scripts/patch_discover_kaufland_automatic_pdf.py'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-homepage-leaflet-image:
    name: Nasadit obrázky letáků
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit správu obrázků letáků na homepage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy homepage-leaflet-image \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

  deploy-homepage-leaflet-visibility:
    name: Nasadit viditelnost letáků
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit viditelnost letáků na homepage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy homepage-leaflet-visibility \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

  deploy-other-functions:
    name: Nasadit ostatní funkce
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplikovat opravu velkých letáků
        run: |
          python .github/scripts/patch_process_leaflet_large_files.py
          python .github/scripts/patch_discover_kaufland_automatic_pdf.py
          grep -q "storageUploadWarning" supabase/functions/process-leaflet/index.ts
          grep -q "useRemoteUrl" supabase/functions/process-leaflet/index.ts
          grep -q "process-automatic-pdf-v2" supabase/functions/discover-leaflets/index.ts
          grep -q "queueProcessor(data.id, storeSlug)" supabase/functions/discover-leaflets/index.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit bezpečné mazání obchodů
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy delete-store \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Nasadit prohlížeč dokumentů letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy store-leaflet-document \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Nasadit vyhledávač oficiálních letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-official-leaflet-sources \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Nasadit ostatní Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy \
            --project-ref uhampjdqjxmbhaptgitn

      - name: Vyčistit starou chybu velikosti a znovu spustit Kaufland
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: uhampjdqjxmbhaptgitn
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/retry_kaufland.sql <<'SQL'
          update public.leaflet_imports
          set source_hash = source_hash || ':automatic-pdf-v2:' || id::text,
              updated_at = now()
          where source_id in (
            select ls.id
            from public.leaflet_sources ls
            join public.stores s on s.id = ls.store_id
            where s.slug = 'kaufland'
          )
            and status = 'failed'
            and error_message ilike '%maximum allowed size%';

          update public.leaflet_sources ls
          set last_checked_at = null,
              last_error = null
          from public.stores s
          where s.id = ls.store_id
            and s.slug = 'kaufland';

          select public.trigger_leaflet_discovery() as request_id;
          SQL

          payload="$(jq -Rs '{query: ., read_only: false}' /tmp/retry_kaufland.sql)"
          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload")"
          cat "$response_file"
          echo
          if [[ "$http_status" != '200' && "$http_status" != '201' ]]; then
            echo "Opakované spuštění Kauflandu selhalo s HTTP $http_status"
            exit 1
          fi