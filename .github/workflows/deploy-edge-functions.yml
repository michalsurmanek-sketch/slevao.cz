# Edge maintenance trigger 2026-08-08
name: Nasazení Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/scripts/patch_process_leaflet_large_files.py'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edge-maintenance:
    name: Uklidit debug funkce a uvolnit kapacitu
    if: ${{ contains(github.event.head_commit.message, '[edge-maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Odstranit nepoužívané diagnostické Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_REF='uhampjdqjxmbhaptgitn'
          debug_functions=(
            debug-albert-catalog-parser
            debug-albert-collection-stores
            debug-albert-dynamic-page
            debug-albert-graphql
            debug-albert-publitas
            debug-albert-site
            debug-albert-source
            debug-albert-store
            debug-albert-text-parser
            debug-bauhaus-source
            debug-benu-source
            debug-datart-source
            debug-dm-source
            debug-drmax-source
            debug-intersport-source
            debug-jip-source
            debug-jysk-source
            debug-kik-source
            debug-makro-source
            debug-moebelix-source
            debug-obi-source
            debug-pepco-source
            debug-retail-candidates
            debug-rossmann-source
            debug-tedi-source
            debug-terno-source
            debug-teta-source
            debug-xxxlutz-source
            debug-zabka-source
          )
          for function_name in "${debug_functions[@]}"; do
            echo "Odstraňuji ${function_name}, pokud existuje..."
            printf 'y\n' | supabase functions delete "$function_name" --project-ref "$PROJECT_REF" || true
          done
          echo 'debug-kaufland-source zůstává zachován, protože na něj existuje DB reference.'

      - name: Nasadit strukturovaný retail parser
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-structured-retail-products \
            --project-ref uhampjdqjxmbhaptgitn \
            --use-api

      - name: Nasadit úplný BENU parser
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-benu-source \
            --project-ref uhampjdqjxmbhaptgitn \
            --use-api

      - name: Ověřit výslednou kapacitu
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list --project-ref uhampjdqjxmbhaptgitn

  deploy-homepage-leaflet-image:
    name: Nasadit obrázky letáků
    if: ${{ !contains(github.event.head_commit.message, '[edge-maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit správu obrázků letáků na homepage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy homepage-leaflet-image \
            --project-ref uhampjdqjxmbhaptgitn

  deploy-homepage-leaflet-visibility:
    name: Nasadit viditelnost letáků
    if: ${{ !contains(github.event.head_commit.message, '[edge-maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit viditelnost letáků na homepage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy homepage-leaflet-visibility \
            --project-ref uhampjdqjxmbhaptgitn

  deploy-other-functions:
    name: Nasadit ostatní funkce
    if: ${{ !contains(github.event.head_commit.message, '[edge-maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplikovat opravu velkých letáků
        run: |
          python .github/scripts/patch_process_leaflet_large_files.py
          grep -q "storageUploadWarning" supabase/functions/process-leaflet/index.ts
          grep -q "useRemoteUrl" supabase/functions/process-leaflet/index.ts
          grep -q "MAX_RUN_MS = 85_000" supabase/functions/match-product-catalog/index.ts
          grep -q "catalog_checked_at" supabase/functions/match-product-catalog/index.ts
          grep -q "leaflet_ai_crop" supabase/functions/generate-leaflet-product-crops/index.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit bezpečné mazání obchodů
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy delete-store \
            --project-ref uhampjdqjxmbhaptgitn

      - name: Nasadit prohlížeč dokumentů letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy store-leaflet-document \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Nasadit vyhledávač oficiálních letáků
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-official-leaflet-sources \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Nasadit pouze změněné Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_REF='uhampjdqjxmbhaptgitn'

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'Ruční hromadný deploy je z bezpečnostních důvodů vypnutý. Použij změnu konkrétní funkce nebo její specializovaný workflow.'
            exit 0
          fi

          before="$(git rev-parse "${GITHUB_SHA}^1" 2>/dev/null || true)"
          if [[ -z "$before" ]]; then
            before="$BEFORE_SHA"
          fi
          if [[ -z "$before" || "$before" == '0000000000000000000000000000000000000000' ]]; then
            echo 'Nelze bezpečně určit prvního rodiče ani předchozí commit; deploy se neprovede.'
            exit 1
          fi

          mapfile -t changed_functions < <(
            git diff --name-only "$before" "$GITHUB_SHA" -- 'supabase/functions/**' \
              | awk -F/ 'NF >= 3 { print $3 }' \
              | sort -u
          )

          if [[ ${#changed_functions[@]} -eq 0 ]]; then
            echo 'V tomto commitu není změněná žádná Edge Function.'
            exit 0
          fi

          handled_elsewhere=(
            delete-store
            homepage-leaflet-image
            homepage-leaflet-visibility
            process-leaflet-basic
            store-leaflet-document
            sync-official-leaflet-sources
          )

          is_handled_elsewhere() {
            local candidate="$1"
            local known
            for known in "${handled_elsewhere[@]}"; do
              [[ "$candidate" == "$known" ]] && return 0
            done
            return 1
          }

          for function_name in "${changed_functions[@]}"; do
            if is_handled_elsewhere "$function_name"; then
              echo "Přeskakuji ${function_name}: nasazuje se specializovaným krokem nebo workflow."
              continue
            fi

            function_dir="supabase/functions/${function_name}"
            if [[ ! -d "$function_dir" ]]; then
              echo "Přeskakuji odstraněný adresář ${function_name}."
              continue
            fi

            config_file="${function_dir}/config.toml"
            if [[ ! -f "$config_file" ]]; then
              echo "CHYBA: ${function_name} nemá explicitní config.toml s verify_jwt."
              echo 'Deploy je zastaven, aby se neznámý auth režim nepřepsal výchozí hodnotou.'
              exit 1
            fi
            if ! grep -Eq '^verify_jwt[[:space:]]*=[[:space:]]*(true|false)[[:space:]]*$' "$config_file"; then
              echo "CHYBA: ${config_file} neobsahuje jednoznačné verify_jwt=true/false."
              exit 1
            fi

            auth_mode="$(sed -nE 's/^verify_jwt[[:space:]]*=[[:space:]]*(true|false)[[:space:]]*$/\1/p' "$config_file" | tail -n 1)"
            if [[ "$auth_mode" != 'true' && "$auth_mode" != 'false' ]]; then
              echo "CHYBA: z ${config_file} se nepodařilo načíst verify_jwt."
              exit 1
            fi

            echo "Nasazuji pouze změněnou funkci ${function_name}; verify_jwt=${auth_mode}."
            if [[ "$auth_mode" == 'false' ]]; then
              supabase functions deploy "$function_name" \
                --project-ref "$PROJECT_REF" \
                --no-verify-jwt
            else
              supabase functions deploy "$function_name" \
                --project-ref "$PROJECT_REF"
            fi
          done

      - name: Ověřit klíčové automatizační funkce
        shell: bash
        run: |
          set -euo pipefail
          for function_name in sync-official-leaflet-sources match-product-catalog generate-leaflet-product-crops; do
            response="$(curl --fail --silent --show-error \
              --request OPTIONS \
              --retry 10 --retry-delay 3 \
              "https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/${function_name}")"
            test "$response" = 'ok'
          done
