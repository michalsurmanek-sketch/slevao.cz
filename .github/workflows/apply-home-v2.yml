name: Apply Slevao homepage v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-home-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble homepage files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          def assemble(pattern, destination):
              parts = sorted(Path('.home-v2-parts').glob(pattern))
              if not parts:
                  raise SystemExit(f'Missing parts for {pattern}')
              encoded = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
              Path(destination).parent.mkdir(parents=True, exist_ok=True)
              Path(destination).write_bytes(gzip.decompress(base64.b64decode(encoded)))

          assemble('index.*.b64', 'index.html')
          assemble('css.*.b64', 'assets/home-v2.css')
          assemble('js.*.b64', 'assets/home-v2.js')
          PY

      - name: Verify homepage
        run: |
          node --check assets/home-v2.js
          grep -q 'assets/home-v2.css?v=20260802-1' index.html
          grep -q 'assets/home-v2.js?v=20260802-1' index.html
          grep -q 'Nakupuj podle kategorie' index.html
          grep -q 'Letáky a nabídky obchodů' index.html
          grep -q 'Končí dnes' index.html
          grep -q 'Porovnat' assets/home-v2.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
              def handle_starttag(self, tag, attrs):
                  values=dict(attrs)
                  if values.get('id'):
                      self.ids.append(values['id'])

          parser=IdParser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          duplicates=[key for key,count in Counter(parser.ids).items() if count>1]
          if duplicates:
              raise SystemExit(f'Duplicate HTML ids: {duplicates}')
          PY

      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/home-v2.css assets/home-v2.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild homepage as shopping assistant"
          git push origin main
