name: Patch Tesco session download

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/patch_tesco_session.py
      - .github/workflows/patch-tesco-session-download.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Tesco download
        run: python .github/scripts/patch_tesco_session.py

      - name: Commit Tesco fix
        run: |
          git config user.name "slevao-automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/process-leaflet/index.ts
          git commit -m "fix(tesco): download leaflet through Tesco browser session"
          git push origin main
