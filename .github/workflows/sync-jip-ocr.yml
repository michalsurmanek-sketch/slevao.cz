name: JIP OCR and verified publication

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/sync_jip_ocr.py'
      - 'scripts/compare_jip_ocr_engines.py'
      - '.github/workflows/sync-jip-ocr.yml'
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: read

concurrency:
  group: jip-ocr-current-maloobchod
  cancel-in-progress: false

jobs:
  ocr:
    name: OCR a bezpečná publikace JIP Maloobchod
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověřit Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Nainstalovat český Tesseract a PDF renderer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng poppler-utils python3-pil
          tesseract --version | head -1
          tesseract --list-langs | grep -E '^(ces|eng)$'
          pdftoppm -v 2>&1 | head -1

      - name: OCR aktuálního 12stránkového Maloobchod letáku
        run: python3 scripts/sync_jip_ocr.py

      - name: Consensus kontrola staged PDF OCR v3 proti produkčnímu v2
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/sync-jip-pack-products" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"dry_run":true}' \
            > /tmp/jip-v2.json

          python3 - <<'PY' > /tmp/jip-v3-request.json
          import json
          with open('/tmp/jip-v2.json', encoding='utf-8') as f:
              v2 = json.load(f)
          if not v2.get('ok') or not v2.get('source_import_id'):
              raise SystemExit(f"JIP v2 dry-run failed: {v2}")
          print(json.dumps({
              'import_id': v2['source_import_id'],
              'engine': 'tesseract-cli-ces-jip-v3-pdf1800',
          }))
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/debug-jip-main-price-v5" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/jip-v3-request.json \
            > /tmp/jip-v3.json

          python3 scripts/compare_jip_ocr_engines.py \
            --v2 /tmp/jip-v2.json \
            --v3 /tmp/jip-v3.json \
            --output /tmp/jip-consensus.json

          python3 - <<'PY'
          import json
          with open('/tmp/jip-consensus.json', encoding='utf-8') as f:
              report = json.load(f)
          if not report.get('ok'):
              raise SystemExit(f"JIP consensus failed: {report}")
          if report.get('safe_incremental_count', 0) != 0:
              raise SystemExit(f"Unexpected automatic JIP incremental candidates: {report}")
          print(json.dumps({
              'recommendation': report.get('recommendation'),
              'exact_consensus_count': report.get('exact_consensus_count'),
              'unit_price_shadow_count': report.get('unit_price_shadow_count'),
              'price_conflict_count': report.get('price_conflict_count'),
              'v3_only_count': report.get('v3_only_count'),
              'production_engine_unchanged': True,
          }, ensure_ascii=False))
          PY

      - name: Izolovaný OCR probe cenovky RAJČE na straně 4
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/jip-pdf-url.txt
          import json
          with open('/tmp/jip-v2.json', encoding='utf-8') as f:
              result = json.load(f)
          source = str(result.get('source_document_url') or '').rstrip('/')
          if not source.startswith('https://www.jip-potraviny.cz/wp-content/uploads/file/MO-'):
              raise SystemExit(f'Unexpected JIP source URL: {source}')
          print(source + '/files/downloads/MO.pdf')
          PY
          PDF_URL="$(cat /tmp/jip-pdf-url.txt)"
          curl --fail-with-body --silent --show-error \
            -A 'slevao-jip-price-crop-probe/1.0' "$PDF_URL" -o /tmp/jip-mo.pdf
          pdftoppm -jpeg -f 4 -l 4 -singlefile -scale-to-x 3200 -scale-to-y -1 \
            /tmp/jip-mo.pdf /tmp/jip-p4-3200

          python3 - <<'PY'
          from PIL import Image, ImageEnhance, ImageOps
          image = Image.open('/tmp/jip-p4-3200.jpg').convert('L')
          # Coordinates come from two independent full-page OCR passes around
          # the large price immediately above 500 G / RAJČE soudkové.
          crop = image.crop((2320, 1250, 2980, 1505))
          crop.save('/tmp/jip-rajce-price-gray.png')
          ImageEnhance.Contrast(crop).enhance(1.8).save('/tmp/jip-rajce-price-contrast.png')
          ImageOps.autocontrast(crop).point(lambda p: 255 if p > 165 else 0).save('/tmp/jip-rajce-price-bw.png')
          PY

          : > /tmp/jip-rajce-readings.txt
          for IMG in gray contrast bw; do
            for PSM in 7 8 13; do
              VALUE="$(tesseract /tmp/jip-rajce-price-${IMG}.png stdout \
                -l eng --psm "$PSM" \
                -c tessedit_char_whitelist='0123456789,.' 2>/dev/null \
                | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')"
              printf '%s\n' "${IMG}:psm${PSM}:${VALUE}" | tee -a /tmp/jip-rajce-readings.txt
            done
          done

          python3 - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          rows = []
          normalized = []
          for line in Path('/tmp/jip-rajce-readings.txt').read_text(encoding='utf-8').splitlines():
              variant, psm, value = line.split(':', 2)
              matches = re.findall(r'\d{1,3}[,.]\d{2}', value)
              values = [m.replace('.', ',') for m in matches]
              rows.append({'variant': variant, 'psm': psm, 'raw': value, 'decimal_values': values})
              normalized.extend(values)
          counts = Counter(normalized)
          print(json.dumps({
              'ok': True,
              'crop': [2320, 1250, 2980, 1505],
              'readings': rows,
              'decimal_vote': counts,
              'winner': counts.most_common(1)[0] if counts else None,
          }, ensure_ascii=False))
          PY

      - name: Publikovat pouze bezpečně ověřené JIP kandidáty
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/sync-jip-pack-products" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"dry_run":false}' \
            | tee /tmp/jip-pack-result.json
          python3 - <<'PY'
          import json
          with open('/tmp/jip-pack-result.json', encoding='utf-8') as f:
              result = json.load(f)
          if not result.get('ok'):
              raise SystemExit(f"JIP pack publication failed: {result}")
          if result.get('engine') != 'tesseract-cli-ces-jip-v2':
              raise SystemExit(f"Unexpected production JIP OCR engine: {result}")
          print(json.dumps(result, ensure_ascii=False))
          PY
