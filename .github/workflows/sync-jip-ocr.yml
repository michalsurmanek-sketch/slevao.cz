name: JIP OCR and verified publication

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/sync_jip_ocr.py'
      - 'scripts/compare_jip_ocr_engines.py'
      - 'scripts/verify_jip_staged_candidates.py'
      - '.github/workflows/sync-jip-ocr.yml'
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: read

concurrency:
  group: jip-ocr-current-maloobchod
  cancel-in-progress: false

jobs:
  ocr:
    name: OCR a bezpečná publikace JIP Maloobchod
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověřit Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Nainstalovat český Tesseract a PDF renderer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng poppler-utils python3-pil
          tesseract --version | head -1
          tesseract --list-langs | grep -E '^(ces|eng)$'
          pdftoppm -v 2>&1 | head -1

      - name: OCR aktuálního 12stránkového Maloobchod letáku
        shell: bash
        run: |
          set +e
          max_attempts=4
          status=1
          for attempt in $(seq 1 "$max_attempts"); do
            echo "JIP OCR attempt $attempt/$max_attempts"
            python3 scripts/sync_jip_ocr.py
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 10))
              echo "::warning::JIP OCR failed with exit code $status; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::JIP OCR failed after $max_attempts attempts"
          exit "$status"

      - name: Consensus kontrola staged PDF OCR v3 proti produkčnímu v2
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/sync-jip-pack-products" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"dry_run":true}' \
            > /tmp/jip-v2.json

          python3 - <<'PY' > /tmp/jip-v3-request.json
          import json
          with open('/tmp/jip-v2.json', encoding='utf-8') as f:
              v2 = json.load(f)
          if not v2.get('ok') or not v2.get('source_import_id'):
              raise SystemExit(f"JIP v2 dry-run failed: {v2}")
          print(json.dumps({
              'import_id': v2['source_import_id'],
              'engine': 'tesseract-cli-ces-jip-v3-pdf1800',
          }))
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/debug-jip-main-price-v5" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/jip-v3-request.json \
            > /tmp/jip-v3.json

          python3 scripts/compare_jip_ocr_engines.py \
            --v2 /tmp/jip-v2.json \
            --v3 /tmp/jip-v3.json \
            --output /tmp/jip-consensus.json

          python3 - <<'PY'
          import json
          with open('/tmp/jip-consensus.json', encoding='utf-8') as f:
              report = json.load(f)
          if not report.get('ok'):
              raise SystemExit(f"JIP consensus failed: {report}")
          if report.get('safe_incremental_count', 0) != 0:
              raise SystemExit(f"Unexpected automatic JIP incremental candidates: {report}")
          print(json.dumps({
              'recommendation': report.get('recommendation'),
              'exact_consensus_count': report.get('exact_consensus_count'),
              'unit_price_shadow_count': report.get('unit_price_shadow_count'),
              'price_conflict_count': report.get('price_conflict_count'),
              'v3_only_count': report.get('v3_only_count'),
              'production_engine_unchanged': True,
          }, ensure_ascii=False))
          PY

      - name: Nezávisle ověřit v3-only cenovky ve vysokém rozlišení
        continue-on-error: true
        shell: bash
        run: |
          python3 scripts/verify_jip_staged_candidates.py \
            --v2 /tmp/jip-v2.json \
            --v3 /tmp/jip-v3.json \
            --consensus /tmp/jip-consensus.json \
            --output /tmp/jip-staged-verified.json

          python3 - <<'PY'
          import json
          with open('/tmp/jip-staged-verified.json', encoding='utf-8') as f:
              report = json.load(f)
          if not report.get('ok'):
              raise SystemExit(f"JIP staged verification failed: {report}")
          if report.get('candidate_count') != report.get('verified_count', 0) + report.get('rejected_count', 0):
              raise SystemExit(f"JIP staged verification accounting mismatch: {report}")
          print(json.dumps({
              'candidate_count': report.get('candidate_count'),
              'verified_count': report.get('verified_count'),
              'rejected_count': report.get('rejected_count'),
              'verified': [
                  {'title': x.get('title'), 'price': x.get('verified_price'), 'quantity': x.get('quantity'), 'page': x.get('page')}
                  for x in report.get('verified', [])
              ],
              'rejected': [
                  {'title': x.get('title'), 'staged_price': x.get('staged_price'), 'reason': x.get('reason')}
                  for x in report.get('rejected', [])
              ],
              'publication_mode': 'diagnostic_only',
          }, ensure_ascii=False))
          PY

      - name: Publikovat pouze bezpečně ověřené JIP kandidáty
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/sync-jip-pack-products" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"dry_run":false}' \
            | tee /tmp/jip-pack-result.json
          python3 - <<'PY'
          import json
          with open('/tmp/jip-pack-result.json', encoding='utf-8') as f:
              result = json.load(f)
          if not result.get('ok'):
              raise SystemExit(f"JIP pack publication failed: {result}")
          if result.get('engine') != 'tesseract-cli-ces-jip-v2':
              raise SystemExit(f"Unexpected production JIP OCR engine: {result}")
          print(json.dumps(result, ensure_ascii=False))
          PY
