name: JIP OCR (legacy manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jip-ocr-legacy-fallback
  cancel-in-progress: false

jobs:
  ocr:
    name: Ruční OCR záloha JIP letáku
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověřit Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Nainstalovat český Tesseract
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng
          tesseract --version | head -1
          tesseract --list-langs | grep -E '^(ces|eng)$'

      - name: OCR a uložení souřadnic do Supabase
        run: python3 scripts/sync_jip_ocr.py
