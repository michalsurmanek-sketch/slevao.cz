name: JIP OCR and verified publication

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/sync_jip_ocr.py'
      - 'scripts/compare_jip_ocr_engines.py'
      - '.github/workflows/sync-jip-ocr.yml'
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: read

concurrency:
  group: jip-ocr-current-maloobchod
  cancel-in-progress: false

jobs:
  ocr:
    name: OCR a bezpečná publikace JIP Maloobchod
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověřit Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Nainstalovat český Tesseract a PDF renderer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng poppler-utils
          tesseract --version | head -1
          tesseract --list-langs | grep -E '^(ces|eng)$'
          pdftoppm -v 2>&1 | head -1

      - name: OCR aktuálního 12stránkového Maloobchod letáku
        run: python3 scripts/sync_jip_ocr.py

      - name: Consensus kontrola staged PDF OCR v3 proti produkčnímu v2
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/sync-jip-pack-products" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"dry_run":true}' \
            > /tmp/jip-v2.json

          python3 - <<'PY' > /tmp/jip-v3-request.json
          import json
          with open('/tmp/jip-v2.json', encoding='utf-8') as f:
              v2 = json.load(f)
          if not v2.get('ok') or not v2.get('source_import_id'):
              raise SystemExit(f"JIP v2 dry-run failed: {v2}")
          print(json.dumps({
              'import_id': v2['source_import_id'],
              'engine': 'tesseract-cli-ces-jip-v3-pdf1800',
          }))
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/debug-jip-main-price-v5" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/jip-v3-request.json \
            > /tmp/jip-v3.json

          python3 scripts/compare_jip_ocr_engines.py \
            --v2 /tmp/jip-v2.json \
            --v3 /tmp/jip-v3.json \
            --output /tmp/jip-consensus.json

          python3 - <<'PY'
          import json
          with open('/tmp/jip-consensus.json', encoding='utf-8') as f:
              report = json.load(f)
          if not report.get('ok'):
              raise SystemExit(f"JIP consensus failed: {report}")
          if report.get('safe_incremental_count', 0) != 0:
              raise SystemExit(f"Unexpected automatic JIP incremental candidates: {report}")
          print(json.dumps({
              'recommendation': report.get('recommendation'),
              'exact_consensus_count': report.get('exact_consensus_count'),
              'unit_price_shadow_count': report.get('unit_price_shadow_count'),
              'price_conflict_count': report.get('price_conflict_count'),
              'v3_only_count': report.get('v3_only_count'),
              'production_engine_unchanged': True,
          }, ensure_ascii=False))
          PY

      - name: Třetí OCR probe ceny RAJČE na straně 4
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/jip-pdf-url.txt
          import json
          with open('/tmp/jip-v2.json', encoding='utf-8') as f:
              result = json.load(f)
          source = str(result.get('source_document_url') or '').rstrip('/')
          if not source.startswith('https://www.jip-potraviny.cz/wp-content/uploads/file/MO-'):
              raise SystemExit(f'Unexpected JIP source URL: {source}')
          print(source + '/files/downloads/MO.pdf')
          PY
          PDF_URL="$(cat /tmp/jip-pdf-url.txt)"
          curl --fail-with-body --silent --show-error \
            -A 'slevao-jip-third-ocr-probe/1.0' "$PDF_URL" -o /tmp/jip-mo.pdf
          pdftoppm -jpeg -f 4 -l 4 -singlefile -scale-to-x 3200 -scale-to-y -1 \
            /tmp/jip-mo.pdf /tmp/jip-p4-3200

          for PSM in 11 12 6; do
            tesseract /tmp/jip-p4-3200.jpg /tmp/jip-p4-psm${PSM} \
              -l ces+eng --psm "$PSM" tsv 2>/dev/null
          done

          python3 - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          reports = []
          for psm in (11, 12, 6):
              path = Path(f'/tmp/jip-p4-psm{psm}.tsv')
              rows = []
              with path.open(encoding='utf-8', errors='replace', newline='') as f:
                  for row in csv.DictReader(f, delimiter='\t', quoting=csv.QUOTE_NONE):
                      text = (row.get('text') or '').strip()
                      if not text:
                          continue
                      try:
                          item = {
                              'text': text,
                              'x': int(row.get('left') or 0),
                              'y': int(row.get('top') or 0),
                              'w': int(row.get('width') or 0),
                              'h': int(row.get('height') or 0),
                              'conf': float(row.get('conf') or -1),
                          }
                      except ValueError:
                          continue
                      rows.append(item)

              anchors = [r for r in rows if re.search(r'raj', r['text'], re.I)]
              evidence = []
              for anchor in anchors:
                  ax = anchor['x'] + anchor['w'] / 2
                  nearby = []
                  for r in rows:
                      rx = r['x'] + r['w'] / 2
                      dy = r['y'] - anchor['y']
                      if abs(rx - ax) <= 650 and -420 <= dy <= 160:
                          if re.search(r'(\d|raj|soud|500|kg|g$)', r['text'], re.I):
                              nearby.append(r)
                  nearby.sort(key=lambda r: (r['y'], r['x']))
                  evidence.append({'anchor': anchor, 'nearby': nearby})
              reports.append({'psm': psm, 'anchors': len(anchors), 'evidence': evidence})

          print(json.dumps({'ok': True, 'page': 4, 'render_width': 3200, 'reports': reports}, ensure_ascii=False))
          PY

      - name: Publikovat pouze bezpečně ověřené JIP kandidáty
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/sync-jip-pack-products" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"dry_run":false}' \
            | tee /tmp/jip-pack-result.json
          python3 - <<'PY'
          import json
          with open('/tmp/jip-pack-result.json', encoding='utf-8') as f:
              result = json.load(f)
          if not result.get('ok'):
              raise SystemExit(f"JIP pack publication failed: {result}")
          if result.get('engine') != 'tesseract-cli-ces-jip-v2':
              raise SystemExit(f"Unexpected production JIP OCR engine: {result}")
          print(json.dumps(result, ensure_ascii=False))
          PY
