name: Build static homepage v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Assemble real homepage files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected = {
              'index': '669924cc66b447e78339142d50dfbcf86e0ea99199d7a7040d2527f1e23f8c65',
              'css': 'a1861642b47ca7efb377ad803786198f942de31a41abe06941285df873cb973a',
              'js': '35a686d38a636b61e6f1b4fa3222acee9dff557d9125538e063715d9abd447f7',
          }

          def assemble(prefix, count, destination):
              root = Path('.home-v2-parts')
              parts = [root / f'{prefix}.{index:02d}.b64' for index in range(1, count + 1)]
              missing = [str(path) for path in parts if not path.exists()]
              if missing:
                  raise SystemExit(f'Missing source parts: {missing}')
              encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
              data = gzip.decompress(base64.b64decode(encoded))
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected[prefix]:
                  raise SystemExit(f'Invalid {prefix} hash: {digest}')
              target = Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          assemble('index', 2, 'index.html')
          assemble('css', 3, 'assets/home-v2.css')
          assemble('js', 5, 'assets/home-v2.js')
          PY

      - name: Restore normal search suggestions
        run: git show a7d892d684438c64276490ad25c7a245e46ed9d3:assets/search-suggest.js > assets/search-suggest.js

      - name: Verify generated homepage
        run: |
          node --check assets/home-v2.js
          node --check assets/search-suggest.js
          grep -q 'assets/home-v2.css?v=20260802-1' index.html
          grep -q 'assets/home-v2.js?v=20260802-1' index.html
          grep -q 'Nakupuj podle kategorie' index.html
          grep -q 'Letáky a nabídky obchodů' index.html
          grep -q 'Končí dnes' index.html
          grep -q 'Porovnat' assets/home-v2.js
          ! grep -q 'DecompressionStream' assets/search-suggest.js
          ! grep -q '.home-v2-parts' assets/search-suggest.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  value = dict(attrs).get('id')
                  if value:
                      self.ids.append(value)

          parser = Parser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          duplicates = [key for key, count in Counter(parser.ids).items() if count > 1]
          if duplicates:
              raise SystemExit(f'Duplicate HTML ids: {duplicates}')
          PY

      - name: Remove temporary compressed sources
        run: rm -rf .home-v2-parts

      - name: Commit assembled static homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/home-v2.css assets/home-v2.js assets/search-suggest.js .home-v2-parts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy homepage v2 as static files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
