name: Hledání kvalitních produktových fotografií

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximální počet produktů
        required: false
        default: '30'
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/discover-product-images/**'
      - '.github/workflows/discover-product-images.yml'

concurrency:
  group: discover-product-images
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ověřit konfiguraci
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo 'Chybí GitHub secret SUPABASE_URL' && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo 'Chybí GitHub secret SUPABASE_SERVICE_ROLE_KEY' && exit 1)

      - name: Naplnit frontu kandidátů
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$SUPABASE_URL/functions/v1/discover-product-images" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"limit\":$LIMIT}"
