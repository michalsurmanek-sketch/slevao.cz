name: Hledání kvalitních produktových fotografií

# Generování neznačkových fotografií je záměrně navázané na stávající image workflow.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximální počet produktů pro hledání existujících fotografií
        required: false
        default: '30'
      lidl_catalog_limit:
        description: Bezpečný recheck aktuálních Lidl nabídek proti ověřenému katalogu
        required: false
        default: '20'
      lidl_limit:
        description: Prioritní dávka aktuálních Lidl produktů bez ověřené fotografie
        required: false
        default: '10'
      generic_limit:
        description: Maximální počet neznačkových produktů pro generování
        required: false
        default: '5'
  schedule:
    - cron: '41 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/invoke_supabase_edge.sh'
      - '.github/workflows/discover-product-images.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/discover-product-images/**'
      - 'supabase/functions/generate-generic-product-images/**'
      - 'scripts/invoke_supabase_edge.sh'
      - '.github/workflows/discover-product-images.yml'

concurrency:
  group: discover-product-images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validace image Edge retry helperu
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Ověřit Bash syntaxi
        run: bash -n scripts/invoke_supabase_edge.sh

  discover:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ověřit konfiguraci
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo 'Chybí GitHub secret SUPABASE_URL' && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo 'Chybí GitHub secret SUPABASE_SERVICE_ROLE_KEY' && exit 1)
          bash -n scripts/invoke_supabase_edge.sh

      - name: Bezpečně doplnit Lidl obrázky z ověřeného katalogu
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIDL_CATALOG_LIMIT: ${{ github.event.inputs.lidl_catalog_limit || '20' }}
        run: |
          set -euo pipefail
          if ! [[ "$LIDL_CATALOG_LIMIT" =~ ^[0-9]+$ ]] || (( LIDL_CATALOG_LIMIT < 1 || LIDL_CATALOG_LIMIT > 80 )); then
            echo "Neplatný Lidl catalog limit: $LIDL_CATALOG_LIMIT"
            exit 1
          fi
          response="$(scripts/invoke_supabase_edge.sh \
            match-product-catalog \
            "{\"limit\":$LIDL_CATALOG_LIMIT,\"store_slug\":\"lidl\",\"recheck_missing_images\":true}")"
          printf '%s\n' "$response"
          mode="$(jq -r '.mode // empty' <<<"$response")"
          if [[ "$mode" != 'recheck_missing_images' ]]; then
            echo "Neočekávaný catalog matcher režim: ${mode:-chybí}"
            exit 1
          fi
          checked="$(jq -r '.checked // 0' <<<"$response")"
          matched="$(jq -r '.matched // 0' <<<"$response")"
          retained="$(jq -r '.retained // 0' <<<"$response")"
          needs_review="$(jq -r '.needs_review // 0' <<<"$response")"
          failed="$(jq -r '.failed // 0' <<<"$response")"
          hydrated="$((matched + retained))"
          printf '### Lidl verified katalog recheck\n- Zkontrolováno: `%s`\n- Doplněno obrázků: `%s`\n- Matched: `%s`\n- Retained: `%s`\n- Needs review: `%s`\n- Failed: `%s`\n' "$checked" "$hydrated" "$matched" "$retained" "$needs_review" "$failed" >> "$GITHUB_STEP_SUMMARY"
          if (( failed > 0 )); then
            echo "::warning title=Lidl catalog recheck částečně selhal::$failed nabídek skončilo chybou"
          fi

      - name: Naplnit frontu kandidátů z existujících zdrojů
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: |
          set -euo pipefail
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]] || (( LIMIT < 1 || LIMIT > 100 )); then
            echo "Neplatný image discovery limit: $LIMIT"
            exit 1
          fi
          response="$(scripts/invoke_supabase_edge.sh discover-product-images "{\"limit\":$LIMIT}")"
          printf '%s\n' "$response"
          blocked_reason="$(jq -r '.blocked_reason // empty' <<<"$response")"
          if [[ -n "$blocked_reason" ]]; then
            retry_after="$(jq -r '.retry_after // empty' <<<"$response")"
            echo "::warning title=Hledání produktových fotografií pozastaveno::$blocked_reason${retry_after:+; retry_after=$retry_after}"
            printf '### ⚠️ Hledání produktových fotografií pozastaveno\n- Důvod: `%s`\n- Další pokus po: `%s`\n' "$blocked_reason" "${retry_after:-neuvedeno}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prioritně zkontrolovat aktuální Lidl produkty
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIDL_LIMIT: ${{ github.event.inputs.lidl_limit || '10' }}
        run: |
          set -euo pipefail
          if ! [[ "$LIDL_LIMIT" =~ ^[0-9]+$ ]] || (( LIDL_LIMIT < 1 || LIDL_LIMIT > 100 )); then
            echo "Neplatný Lidl image discovery limit: $LIDL_LIMIT"
            exit 1
          fi
          response="$(scripts/invoke_supabase_edge.sh discover-product-images "{\"limit\":$LIDL_LIMIT,\"store_slug\":\"lidl\"}")"
          printf '%s\n' "$response"
          blocked_reason="$(jq -r '.blocked_reason // empty' <<<"$response")"
          if [[ -n "$blocked_reason" ]]; then
            retry_after="$(jq -r '.retry_after // empty' <<<"$response")"
            echo "::warning title=Lidl fotografie pozastaveny::$blocked_reason${retry_after:+; retry_after=$retry_after}"
            printf '### ⚠️ Prioritní Lidl image discovery pozastaveno\n- Důvod: `%s`\n- Další pokus po: `%s`\n' "$blocked_reason" "${retry_after:-neuvedeno}" >> "$GITHUB_STEP_SUMMARY"
          else
            checked="$(jq -r '.checked // 0' <<<"$response")"
            created="$(jq -r '.created // 0' <<<"$response")"
            without_match="$(jq -r '.without_match // 0' <<<"$response")"
            printf '### Lidl image discovery\n- Zkontrolováno: `%s`\n- Kandidátů: `%s`\n- Bez shody: `%s`\n' "$checked" "$created" "$without_match" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Zpracovat bezpečnou dávku neznačkových produktů
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENERIC_LIMIT: ${{ github.event.inputs.generic_limit || '5' }}
        run: |
          set -euo pipefail
          if ! [[ "$GENERIC_LIMIT" =~ ^[0-9]+$ ]] || (( GENERIC_LIMIT < 1 || GENERIC_LIMIT > 50 )); then
            echo "Neplatný generic image limit: $GENERIC_LIMIT"
            exit 1
          fi
          response="$(scripts/invoke_supabase_edge.sh generate-generic-product-images "{\"limit\":$GENERIC_LIMIT}")"
          printf '%s\n' "$response"
          blocked_reason="$(jq -r '.blocked_reason // empty' <<<"$response")"
          if [[ -n "$blocked_reason" ]]; then
            retry_after="$(jq -r '.retry_after // empty' <<<"$response")"
            echo "::warning title=Generování produktových fotografií pozastaveno::$blocked_reason${retry_after:+; retry_after=$retry_after}"
            printf '### ⚠️ Generování produktových fotografií pozastaveno\n- Důvod: `%s`\n- Další pokus po: `%s`\n' "$blocked_reason" "${retry_after:-neuvedeno}" >> "$GITHUB_STEP_SUMMARY"
          fi
