name: Hledání kvalitních produktových fotografií

# Generování neznačkových fotografií je záměrně navázané na stávající image workflow.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximální počet produktů pro hledání existujících fotografií
        required: false
        default: '30'
      generic_limit:
        description: Maximální počet neznačkových produktů pro generování
        required: false
        default: '5'
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/discover-product-images/**'
      - 'supabase/functions/generate-generic-product-images/**'
      - '.github/workflows/discover-product-images.yml'

concurrency:
  group: discover-product-images
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ověřit konfiguraci
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo 'Chybí GitHub secret SUPABASE_URL' && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo 'Chybí GitHub secret SUPABASE_SERVICE_ROLE_KEY' && exit 1)

      - name: Naplnit frontu kandidátů z existujících zdrojů
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$SUPABASE_URL/functions/v1/discover-product-images" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"limit\":$LIMIT}")"
          printf '%s\n' "$response"
          blocked_reason="$(jq -r '.blocked_reason // empty' <<<"$response")"
          if [[ -n "$blocked_reason" ]]; then
            retry_after="$(jq -r '.retry_after // empty' <<<"$response")"
            echo "::warning title=Hledání produktových fotografií pozastaveno::$blocked_reason${retry_after:+; retry_after=$retry_after}"
            printf '### ⚠️ Hledání produktových fotografií pozastaveno\n- Důvod: `%s`\n- Další pokus po: `%s`\n' "$blocked_reason" "${retry_after:-neuvedeno}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Zpracovat bezpečnou dávku neznačkových produktů
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENERIC_LIMIT: ${{ github.event.inputs.generic_limit || '5' }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$SUPABASE_URL/functions/v1/generate-generic-product-images" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"limit\":$GENERIC_LIMIT}")"
          printf '%s\n' "$response"
          blocked_reason="$(jq -r '.blocked_reason // empty' <<<"$response")"
          if [[ -n "$blocked_reason" ]]; then
            retry_after="$(jq -r '.retry_after // empty' <<<"$response")"
            echo "::warning title=Generování produktových fotografií pozastaveno::$blocked_reason${retry_after:+; retry_after=$retry_after}"
            printf '### ⚠️ Generování produktových fotografií pozastaveno\n- Důvod: `%s`\n- Další pokus po: `%s`\n' "$blocked_reason" "${retry_after:-neuvedeno}" >> "$GITHUB_STEP_SUMMARY"
          fi
