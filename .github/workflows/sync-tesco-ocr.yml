name: Tesco OCR (Apollo fallback)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_tesco_ocr.py'
      - 'scripts/sync_terno_ocr.py'
      - '.github/workflows/sync-tesco-ocr.yml'
  schedule:
    # Tesco Hypermarket standardně překlápí týdenní leták ve středu.
    # Úterní večer zkusí přednačíst nový zdroj; středeční retry pokryjí pozdější publikaci upstreamu.
    - cron: '17 21 * * 2'
    - cron: '17 4,6 * * 3'

permissions:
  contents: read

concurrency:
  group: tesco-ocr-apollo-fallback
  cancel-in-progress: true

jobs:
  ocr:
    name: OCR oficiálního Tesco Hypermarket Apollo letáku
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověřit Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Ověřit Python syntax
        run: python3 -m py_compile scripts/sync_tesco_ocr.py scripts/sync_terno_ocr.py

      - name: Nainstalovat český Tesseract, dekodér obrázků a PDF renderer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng python3-pil poppler-utils
          tesseract --version | head -1
          tesseract --list-langs | grep -E '^(ces|eng)$'
          pdftoppm -v 2>&1 | head -1
          python3 -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Načíst kanonický Apollo zdroj, provést OCR a uložit souřadnice
        run: python3 scripts/sync_tesco_ocr.py
