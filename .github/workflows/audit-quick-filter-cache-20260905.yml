name: Audit quick filter cache 20260905

on:
  push:
    branches:
      - audit/quick-filter-cache-20260905
    paths:
      - '.github/workflows/audit-quick-filter-cache-20260905.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/quick-filter-cache-20260905
      - name: Refresh quick filter cache key
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/home-quick-food-filter\.js?v=20260829-4/home-quick-food-filter.js?v=20260905-1/g' index.html
          cat > tests/homepage-quick-filter-cache-version.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html','utf8');
          const matches = [...html.matchAll(/assets\/home-quick-food-filter\.js\?v=([^"']+)/g)].map((m) => m[1]);
          assert.deepEqual(matches, ['20260905-1']);
          assert.doesNotMatch(html, /home-quick-food-filter\.js\?v=20260829-4/);
          console.log('homepage quick filter cache version: OK');
          EOF
          node tests/homepage-quick-filter-cache-version.mjs
          git diff --check
      - name: Commit audited fix and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/audit-quick-filter-cache-20260905.yml
          git add index.html tests/homepage-quick-filter-cache-version.mjs .github/workflows/audit-quick-filter-cache-20260905.yml
          git commit -m 'fix: refresh quick-filter cache after keyboard fix'
          git push origin HEAD:audit/quick-filter-cache-20260905
