name: Propojit administraci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_admin_navigation.py'
      - '.github/workflows/patch-admin-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upravit navigaci
        run: python scripts/patch_admin_navigation.py
      - name: Commitnout změnu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "feat(admin): connect all administration pages"
          git push
