name: Audit homepage enter scroll guard

on:
  push:
    paths:
      - '.github/workflows/audit-homepage-enter-scroll-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Allow user initiated Enter scroll only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          old = "        document.addEventListener('click', markUserClick, true);\n"
          new = old + "        document.addEventListener('keydown', (event) => { if (event?.isTrusted && event.key === 'Enter') allowProgrammaticScrollUntil = performance.now() + 4000; }, true);\n"
          if new not in s:
              if old not in s: raise SystemExit('index scroll guard anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('assets/home-quick-food-filter.js')
          s = p.read_text()
          old = "    document.addEventListener('click', markUserScrollIntent, true);\n"
          new = old + "    document.addEventListener('keydown', (event) => {\n      if (event?.isTrusted && event.key === 'Enter') markUserScrollIntent(event);\n    }, true);\n"
          if new not in s:
              if old not in s: raise SystemExit('fallback scroll guard anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cat > tests/homepage-scroll-guard-keyboard.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const index = fs.readFileSync('index.html','utf8');
          const quick = fs.readFileSync('assets/home-quick-food-filter.js','utf8');
          assert.match(index, /keydown[^\n]*event\.key === 'Enter'/);
          assert.match(quick, /event\.key === 'Enter'[\s\S]{0,80}markUserScrollIntent\(event\)/);
          assert.match(index, /window\.scrollTo = \(\.\.\.args\) => userAllowedScroll\(\)/);
          console.log('homepage Enter scroll intent guard: OK');
          EOF
          node tests/homepage-scroll-guard-keyboard.mjs
          git diff --check
      - name: Commit audited fix and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/audit-homepage-enter-scroll-guard.yml
          git add index.html assets/home-quick-food-filter.js tests/homepage-scroll-guard-keyboard.mjs .github/workflows/audit-homepage-enter-scroll-guard.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: allow Enter initiated homepage result scroll'
          git push origin HEAD:main
