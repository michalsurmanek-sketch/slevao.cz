name: Nasadit přípravu podepsaného uploadu

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/prepare-manual-leaflet-upload/**'
      - '.github/workflows/deploy-prepare-manual-leaflet-upload.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prepare-manual-leaflet-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Nasadit prepare-manual-leaflet-upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ověřit zdroj Edge Function
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/prepare-manual-leaflet-upload/index.ts
          grep -Fq "Deno.serve" supabase/functions/prepare-manual-leaflet-upload/index.ts
          grep -Fq "createSignedUploadUrl" supabase/functions/prepare-manual-leaflet-upload/index.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit přípravu podepsaného uploadu
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy prepare-manual-leaflet-upload \
            --project-ref uhampjdqjxmbhaptgitn
