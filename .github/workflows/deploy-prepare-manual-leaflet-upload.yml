name: Nasadit přípravu podepsaného uploadu

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/prepare-manual-leaflet-upload/**'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/prepare-manual-leaflet-upload/**'
      - '.github/workflows/deploy-prepare-manual-leaflet-upload.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prepare-manual-leaflet-upload-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Ověřit prepare-manual-leaflet-upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ověřit zdroj Edge Function
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/prepare-manual-leaflet-upload/index.ts
          grep -Fq "Deno.serve" supabase/functions/prepare-manual-leaflet-upload/index.ts
          grep -Fq "createSignedUploadUrl" supabase/functions/prepare-manual-leaflet-upload/index.ts

  deploy:
    name: Nasadit prepare-manual-leaflet-upload
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Ověřit přístupový token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Nasadit přípravu podepsaného uploadu
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy prepare-manual-leaflet-upload \
            --project-ref uhampjdqjxmbhaptgitn
