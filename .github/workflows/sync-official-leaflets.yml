name: Synchronizace oficiálních letáků

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/sync-official-leaflet-sources/**'
      - '.github/workflows/sync-official-leaflets.yml'
  schedule:
    - cron: '22 */3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-official-leaflets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        if: github.event_name != 'schedule'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rozpoznat i PDF odkazy bez přípony
        if: github.event_name != 'schedule'
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/sync-official-leaflet-sources/index.ts')
          text = path.read_text(encoding='utf-8')

          download_function = r'''
function extractDownloadLinks(html: string, baseUrl: string): string[] {
  const links = new Set<string>();
  const pattern = /<a\b([^>]*\bhref=["']([^"']+)["'][^>]*)>([\s\S]*?)<\/a>/gi;
  let match: RegExpExecArray | null;
  while ((match = pattern.exec(html))) {
    const attributes = match[1] || '';
    const body = String(match[3] || '').replace(/<[^>]+>/g, ' ');
    const label = `${attributes} ${body}`;
    if (!/(download|stahnout|stáhnout|letak|leták|prospekt|katalog|catalog|leaflet|pdf)/i.test(label)) continue;
    const url = absoluteUrl(baseUrl, match[2]);
    if (url) links.add(url);
  }
  return [...links].slice(0, 10);
}

'''
          marker = 'function extractAssetLinks(html: string, baseUrl: string): string[] {'
          if 'function extractDownloadLinks(' not in text:
              if marker not in text:
                  raise SystemExit('Nenalezen bod pro vložení extractDownloadLinks.')
              text = text.replace(marker, download_function + marker, 1)

          old = '''  const linkedPages = extractLeafletLinks(landing.text, landing.url);
  for (const pageUrl of linkedPages.slice(0, 6)) {
    try {
      const page = await fetchText(pageUrl, landing.url, 10_000);
'''
          new = '''  const linkedPages = [...new Set([
    ...extractLeafletLinks(landing.text, landing.url),
    ...extractDownloadLinks(landing.text, landing.url),
  ])];
  for (const pageUrl of linkedPages.slice(0, 10)) {
    try {
      // Některé oficiální weby posílají PDF přes dynamickou adresu bez .pdf.
      // Nejdřív proto ověříme skutečný Content-Type a podpis souboru.
      const directPdf = await validatePdf(pageUrl, landing.url);
      if (directPdf) {
        candidateMap.set(directPdf, { url: directPdf, referer: landing.url, score: 180 });
        continue;
      }
      const page = await fetchText(pageUrl, landing.url, 10_000);
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '...extractDownloadLinks(landing.text, landing.url)' not in text:
              raise SystemExit('Nenalezen blok linkedPages pro opravu.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Uložit trvalou opravu parseru
        if: github.event_name != 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/sync-official-leaflet-sources/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Support extensionless official leaflet PDFs"
            git push origin HEAD:main
          fi

      - name: Setup Supabase CLI
        if: github.event_name != 'schedule'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Nasadit vyhledávač letáků
        if: github.event_name != 'schedule'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN' && exit 1)
          supabase functions deploy sync-official-leaflet-sources \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Počkat na dostupnost nové verze
        if: github.event_name != 'schedule'
        run: sleep 8

      - name: Najít a doplnit oficiální letáky po obchodech
        shell: bash
        run: |
          set -uo pipefail
          endpoint='https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/sync-official-leaflet-sources'
          stores=(
            enapo flop terno trefa jip norma zabka brnenka cba jednota konzum tempo ratio kubik
            rosa-market tamda potraviny-muj-obchod pramen-cz eso-market rossmann teta dm tedi pepco
            kik takko obi hornbach bauhaus mountfield dek pro-doma stavmat datart planeo okay alza
            smarty ikea jysk moebelix sconto asko xxxlutz decathlon sportisimo intersport super-zoo
            petcenter dr-max benu pilulka auto-kelly
          )

          export endpoint
          printf '%s\n' "${stores[@]}" | xargs -P 4 -I '{}' bash -c '
            slug="$1"
            output="$(mktemp)"
            code="$(curl --silent --show-error --location \
              --retry 2 --retry-delay 3 --max-time 180 \
              --output "$output" --write-out "%{http_code}" \
              --request POST \
              --header "content-type: application/json" \
              --data "{\"store_slug\":\"$slug\",\"limit\":1}" \
              "$endpoint" || true)"
            printf "\n===== %s | HTTP %s =====\n" "$slug" "$code"
            cat "$output"
            echo
            rm -f "$output"
            case "$code" in
              2??) exit 0 ;;
              *) exit 1 ;;
            esac
          ' _ '{}'
