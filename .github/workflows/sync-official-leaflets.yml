name: Official leaflet synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: '22 */3 * * *'
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/sync-official-leaflet-sources/**'
      - '.github/workflows/sync-official-leaflets.yml'

concurrency:
  group: official-leaflet-synchronization
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy leaflet resolver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'Missing GitHub secret SUPABASE_ACCESS_TOKEN'
            exit 1
          }

      - name: Deploy official leaflet resolver
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-official-leaflet-sources \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Wait for deployment
        run: sleep 8

  synchronize:
    name: Sync ${{ matrix.store }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        store:
          - enapo
          - flop
          - terno
          - trefa
          - jip
          - norma
          - zabka
          - brnenka
          - cba
          - jednota
          - konzum
          - tempo
          - ratio
          - kubik
          - rosa-market
          - tamda
          - potraviny-muj-obchod
          - pramen-cz
          - eso-market
          - rossmann
          - teta
          - dm
          - tedi
          - pepco
          - kik
          - takko
          - obi
          - hornbach
          - bauhaus
          - mountfield
          - dek
          - pro-doma
          - stavmat
          - datart
          - planeo
          - okay
          - alza
          - smarty
          - ikea
          - jysk
          - moebelix
          - sconto
          - asko
          - xxxlutz
          - decathlon
          - sportisimo
          - intersport
          - super-zoo
          - petcenter
          - dr-max
          - benu
          - pilulka
          - auto-kelly
    steps:
      - name: Find current official leaflet
        env:
          STORE_SLUG: ${{ matrix.store }}
        run: |
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --location \
            --retry 2 \
            --retry-delay 3 \
            --max-time 300 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data "{\"store_slug\":\"${STORE_SLUG}\",\"limit\":1,\"force\":true}" \
            'https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/sync-official-leaflet-sources')"

          cat "$response_file"
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Synchronization failed with HTTP $http_code"
            exit 1
          fi
