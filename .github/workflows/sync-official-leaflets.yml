name: Synchronizace oficiálních letáků

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/sync-official-leaflet-sources/**'
      - '.github/workflows/sync-official-leaflets.yml'
  schedule:
    - cron: '22 */3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-official-leaflets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        if: github.event_name != 'schedule'
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: github.event_name != 'schedule'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Nasadit vyhledávač letáků
        if: github.event_name != 'schedule'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Chybí GitHub secret SUPABASE_ACCESS_TOKEN' && exit 1)
          supabase functions deploy sync-official-leaflet-sources \
            --project-ref uhampjdqjxmbhaptgitn \
            --no-verify-jwt

      - name: Počkat na dostupnost nové verze
        if: github.event_name != 'schedule'
        run: sleep 8

      - name: Najít a doplnit oficiální letáky
        run: |
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 1200 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"limit":80}' \
            'https://uhampjdqjxmbhaptgitn.supabase.co/functions/v1/sync-official-leaflet-sources')"
          cat "$response_file"
          echo
          test "$http_code" -ge 200 -a "$http_code" -lt 300
