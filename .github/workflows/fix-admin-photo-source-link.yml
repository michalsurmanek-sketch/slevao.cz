name: Opravit zobrazení odkazu u fotografie

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-photo-source-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upravit admin stránku
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-pridat-fotografii.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            '<div class="field"><label>HTTPS odkaz na konkrétní produkt</label><input id="pageUrl"',
            '<div class="field"><label id="pageUrlLabel">HTTPS odkaz na nalezený zdroj</label><input id="pageUrl"'
          )

          old = "const firstSource=candidates.find(c=>isProductPageUrl(c?.source_url));if(firstSource){$('pageUrl').value=firstSource.source_url;$('pageUrl').dispatchEvent(new Event('input',{bubbles:true}))}else{$('pageUrl').value=''}showAuto(`Nalezeno ${candidates.length} návrhů. Všechny byly uloženy do fronty ke schválení.${firstSource?' Produktová stránka byla automaticky doplněna níže.':' Zdroj poskytl pouze přímý obrázek; ten už není potřeba znovu načítat.'}`)"
          new = "const firstSource=candidates.find(c=>typeof c?.source_url==='string'&&/^https:\\/\\//i.test(c.source_url))||candidates.find(c=>typeof c?.image_url==='string'&&/^https:\\/\\//i.test(c.image_url));if(firstSource){const foundUrl=firstSource.source_url||firstSource.image_url;$('pageUrl').value=foundUrl;$('pageUrlLabel').textContent=isDirectImageUrl(foundUrl)?'HTTPS odkaz na nalezený obrázek':'HTTPS odkaz na konkrétní produkt';$('inspect').textContent=isDirectImageUrl(foundUrl)?'Otevřít obrázek':'Načíst fotografii z odkazu';$('pageUrl').dispatchEvent(new Event('input',{bubbles:true}))}else{$('pageUrl').value='';$('pageUrlLabel').textContent='HTTPS odkaz na nalezený zdroj';$('inspect').textContent='Načíst fotografii z odkazu'}showAuto(`Nalezeno ${candidates.length} návrhů. Všechny byly uloženy do fronty ke schválení.${firstSource?' Nalezený odkaz je zobrazen níže.':''}`)"
          if old not in s:
              raise SystemExit('Nenalezen blok automatického doplnění odkazu')
          s = s.replace(old, new)

          old2 = "if(isDirectImageUrl(page_url)){show('Toto je přímý odkaz na obrázek, ne produktová stránka. Fotografie už je uložená ve frontě ke schválení.','err');return}"
          new2 = "if(isDirectImageUrl(page_url)){window.open(page_url,'_blank','noopener');show('Otevřel jsem přímý odkaz na nalezený obrázek. Fotografie už je uložená ve frontě ke schválení.');return}"
          if old2 not in s:
              raise SystemExit('Nenalezen blok přímého obrázku')
          s = s.replace(old2, new2)

          s = s.replace(
            "$('pageUrl').value='';closePanel()",
            "$('pageUrl').value='';$('pageUrlLabel').textContent='HTTPS odkaz na nalezený zdroj';$('inspect').textContent='Načíst fotografii z odkazu';closePanel()"
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitnout opravu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-pridat-fotografii.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): show image or product source URL"
          git push
